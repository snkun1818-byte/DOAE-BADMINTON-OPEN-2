 r.forEach(t=>{t.diff=t.sp-t.sl;t.rd=t.rf-t.rl});r.sort((a,b)=>b.diff-a.diff||b.rd-a.rd||a.id.localeCompare(b.id));let complete=d.battles.filter(b=>b.id<7).every(b=>b.confirmed);for(let i=0;i<r.length;){let j=i+1;while(j<r.length&&r[j].diff===r[i].diff&&r[j].rd===r[i].rd)j++;let g=r.slice(i,j),k=g.map(t=>t.id).sort().join('');let order=d.tieOrders[k];if(g.length===1){if(r.some(t=>t.played))g[0].rank=i+1}else if(complete&&Array.isArray(order)&&order.slice().sort().join('')===k){g.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));g.forEach((t,n)=>t.rank=i+n+1);r.splice(i,g.length,...g)}else if(complete)g.forEach(t=>t.tie=k);i=j}return r}

function validateLineups(d,bid){let b=d.battles.find(b=>b.id===bid);ensure(b&&b.a&&b.b,'ยังไม่ทราบทีม');let seen=new Set();for(let m of bm(d,bid)){if(!m.lineup)continue;ensure(Array.isArray(m.lineup)&&m.lineup.length===4,'Line-up ไม่ถูกต้อง');for(let i=0;i<4;i++){let id=m.lineup[i];if(id===null)continue;let p=player(d,id);ensure(p&&p.active&&p.team===(i<2?b.a:b.b)&&p.level===m.levels[i%2],'ผู้เล่นไม่ตรงทีม/ระดับมือ: Match '+m.id);let k=m.wave+'|'+id;ensure(!seen.has(k),'นักกีฬาลงซ้ำใน Wave '+m.wave+' ของ Battle '+bid);seen.add(k)}}return true}
function validateSchedule(d){let pairs=new Set();for(let b of d.battles.filter(b=>b.id<7)){ensure(IDS.includes(b.a)&&IDS.includes(b.b)&&b.a!==b.b,'ทีม Battle ไม่ถูกต้อง');pairs.add([b.a,b.b].sort().join(''))}ensure(pairs.size===6,'รอบแรกต้องพบกันหมด 6 คู่ไม่ซ้ำ');for(let b of d.battles){let slots=new Set();for(let m of bm(d,b.id)){ensure(m.levels.length===2&&m.levels.every(l=>LEVELS.includes(l)),'ระดับมือไม่ถูกต้อง');ensure(Number.isInteger(m.court)&&m.court>=1&&m.court<=3&&Number.isInteger(m.wave)&&m.wave>=1&&m.wave<=9,'สนาม/Wave ไม่ถูกต้อง');let k=m.wave+'-'+m.court;ensure(!slots.has(k),'สนามและ Wave ซ้ำใน Battle '+b.id);slots.add(k)}}}

function generate(d,bid,opt){let b=d.battles.find(x=>x.id===bid);ensure(b&&b.a&&b.b,'ยังไม่ทราบทีม');let ms=bm(d,bid),best=null,cost=Infinity;for(let attempt=0;attempt<100;attempt++){let ls=ms.map(()=>[null,null,null,null]);for(let side of [0,1]){let tid=side?b.b:b.a,used=new Map(),counts={};let add=(i,j,id)=>{if(!id)return false;let k=ms[i].wave+'|'+id;if(used.has(k))return false;used.set(k,true);counts[id]=(counts[id]||0)+1;ls[i][2*side+j]=id;return true};for(let l of LEVELS){let pool=d.players.filter(p=>p.active&&p.team===tid&&p.level===l).map(p=>p.id);let pure=ms.map((m,i)=>m.levels[0]===l&&m.levels[1]===l?i:-1).filter(i=>i>=0),pairs=shuffled(mainPairs(d,tid,l).slice(0,pure.length));pure.forEach((i,k)=>{let p=pairs[k];if(p&&p.every(id=>!used.has(ms[i].wave+'|'+id))){add(i,0,p[0]);add(i,1,p[1])}});let slots=[];ms.forEach((m,i)=>m.levels.forEach((v,j)=>{if(v===l&&!ls[i][side*2+j])slots.push([i,j])}));for(let [i,j] of shuffled(slots)){let avail=shuffled(pool).filter(id=>!used.has(ms[i].wave+'|'+id)).sort((a,b)=>(counts[a]||0)-(counts[b]||0));if(avail.length)add(i,j,avail[0])}}}let q=quality(d,ls),v=q.missing*10000+(opt.avoid?100*q.clash:0)-q.kept;if(v<cost){cost=v;best=ls}}return ms.map((m,i)=>({id:m.id,lineup:best[i]}))}

let rosterFilter='all';function roster(){let ps=data.players.filter(p=>rosterFilter==='all'||p.team===rosterFilter);return `<div class="stack"><div class="row"><h1>นักกีฬา / ทีม</h1><div class="spacer"></div>${btn('+ เพิ่มนักกีฬา',`editPlayer('')`,'gold')}${btn('แก้ชื่อและสีทีม','teamDialog()')}${btn('ดาวน์โหลดรายชื่อ CSV','exportRoster()')}</div><div class="note">สมาชิกเริ่มต้นตาม CSV ล่าสุด · แก้ชื่อ/ชื่อเล่น/สังกัดได้โดยตรง การย้ายทีม เปลี่ยนระดับมือ หรือยกเลิกสมาชิกจะถอน Line-up ที่เกี่ยวข้องซึ่งยังไม่มีคะแนน</div><div class="grid4">${data.teams.map(t=>`<div class="card"><h3>${team(t.id)}</h3><div class="metric">${data.players.filter(p=>p.active&&p.team===t.id).length}</div><small>${LEVELS.map(l=>l+' '+data.players.filter(p=>p.active&&p.team===t.id&&p.level===l).length).join(' · ')}</small></div>`).join('')}</div><div class="card stack"><div class="row"><h2>ทะเบียนนักกีฬา</h2><div class="spacer"></div><div style="width:160px"><select onchange="rosterFilter=this.value;render()">${opt('all','ทุกทีม',rosterFilter)}${IDS.map(t=>opt(t,tObj(t).name,rosterFilter)).join('')}</select></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อ / ชื่อเล่น</th><th>สังกัด</th><th>ทีม</th><th>ระดับ</th><th>คู่เดิม</th><th>สถานะ</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.nick)}</small></td><td>${esc(org(p.org))}</td><td>${team(p.team)}</td><td>${p.level}</td><td>${esc(p.pair)}</td><td>${badge(p.active?'เข้าร่วม':'ถอนตัว',p.active?'ok':'warn')}</td><td>${btn('แก้ไข',`editPlayer('${p.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function editPlayer(id){let p=player(data,id)||{name:'',nick:'',team:'A',level:'BABY',org:'',pair:'',active:true};modal(modalHead(id?'แก้ไขนักกีฬา':'เพิ่มนักกีฬา')+`<div class="formgrid"><div><label>ชื่อจริง</label><input id="pn" value="${esc(p.name)}"></div><div><label>ชื่อเล่น</label><input id="pk" value="${esc(p.nick)}"></div><div><label>หน่วยงาน</label><select id="po">${opt('','เลือกหน่วยงาน',p.org)}${data.orgs.map(o=>opt(o.id,o.name,p.org)).join('')}</select></div><div><label>ทีม</label><select id="pt">${IDS.map(t=>opt(t,tObj(t).name,p.team)).join('')}</select></div><div><label>ระดับมือ</label><select id="pl">${options(LEVELS,p.level)}</select></div><div><label>รหัสคู่เดิม (ถ้ามี)</label><input id="pp" value="${esc(p.pair)}"></div></div><label><input type="checkbox" id="pa" ${p.active?'checked':''}> เข้าร่วมการแข่งขัน</label><div class="actions">${btn('บันทึก',`savePlayer('${id}')`,'primary')}${id?btn('ลบรายชื่อ',`removePlayer('${id}')`,'danger'):''}</div>`)}function savePlayer(id){act('savePlayer',{player:{id,name:formVal('pn'),nick:formVal('pk'),org:formVal('po'),team:formVal('pt'),level:formVal('pl'),pair:formVal('pp'),active:$('pa').checked}})}function removePlayer(id){let r=reason('ลบรายชื่อ');if(r)act('removePlayer',{player:{id},reason:r})}function teamDialog(){modal(modalHead('แก้ชื่อและสีทีม')+data.teams.map(t=>`<div class="formgrid"><div><label>ทีม ${t.id}</label><input id="tn${t.id}" value="${esc(t.name)}"></div><div><label>สี</label><input type="color" id="tc${t.id}" value="${esc(t.color)}"></div></div>`).join('')+btn('บันทึก','saveTeams()','primary'))}function saveTeams(){act('saveTeams',{teams:IDS.map(id=>({id,name:formVal('tn'+id),color:formVal('tc'+id)}))})}
function schedule(){return `<div class="stack"><div class="row"><h1>ตารางแมตช์</h1><div class="spacer"></div>${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div><div class="note">แก้ทีมใน 6 Battle พร้อมกันได้ แต่ต้องครบทุกคู่ไม่ซ้ำ · รอบชิงกำหนดจากอันดับ · เปลี่ยนเวลาได้ทุก Battle · การเปลี่ยนประเภทจะถอน Line-up ของแมตช์ที่เกี่ยวข้อง</div>${data.battles.map(b=>`<div class="card stack"><div class="row"><h2>Battle ${b.id}${b.id===7?' · FINAL':''}</h2>${b.confirmed?badge('รับรองแล้ว','ok'):''}</div><div class="grid3"><div><label>ทีม A (ฝั่งซ้าย)</label><select id="ba${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.a)}${IDS.map(t=>opt(t,tObj(t).name,b.a)).join('')}</select></div><div><label>ทีม B (ฝั่งขวา)</label><select id="bb${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.b)}${IDS.map(t=>opt(t,tObj(t).name,b.b)).join('')}</select></div><div><label>เวลา</label><input id="bt${b.id}" value="${esc(b.time)}"></div></div><div class="tablewrap"><table><thead><tr><th>Match</th><th>มือ 1</th><th>มือ 2</th><th>สนาม</th><th>Wave</th></tr></thead><tbody>${bm(data,b.id).map(m=>{let dis=locked(b)||hasScore(m)?'disabled':'';return `<tr><td>${m.id}</td><td><select id="l1${m.id}" ${dis}>${options(LEVELS,m.levels[0])}</select></td><td><select id="l2${m.id}" ${dis}>${options(LEVELS,m.levels[1])}</select></td><td><select id="c${m.id}" ${dis}>${options([1,2,3],m.court)}</select></td><td><select id="w${m.id}" ${dis}>${options([1,2,3,4,5,6,7,8,9],m.wave)}</select></td></tr>`}).join('')}</tbody></table></div></div>`).join('')}${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div>`}function saveSchedule(){act('saveSchedule',{battles:data.battles.map(b=>({id:b.id,a:formVal('ba'+b.id)||null,b:formVal('bb'+b.id)||null,time:formVal('bt'+b.id)})),matches:data.matches.map(m=>({id:m.id,levels:[formVal('l1'+m.id),formVal('l2'+m.id)],court:Number(formVal('c'+m.id)),wave:Number(formVal('w' let drawAvoid=true,drawKeep=true;function draw(){let sel=drawBattle,bs=sel==='all'?[1,2,3,4,5,6]:[Number(sel)],ms=bs.flatMap(b=>bm(data,b)),entries=draft&&draft.key===sel?draft.entries:null,can=bs.every(id=>{let b=byB(id);return b.a&&b.b&&!locked(b)&&!bm(data,id).some(hasScore)});return `<div class="stack"><div class="hero"><small>MATCH-UP DRAW CEREMONY</small><h1>สุ่มคู่แข่งขัน <span class="goldtext">VS</span></h1><p>ใช้สมาชิกทีมที่กำหนดไว้ · ไม่สุ่มย้ายทีม</p></div><div class="card stack"><div class="formgrid"><div><label>เลือกรอบ / Battle</label><select onchange="drawBattle=this.value;draft=null;render()">${opt('all','รอบแรกทั้งหมด 54 แมตช์',sel)}${data.battles.map(b=>opt(String(b.id),`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,sel)).join('')}</select></div><div><label>โหมด</label><select onchange="practice=this.value==='test';draft=null;render()">${opt('real','ทางการ',practice?'test':'real')}${opt('test','จำลอง (ไม่บันทึก)',practice?'test':'real')}</select></div></div><label><input type="checkbox" ${drawAvoid?'checked':''} onchange="drawAvoid=this.checked"> ลดการพบหน่วยงานเดียวกัน</label><label><input type="checkbox" ${drawKeep?'checked':''} disabled> รักษาคู่หลักเดิมเพื่อ Best Pair</label><div class="note">สุ่มแบบค้นหาผลที่เหมาะสม ไม่รับประกันว่าความซ้ำจะเป็น 0 · รักษาคู่หลัก 2 คู่ต่อมือ · ลงซ้ำได้ต่าง Wave · ห้ามชนสนาม · ช่องว่างต้องแก้ก่อนเริ่ม</div><div class="actions">${btn('⟳ สุ่มคู่แข่งขัน','runDraw()','gold',!practice&&!can||bs.some(id=>!byB(id).a))}${btn('เล่นเอฟเฟกต์ซ้ำ','replayDraw()','',!entries&&!ms.some(m=>m.published))}${btn('ประกาศ Line-up','publishDraft()','primary',!entries||practice||!can)}${btn('ถอนประกาศ / รีเซ็ต','resetLineups()','danger',practice||!can)}${btn('ดาวน์โหลด CSV','exportLineups()')}</div>${entries?`<div class="${practice?'warning':'note'}">${practice?'ผลจำลอง ไม่บันทึกฐานข้อมูล':'ผลร่าง ยังไม่ประกาศ'} · ${entries.length} แมตช์ · หน่วยงานชน ${quality(data,entries.map(e=>e.lineup)).clash} · ช่องว่าง ${quality(data,e function quickTeamBtn94(t){let c=tObj(t),light=['A','D'].includes(t)?'#101f3c':'#fff';return `<button class="teamQuickBtn ${filter94.team===t?'selected':''}" style="--team:${esc(c.color)};--ink2:${light}" onclick="filter94.team='${t}';matchPage94=0;render()"><span class="badgeLetter">${esc(t)}</span><span><strong>${esc(c.name)}</strong><small>${filter94.team===t?'กำลังดูข้อมูลทีมนี้':'แตะเพื่อดูคู่แข่งขัน'}</small></span><span class="checkMark">✓</span></button>`}
function myResults94(){let all=filtered94(),pages=Math.max(1,Math.ceil(all.length/9));matchPage94=Math.min(matchPage94,pages-1);let ms=all.slice(matchPage94*9,matchPage94*9+9);return `<p class="muted">${all.length} แมตช์ · หน้า ${matchPage94+1}/${pages} · เรียงตาม Battle / Wave / Court</p><div class="matchgrid">${ms.map(m=>`<div class="card stack"><div class="row"><small>${m.battle===7?'FINAL':'BATTLE '+m.battle} · ${esc(byB(m.battle).time)} น. (ช่วง Battle)</small></div>${matchCard(m)}</div>`).join('')||'<div class="empty">ไม่พบแมตช์ตามตัวกรอง</div>'}</div><div class="actions">${btn('ก่อนหน้า','turnPage94(-1)','small',matchPage94===0)}${btn('ถัดไป','turnPage94(1)','small',matchPage94>=pages-1)}</div>`}
function turnPage94(n){matchPage94=Math.max(0,matchPage94+n);refreshMatches94()}
function refreshMatches94(){if($('myMatches94'))$('myMatches94').innerHTML=myResults94()}
function myMatch94(){let active=activeFilterCount94();return `<div class="finderWrap"><div class="card stack finderHero"><div class="row"><div class="finderLead"><small>FOR AUDIENCE</small><h2>MY MATCH · เลือกทีมแล้วดูคู่แข่งขันได้ทันที</h2><p class="muted">ผู้ชมทั่วไปสามารถกด Team A, B, C หรือ D ได้เลย ส่วนตัวกรองละเอียดพับเก็บไว้ด้านล่าง</p></div><div class="spacer"></div>${btn(filtersOpen?'ซ่อนตัวกรองขั้นสูง':'ตัวกรองขั้นสูง'+(active?' ('+active+')':''),'toggleFilters94()','small filterToggle')}</div><div class="quickTeams">${IDS.map(quickTeamBtn94).join('')}</div><div class="searchRow"><div><label>ค้นหาด้วย Tag ID / ชื่อ / ชื่อเล่น</label><input value="${esc(filter94.search)}" placeholder="เช่น A-BB-01 หรือ ชื่อเล่น" oninput="filter94.search=this.value;matchPage94=0;refreshMatches94()"></div><div>${btn('ล้างตัวกรอง','resetFilter94()','small')}</div></div><div class="audienceHint"><span class="softTitle">ตัวกรองที่ใช้อยู่</span><div class="filterSummary">${filterSummary94()}</div></div></div><div class="card stack advancedPanel ${filtersOpen?'open':''}"><div class="resultsHead"><h3>ตัวกรองขั้นสูง</h3><div class="spacer"></div>${btn('ซ่อน','toggleFilters94(false)','small')}</div><div class="formgrid">${filterSelect94('team','ทีม',[['all','ทุกทีม'],...IDS.map(t=>[t,tObj(t).name])])}${filterSelect94('level','กลุ่มมือ',[['all','ทุกมือ'],...LEVELS.map(l=>[l,levelText94(l)])])}${filterSelect94('court','สนาม',[['all','ทุกสนาม'],...['1','2','3'].map(x=>[x,'Court '+x])])}${filterSelect94('round','รอบ',[['all','ทุกรอบ'],['rr','รอบแรก'],['final','Final']])}${filterSelect94('battle','Battle',[['all','ทั้งหมด'],...data.battles.map(b=>[b.id,b.id===7?'Final':'Battle '+b.id+' · '+tObj(b.a).name+' / '+tObj(b.b).name])])}${filterSelect94('state','สถานะ',[['all','ทั้งหมด'],['ready','รอแข่งขัน'],['playing','กำลังแข่งขัน'],['pending','รอรับรอง'],['done','จบแล้ว'],['unpublished','ยังไม่ประกาศ']])}</div><div class="note">กลุ่ม BB รวมแมตช์ผสมที่มี BB · ชื่อและ Tag จะแสดงเมื่อประกาศ Line-up แล้ว</div></div><div class="card stack"><div class="resultsHead"><h3>ผลลัพธ์การแข่งขัน</h3>${badge(active?active+' ตัวกรอง':'โหมดชมทั่วไป','soft')}<div class="spacer"></div><span class="muted">คลิกทีมด้านบนเพื่อเปลี่ยนมุมมองแบบรวดเร็ว</span></div><div id="myMatches94">${myResults94()}</div></div></div>`}
function resetFilter94(){matchPage94=0;filter94={team:'all',level:'all',court:'all',round:'all',battle:'all',state:'all',search:''};filtersOpen=false;try{localStorage.setItem('doae_filters_open','0')}catch(e){}render()}
function courts94(){let ms=data.matches.slice().sort((a,b)=>a.battle-b.battle||a.wave-b.wave||a.id-b.id);return `<div class="stack"><h2>LIVE COURTS · 3 สนาม</h2><div class="grid3">${[1,2,3].map(c=>{let active=ms.find(m=>m.court===c&&m.started&&!m.score),next=ms.find(m=>m.court===c&&m.published&&!m.score&&!m.awaiting&&!m.pending&&!m.started);return `<div class="card stack"><h3>COURT ${c}</h3>${active?matchCard(active):'<p class="muted">ยังไม่มีแมตช์ที่กรรมการกดเริ่ม</p>'}<div class="note">คู่ถัดไปตามตาราง</div>${next?matchCard(next):'<small>ไม่มีแมตช์รอแข่งขันที่ประกาศแล้ว</small>'}</div>`}).join('')}</div></div>`}
function verifyDialog94(id){let m=byM(id),b=byB(m.battle);modal(modalHead('ตรวจ Tag ID · Match '+id+' / Court '+m.court)+`<div class="note">ตรวจป้ายจริงทั้ง 4 คน กรอกสลับลำดับภายในทีมได้ แต่ห้ามสลับทีม · ${scoreLimit(m)} แต้ม × 2 เซต</div>${[0,1].map(side=>`<h3>${team(side?b.b:b.a)}</h3><div class="formgrid">${[0,1].map(j=>{let i=side*2+j;return `<div><label>${esc(labelP(m.lineup[i]))}</label><input id="tag94${i}" autocomplete="off" placeholder="Tag ID จากป้าย" oninput="checkTags94(${id})"></div>`}).join('')}</div>`).join('')}<p id="tagStatus94" class="muted">ตรวจสอบ 0/4</p><button id="start94btn" class="primary" disabled onclick="startMatch94(${id},${m.rev})">ยืนยันนักกีฬาและเริ่มการแข่งขัน</button>`)}
function enteredTags94(){return [0,1,2,3].map(i=>formVal('tag94'+i).trim().toUpperCase())}
function checkTags94(id){let m=byM(id),tags=enteredTags94(),n=0;for(let side of [0,1]){let expect=m.lineup.slice(side*2,side*2+2).map(id=>tagOf(player(data,id)));let seen=new Set();for(let j=0;j<2;j++){let i=side*2+j,v=tags[i],ok=!!v&&expect.includes(v)&&!seen.has(v);if(ok){n++;seen.add(v)}$('tag94'+i).style.borderColor=v?(ok?'#168c4c':'#dc2626'):''}}$('tagStatus94').textContent='ตรวจสอบ '+n+'/4 '+(n===4?' · ตรงกับ Line-up':' · กรุณาตรวจ Tag ID');$('start94btn').disabled=n!==4}
function startMatch94(id,rev){act('startMatch',{id,matchRev:rev,tags:enteredTags94()})}
function cancelStart94(id){let r=reason('ยกเลิกการเริ่ม Match '+id);if(r)act('cancelStart',{id,matchRev:byM(id).rev,reason:r})}
function bestPage94(){let a=bestPairs(data,bestLevel94),complete=data.battles.slice(0,6).every(b=>b.confirmed),leaders=a.filter(r=>r.rank===1),ties=[...new Set(a.map(r=>r.tie).filter(Boolean))];return `<div class="stack"><div class="hero"><small>ROUND ROBIN AWARDS</small><h1>BEST PAIR</h1><p>BB · BG · NS / คู่เดิมอย่างน้อย 3 แมตช์</p></div><div class="actions">${LEVELS.map(l=>btn(levelText94(l),`bestLevel94='${l}';render()`,bestLevel94===l?'primary':'' )).join('')}${btn('ดาวน์โหลด CSV','exportBest94()')}${btn('พิมพ์อันดับ','printBest94()')}</div><div class="note">${complete?'รอบแรกได้รับการรับรองครบแล้ว':'อันดับชั่วคราว · รอจบรอบแรก'} · นับเฉพาะคู่มือเดียวกันจากผลคะแนนที่บันทึก/รับรองแล้ว ไม่รวม Final</div>${leaders.length?`<div class="card stack"><h2>${complete&&leaders.length===1&&!leaders[0].tie?'🏆 BEST PAIR '+levelText94(bestLevel94):'ผู้นำ '+levelText94(bestLevel94)+(leaders.length>1?' (อันดับร่วม)':'')}</h2>${leaders.map(r=>`<div>${team(r.team)} · ${r.ids.map(id=>esc(labelP(id))).join(' / ')} · ${r.w}–${r.l} เซต</div>`).join('')}</div>`:'<div class="card">ยังไม่มีคู่ที่ลงแข่งขันครบ 3 แมตช์</div>'}<div class="card tablewrap">${bestTable94(a)}</div>${isAdmin()&&complete?ties.map(k=>`<div class="card stack"><h3>อันดับเสมอ · รอกรรมการตัดสิน</h3>${a.filter(r=>r.tie===k).map(r=>`<p>${r.ids.map(id=>esc(labelP(id))).join(' / ')}</p>`).join('')}${btn('กำหนดลำดับ',`bestTieDialog94(${ties.indexOf(k)})`,'gold')}</div>`).join(''):''}</div>`}
function bestTable94(a){return `<table><thead><tr><th>อันดับ</th><th>ทีม / คู่</th><th>แมตช์</th><th>เซต W–L</th><th>% ชนะเซต</th><th>เซต +/- เฉลี่ย</th><th>แต้ม +/- เฉลี่ย</th><th>สถานะ</th></tr></thead><tbody>${a.map(r=>`<tr><td>${r.rank||'–'}${r.tie?' ร่วม':''}</td><td>${esc(tObj(r.team).name)}<small>${r.ids.map(id=>esc(labelP(id))).join('<br>')}</small></td><td>${r.n}</td><td>${r.w}–${r.l}</td><td>${(100*r.w/(2*r.n)).toFixed(1)}%</td><td>${((r.w-r.l)/r.n).toFixed(2)}</td><td>${((r.rf-r.ra)/r.n).toFixed(2)}</td><td>${r.n>=3?(r.tie?'เสมอ':'ผ่านเกณฑ์'):'ยังไม่ครบ 3'}</td></tr>`).join('')}</tbody></table>`}
function bestTieDialog94(i){let a=bestPairs(data,bestLevel94),ties=[...new Set(a.map(r=>r.tie).filter(Boolean))],k=ties[i],g=a.filter(r=>r.tie===k);if(!g.length)return;modal(modalHead('ตัดสินอันดับคู่เสมอ')+g.map((r,j)=>`<label>ลำดับที่ ${j+1}</label><select id="bestOrder94${j}">${g.map(x=>opt(x.key,x.ids.map(id=>labelP(id)).join(' / '),r.key)).join('')}</select>`).join('')+`<label>เหตุผล</label><input id="bestReason94">${btn('รับรองลำดับ',`saveBestTie94(${i})`,'primary')}`)}
function saveBestTie94(i){let a=bestPairs(data,bestLevel94),k=[...new Set(a.map(r=>r.tie).filter(Boolean))][i],g=a.filter(r=>r.tie===k),order=g.map((r,j)=>formVal('bestOrder94'+j));if(new Set(order).size!==g.length){toast('ห้ามเลือกคู่ซ้ำ');return}act('bestTie',{level:bestLevel94,key:k,order,reason:formVal('bestReason94')})}
function exportBest94(){downloadCsv([['category','rank','team','tag1','tag2','matches','sets_won','sets_lost','rally_for','rally_against','eligible','tie'],...LEVELS.flatMap(l=>bestPairs(data,l).map(r=>[levelText94(l),r.rank,r.team,...r.ids.map(id=>tagOf(player(data,id))),r.n,r.w,r.l,r.rf,r.ra,r.n>=3,!!r.tie]))],'DOAE-best-pair.csv')}
function printWindow94(title,body){let w=window.open('','_blank');if(!w){toast('อนุญาตหน้าต่าง Pop-up เพื่อพิมพ์');return}w.document.open();w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#101f3c}h1{font-size:23px}h2{font-size:18px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #8996a8;text-align:left}small{display:block} .taggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}.tag{border:1px solid #8896a9;border-top:12px solid var(--tc);padding:9mm 5mm;min-height:77mm;break-inside:avoid;text-align:center}.tag strong{font-size:27px;display:block;margin:6mm 0}.sheet{break-after:page;min-height:240mm}.sheet:last-child{break-after:auto}.scorecell{height:28mm}.no-print{margin-bottom:10px}@media print{.no-print{display:none}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><button class="no-print" onclick="window.print()">พิมพ์ / บันทึก PDF</button>${body}</body></html>`);w.document.close()}
function printPage94(){let ms=printMatches94(),ps=data.players.filter(p=>p.active&&(printTeam94==='all'||p.team===printTeam94));return `<div class="stack"><h1>Print Center</h1><div class="card stack"><h2>Player Tag · ${ps.length} คน</h2><select onchange="printTeam94=this.value;render()">${opt('all','ทุกทีม',printTeam94)}${IDS.map(t=>opt(t,tObj(t).name,printTeam94)).join('')}</select><div class="actions">${btn('พิมพ์ Player Tag','printTags94()','primary')}${btn('ทะเบียน Tag CSV','exportRoster()')}${btn('พิมพ์ทะเบียน','printRoster94()')}</div></div><div class="card stack"><h2>Official Score Sheet · ${ms.length} แมตช์</h2><div class="formgrid"><div><label>Battle</label><select onchange="printBattle94=this.value;render()">${opt('all','ทั้งหมด',printBattle94)}${data.battles.map(b=>opt(b.id,b.id===7?'Final':'Battle '+b.id,printBattle94)).join('')}</select></div><div><label>Court</label><select onchange="printCourt94=this.value;render()">${opt('all','ทุกสนาม',printCourt94)}${[1,2,3].map(c=>opt(c,'Court '+c,printCourt94)).join('')}</select></div></div>${btn('พิมพ์ Score Sheets ตามตัวกรอง','printSheets94()','primary',!ms.length)}<div class="note">พิมพ์เฉพาะแมตช์ที่ประกาศ Line-up แล้ว · 1 แมตช์ต่อ A4</div></div><div class="card actions">${btn('พิมพ์อันดับทีม','printRanking94()')}${btn('พิมพ์ Best Pair','printBest94()')}${btn('ดาวน์โหลด Best Pair CSV','exportBest94()')}</div></div>`}
function printTags94(){let ps=data.players.filter(p=>p.active&&(printTeam94==='all'||p.team===printTeam94));printWindow94('Player Tags',`<div class="taggrid">${ps.map(p=>`<div class="tag" style="--tc:${esc(tObj(p.team).color)}"><small>${esc(data.event)}</small><h2>${esc(tObj(p.team).name)} · ${levelText94(p.level)}</h2><strong>${esc(p.tag)}</strong><h2>${esc(p.name)}</h2><p>${esc(p.nick)} · ${esc(org(p.org))}</p></div>`).join('')}</div>`)}
function printRoster94(){let ps=data.players.filter(p=>p.active&&(printTeam94==='all'||p.team===printTeam94));printWindow94('Player register',`<h1>${esc(data.event)} · ทะเบียนนักกีฬา</h1><table><tr><th>Tag ID</th><th>ชื่อ</th><th>ชื่อเล่น</th><th>ทีม / มือ</th><th>หน่วยงาน</th></tr>${ps.map(p=>`<tr><td>${esc(p.tag)}</td><td>${esc(p.name)}</td><td>${esc(p.nick)}</td><td>${esc(p.team)} / ${levelText94(p.level)}</td><td>${esc(org(p.org))}</td></tr>`).join('')}</table>`)}
function printMatches94(){return data.matches.filter(m=>m.published&&(printBattle94==='all'||m.battle===Number(printBattle94))&&(printCourt94==='all'||m.court===Number(printCourt94))).sort((a,b)=>a.battle-b.battle||a.wave-b.wave||a.court-b.court)}
function scorePaper94(m){let b=byB(m.battle);return `<section class="sheet"><h1>${esc(data.event)} · OFFICIAL SCORE SHEET</h1><h2>Match ${m.id} / Court ${m.court} / Wave ${m.wave}</h2><p>${m.battle===7?'FINAL':'BATTLE '+m.battle} · ${esc(b.time)} · ${m.levels.map(levelText94).join(' + ')} · ${scoreLimit(m)} แต้ม × 2 เซต (ไม่มีดิวซ์)</p><table><tr><th>ทีม</th><th>Tag ID</th><th>นักกีฬา / หน่วยงาน</th><th>ตรวจป้าย</th></tr>${[0,1,2,3].map(i=>{let p=player(data,m.lineup?.[i]);return `<tr><td>${esc(tObj(i<2?b.a:b.b).name)}</td><td>${esc(p?.tag||'รอนักกีฬา')}</td><td>${esc(p?.name||'–')}<small>${esc(p?org(p.org):'')}</small></td><td>□</td></tr>`}).join('')}</table><h2>ผลการแข่งขัน</h2><table><tr><th>เซต</th><th>${esc(tObj(b.a).name)}</th><th>${esc(tObj(b.b).name)}</th></tr>${[0,1].map(i=>`<tr><td>SET ${i+1}</td><td class="scorecell">${m.score?m.score[i][0]:''}</td><td>${m.score?m.score[i][1]:''}</td></tr>`).join('')}<tr><td>รวมเซต</td><td></td><td></td></tr><tr><td>รวมแต้ม</td><td></td><td></td></tr></table><p style="margin-top:15mm">กรรมการผู้ตรวจ _____________________ เวลา __________</p><p style="margin-top:10mm">กรรมการผู้รับรอง _____________________ เวลา __________</p><p>หมายเหตุ ____________________________________________________</p></section>`}
function printMatch94(id){let m=byM(id);if(m&&m.published)printWindow94('Score Sheet '+id,scorePaper94(m))}
function printSheets94(){printWindow94('Score Sheets',printMatches94().map(scorePaper94).join(''))}
function printRanking94(){printWindow94('Team Ranking',`<h1>${esc(data.event)} · อันดับทีม</h1>${rankingTable()}`)}
function printBest94(){printWindow94('Best Pair',`<h1>${esc(data.event)} · Best Pair</h1><p>${data.battles.slice(0,6).every(b=>b.confirmed)?'รอบแรกจบแล้ว':'อันดับชั่วคราว'}</p>${LEVELS.map(l=>`<h2>${levelText94(l)}</h2>${bestTable94(bestPairs(data,l))}`).join('')}`)}

restorePublic();render();if(endpoint){if(liveEnabled())startLive();else publicFallback()}setInterval(()=>{if(token){if(!busy&&!document.hidden&&$('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()}},15000);setInterval(liveTick,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!token){stopLive();connected=false;status()}}else if(!token){if(liveEnabled())startLive();else publicFallback()}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()});window.addEventListener('online',()=>{if(!token){if(liveEnabled())startLive();else publicFallback(true)}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()});window.addEventListener('offline',()=>{if(!token){connected=false;liveHealthy=false;status()}});
