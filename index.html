function loginPage(){return `<div class="login-grid"><section class="login-brand">${logo}<div class="eyebrow">TOURNAMENT CONTROL</div><h1>STAFF<br>ACCESS <span style="color:#f4cf35">#2</span></h1>${stripes}<p>พื้นที่สำหรับเจ้าหน้าที่บันทึกและรับรองผลการแข่งขัน</p><p class="small">ผู้ชมทั่วไปไม่จำเป็นต้องเข้าสู่ระบบ</p></section><section class="login-main"><h2>เข้าสู่ระบบเจ้าหน้าที่</h2><p class="muted">Username + Access Code</p><form id="loginform" onsubmit="loginDemo(event);return false" onkeydown="if(event.key==='Enter' &amp;&amp; event.target.tagName==='INPUT'){event.preventDefault();loginDemo(event)}"><div class="field"><label for="username">ชื่อผู้ใช้งาน</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="เช่น staff01"></div><div class="field"><label for="accesscode">รหัสเข้าใช้งาน</label><input id="accesscode" type="password" autocomplete="current-password" required placeholder="กรอกรหัสตัวอย่าง"></div><button class="btn primary" type="button" onclick="loginDemo(event)">${icon('shield')} เข้าสู่ระบบ</button><p id="loginerror" role="alert" style="color:#a72e36;margin-top:8px"></p></form><div class="notice"><b>โหมดทดลองดีไซน์เท่านั้น</b><p>กดเลือกบัญชีตัวอย่างด้านล่างเพื่อเข้าสู่ระบบทันที หรือกรอก Username และ Access Code ด้านบนเอง ไม่ใช้รหัสจริง ระบบนี้ยังไม่ใช่ระบบรักษาความปลอดภัย</p><div class="demo-choices">${accounts.filter(a=>a.active).map(a=>`<button type="button" class="btn" onclick="quickDemo('${esc(a.username)}')">${esc(a.username)}<small>${a.role}${a.court?' · C'+a.court:''}</small></button>`).join('')}</div></div><button class="linkbtn" onclick="show('home')">← กลับหน้าผู้ชม</button></section></div>`}

function workspace(){if(canAdmin())return controlDashboard();let a=account(),tiles=[['admin','บันทึกคะแนน',a.role==='STAFF'?'ส่งผลเฉพาะสนามที่รับผิดชอบ':'บันทึกผลและรับรอง Battle','edit'],...(canAdmin()?[['review','ตรวจสอบผลที่ส่งมา',Object.keys(state.pending).length+' แมตช์รอรับรอง','check'],['audit','ประวัติการดำเนินงาน','ตรวจสอบผู้บันทึกและผู้รับรอง','results']]:[]),...(isSuper()?[['accounts','จัดการบัญชี','เพิ่มบัญชี เปลี่ยนรหัส และกำหนดสนาม','users']]:[]),['home','กลับหน้าผู้ชม','ตรวจสอบการแสดงผลที่เผยแพร่แล้ว','home']];return heading('พื้นที่เจ้าหน้าที่','STAFF WORKSPACE · '+a.role)+`<div class="notice info" style="margin-bottom:16px">สวัสดี ${esc(a.name)} · ${a.court?'รับผิดชอบสนาม '+a.court:'รับผิดชอบทุกสนาม'}<br>ข้อมูลทั้งหมดเป็นการจำลองภายในเบราว์เซอร์นี้</div><div class="workspace-grid">${tiles.map(([p,t,d,i])=>`<button class="btn work-tile" onclick="show('${p}')">${icon(i)}<h3>${t}</h3><p>${d}</p></button>`).join('')}</div>`}

function staffScorePage(){let b=adminBattle,ms=staffMatches(b);if(!ms.includes(adminMatch))adminMatch=ms[0];let m=adminMatch,k=`${b}-${m}`,draft=state.pending[k],pub=state.scores[k],s=draft?.scores,[a,z]=battleInfo(b),locked=battleLocked(b)||!!pub||(draft&&draft.actor!==account().username);return heading('Score Desk — ส่งผลการแข่งขัน','บันทึกผลเมื่อจบแมตช์ · สนาม '+(account().court||'ทั้งหมด'))+`<div class="admin-grid"><section class="panel"><h2>เลือกแมตช์ของคุณ</h2><div class="field" style="margin-top:12px"><label for="staffb">Battle</label><select id="staffb" onchange="adminBattle=Number(this.value);adminMatch=staffMatches(adminBattle)[0];render()">${[1,2,3,4,5,6,7].map(x=>`<option value="${x}" ${b===x?'selected':''}>${x===7?'FINAL':'Battle '+x} · ${battleInfo(x).slice(0,2).join(' vs ')}</option>`).join('')}</select></div><div class="field"><label for="staffm">แมตช์ / Wave / สนาม</label><select id="staffm" onchange="adminMatch=Number(this.value);render()">${ms.map(x=>`<option value="${x}" ${m===x?'selected':''}>M${x} · ${type(b,x)} · W${Math.floor((x-1)/3)+1} / C${(x-1)%3+1}</option>`).join('')}</select></div><div class="scoreboard"><div class="versus" style="margin:0">${bigTeam(a)}<div class="center">VS</div>${bigTeam(z)}</div></div><form onsubmit="submitPending(event)">${[0,1].map(i=>`<div class="scoreinputs"><input aria-label="ทีมซ้าย เซต ${i+1}" id="s${i}a" type="number" inputmode="numeric" min="0" max="15" required value="${(s||pub)?.[i]?.[0]??''}" ${locked?'disabled':''} oninput="previewScore()"><label>SET ${i+1}</label><input aria-label="ทีมขวา เซต ${i+1}" id="s${i}b" type="number" inputmode="numeric" min="0" max="15" required value="${(s||pub)?.[i]?.[1]??''}" ${locked?'disabled':''} oninput="previewScore()"></div>`).join('')}<p id="preview" class="muted small"></p><div class="actions"><button class="btn primary" type="button" onclick="submitPending(event)" ${locked?'disabled':''}>${icon('check')} ${draft?'แก้ไขและส่งผลใหม่':'ส่งผลให้กรรมการ'}</button></div></form><div class="actions"><button class="btn" onclick="nextUnscored()">แมตช์ถัดไปที่ยังไม่ส่งผล</button></div><p class="notice info" style="margin-top:14px">${pub?'เผยแพร่ผลแล้ว · ติดต่อกรรมการหากต้องการแก้ไข':battleLocked(b)?'Battle ถูกล็อกหรือยังไม่พร้อมแข่งขัน':draft?'รอกรรมการรับรอง · ยังไม่แสดงบนหน้าผู้ชม':'คะแนนจะยังไม่ปรากฏบนหน้าผู้ชมจนกว่ากรรมการรับรอง'}</p></section><section class="panel"><h2>สถานะการส่งผลของฉัน</h2>${Object.entries(state.pending).filter(([k,p])=>p.actor===account().username).map(([k,p])=>`<div class="queue-row"><b>Battle ${esc(k.split('-')[0])} · Match ${esc(k.split('-')[1])}</b><div class="pending-score">${fmtScore(p.scores)}</div><span class="pill alert">รอยืนยัน</span></div>`).join('')||'<p class="muted" style="margin-top:12px">ยังไม่มีรายการรอรับรอง</p>'}</section></div>`}
function submitPending(e){e.preventDefault();if(!signedIn()||canAdmin())return;let b=adminBattle,m=adminMatch,k=`${b}-${m}`,s=readScore(),old=state.pending[k];if(!staffMatches(b).includes(m)||battleLocked(b)||state.scores[k]||old&&old.actor!==account().username)return toast('ไม่มีสิทธิ์บันทึกแมตช์นี้');if(!validScore(s))return toast('คะแนนไม่ตรงกติกา 15 แต้ม');state.pending[k]={scores:s,actor:account().username,name:account().name,time:new Date().toISOString()};log(`ส่งผล B${b} M${m}`,`${fmtScore(old?.scores)} → ${fmtScore(s)}`);render();toast('ส่งผลให้กรรมการแล้ว')}

function reviewPage(){let entries=Object.entries(state.pending);return heading('ตรวจสอบและรับรองผล','TOURNAMENT CONTROL · '+entries.length+' แมตช์รอรับรอง')+`<section class="panel"><h2>รายการรอตรวจสอบ</h2>${entries.map(([k,p])=>{let [b,m]=k.split('-').map(Number),[a,z]=battleInfo(b);return `<div class="queue-row"><div class="statusline"><b>Battle ${b} · Match ${m} · Court ${(m-1)%3+1}</b><span class="pill alert">รอยืนยัน</span></div><p class="queue-meta">${esc(a)} vs ${esc(z)} · ${esc(type(b,m))} · ผู้ส่ง ${esc(p.actor)}</p><div class="pending-score">${fmtScore(p.scores)}</div><p class="small muted">${new Date(p.time).toLocaleString('th-TH')}</p><div class="actions"><button class="btn primary" onclick="approvePending('${k}')">${icon('check')} รับรองและเผยแพร่</button><button class="btn danger" onclick="rejectPending('${k}')">ส่งกลับ / ไม่รับรอง</button></div></div>`}).join('')||'<p class="muted" style="margin-top:12px">ยังไม่มีผลรอรับรอง</p>'}</section>`}
function approvePending(k){if(!canAdmin())return;let p=state.pending[k];if(!p)return;let [b,m]=k.split('-').map(Number);if(battleLocked(b)||state.scores[k]||!validScore(p.scores))return toast('แมตช์ถูกล็อก มีผลแล้ว หรือคะแนนไม่ถูกต้อง');state.scores[k]=p.scores;delete state.pending[k];delete state.golden[b];delete state.finalWinners[k];log(`รับรองผล B${b} M${m}`,`${fmtScore(p.scores)} · ผู้ส่ง ${p.actor}`);render();toast('เผยแพร่ผลรายแมตช์แล้ว')}

function saveAccount(e){e.preventDefault();if(!isSuper())return;let old=accounts.find(x=>x.username===editUser),u=document.getElementById('au').value.trim().toLowerCase(),name=document.getElementById('an').value.trim(),role=document.getElementById('ar').value,court=role==='STAFF'?Number(document.getElementById('ac').value):0,code=document.getElementById('ap').value;if(!/^[a-z0-9_]{3,24}$/.test(u)||!name||!['STAFF','ADMIN','SUPER ADMIN'].includes(role)||(!old&&accounts.some(x=>x.username===u)))return toast('ตรวจสอบ Username และชื่อผู้ใช้');if((code||!old)&&!/^DEMO-[A-Za-z0-9_-]{4,35}$/.test(code))return toast('รหัสตัวอย่างต้องขึ้นต้น DEMO- และตามด้วยอย่างน้อย 4 ตัว');let obj={username:u,name,role,court,code:code||old.code,active:old?.active??true};log(old?'แก้ไขบัญชี '+u:'สร้างบัญชี '+u,`${role} · ${court?'สนาม '+court:'ทุกสนาม'}${code?' · ตั้งรหัสใหม่':''}`);if(old)accounts=accounts.map(x=>x.username===u?obj:x);else accounts.push(obj);saveAccounts();editUser=null;if(!signedIn()){session=null;show('login');toast('กรุณาเข้าสู่ระบบใหม่')}else{render();toast('บันทึกบัญชีตัวอย่างแล้ว')}}

function matchControl(){let rows=[];for(let b=1;b<=7;b++)for(let m=1;m<=allMatches(b);m++){let c=(m-1)%3+1,st=matchStatus(b,m);if(filterBattle&&b!==filterBattle||filterCourt&&c!==filterCourt||filterStatus!=='all'&&filterStatus!==st)continue;rows.push({b,m,c,st})}return heading('จัดการแมตช์การแข่งขัน','MATCH CONTROL · 59 แมตช์ตามคู่มือ',`<button class="btn" onclick="show('workspace')">กลับศูนย์ควบคุม</button>`)+`<section class="panel" style="margin-bottom:15px"><h2>ค้นหาและกรองแมตช์</h2><div class="control-filter"><div class="field"><label for="fb">Battle</label><select id="fb" onchange="filterBattle=Number(this.value);render()"><option value="0">ทั้งหมด</option>${[1,2,3,4,5,6,7].map(b=>`<option value="${b}" ${filterBattle===b?'selected':''}>${b===7?'FINAL':'Battle '+b} · ${battleInfo(b).slice(0,2).join(' vs ')}</option>`).join('')}</select></div><div class="field"><label for="fc">สนาม</label><select id="fc" onchange="filterCourt=Number(this.value);render()">${[0,1,2,3].map(c=>`<option value="${c}" ${filterCourt===c?'selected':''}>${c?'Court '+c:'ทุกสนาม'}</option>`).join('')}</select></div><div class="field"><label for="fs">สถานะ</label><select id="fs" onchange="filterStatus=this.value;render()">${[['all','ทั้งหมด'],['waiting','รอผล'],['pending','รอรับรอง'],['published','เผยแพร่แล้ว']].map(([v,t])=>`<option value="${v}" ${filterStatus===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="statusline"><b>พบ ${rows.length} แมตช์</b><button class="btn" onclick="openMatches()">ล้างตัวกรอง</button></div></section><div class="match-control-grid">${rows.map(({b,m,c,st})=>{let [a,z]=battleInfo(b),k=`${b}-${m}`,p=state.pending[k],q=match(b,m);return `<article class="match-control-card"><div class="statusline"><span class="eyebrow">${b===7?'FINAL':'BATTLE '+b} · M${m}</span>${matchPill(st)}</div><h3>${esc(type(b,m))}</h3><div class="statusline">${team(a)}<b>VS</b>${team(z)}</div><p class="small muted">Wave ${Math.ceil(m/3)} · Court ${c}</p><div class="pe function finalControl(){let r=rankings(),ready=completeRR()&&r[0].rank===1&&r[1].rank===2;return heading('จัดการรอบ Grand Final','TOURNAMENT CONTROL · 5 แมตช์ ต้องแข่งขันครบ',`<button class="btn" onclick="show('workspace')">กลับศูนย์ควบคุม</button>`)+rankDecisionPanel()+championPanel()+`<div class="control-columns"><section class="panel"><h2>1. รับรองคู่ชิงชนะเลิศ</h2><p class="muted" style="margin:8px 0">ต้องรับรองผล Round Robin ครบ 6 Battle และจัดอันดับได้ · กรณี Head-to-Head วนเสมอใช้ผลต่างแต้มรวมตามลำดับเกณฑ์ข้อ 10 (โปรดให้กรรมการรับรองการตีความ)</p>${rankTable()}<div class="actions"><button class="btn primary" onclick="assignFinal()" ${!ready||state.finalTeams?'disabled':''}>${state.finalTeams?'กำหนดทีมแล้ว':'กำหนดทีมอันดับ 1 และ 2'}</button>${state.finalTeams?'<button class="btn danger" onclick="unlockFinal()">ยกเลิกคู่และผล Final เพื่อแก้ RR</button>':''}</div><p class="notice info control-notice">${state.finalTeams?esc(state.finalTeams.join(' VS ')):'รอผลและอันดับที่ชัดเจน'}</p></section><section class="panel"><h2>2. ยืนยันประเภท Match 5</h2><p class="muted" style="margin:8px 0">คู่มือหน้า 6 ระบุประเภทคู่ไม่ตรงกัน ต้องให้กรรมการยืนยันก่อน</p><div class="field"><label for="fp">ประเภทคู่</label><select id="fp" ${state.finalPairConfirmed?'disabled':''}><option ${state.finalPair==='BABY + NS'?'selected':''}>BABY + NS</option><option ${state.finalPair==='BG + NS'?'selected':''}>BG + NS</option></select></div><button class="btn primary" onclick="confirmPair()" ${state.finalPairConfirmed?'disabled':''}>${state.finalPairConfirmed?'ยืนยันแล้ว':'ยืนยันประเภทคู่'}</button><p class="notice control-notice">หากเสมอ 1–1 เซต ให้กรรมการระบุผลตัดสินตามกติกาที่ประกาศ ระบบไม่เดาผู้ชนะ</p></section></div><section class="panel"><div class="control-label"><h2>3. บันทึกและรับรองผล Final</h2><button class="btn" onclick="openMatches(7)">ดู 5 แมตช์</button></div>${board(7,false)}<div class="actions"><button class="btn primary" onclick="goMatch(7)">เปิด Score Desk / รับรอง Final</butto function rankDecisionPanel(){if(!canAdmin()||!completeRR())return '';let r=rankings(),groups=[...new Set(r.map(x=>x.decisionKey).filter(Boolean))].map(k=>r.filter(x=>x.decisionKey===k));return groups.map(g=>{let k=g.map(x=>x.t).sort().join(''),d=state.rankDecisions?.[k];return `<section class="panel" style="margin:15px 0"><h2>กรรมการตัดสินอันดับ · TEAM ${k.split('').join(' / ')}</h2><p class="muted small">คะแนนตารางและจำนวนแมตช์ชนะเท่ากัน · ตรวจผล Head-to-Head และผลต่างแต้มตามคู่มือก่อนบันทึกคำตัดสิน</p><div class="table-scroll"><table class="ranktable"><thead><tr><th>ทีม</th><th>ผลต่างแต้ม</th></tr></thead><tbody>${g.map(t=>`<tr><td>${team(t.t)}</td><td>${t.officialDiff}</td></tr>`).join('')}</tbody></table></div><p class="small muted">${RR.map((p,i)=>p.slice(0,2).every(t=>k.includes(t))?`B${i+1}: ${p[0]} vs ${p[1]} · ชนะ ${p[winner(i+1)]}`:'').filter(Boolean).join(' | ')}</p><div class="field"><label for="ord${k}">ลำดับทีมจากสูงไปต่ำ (เช่น ${k.split('').join(',')})</label><input id="ord${k}" value="${esc(d?.order?.join(',')||'')}" ${state.finalTeams?'disabled':''} placeholder="${k.split('').join(',')}"></div><div class="field"><label for="why${k}">เหตุผล / หลักเกณฑ์ที่กรรมการรับรอง</label><input id="why${k}" value="${esc(d?.reason||'')}" ${state.finalTeams?'disabled':''}></div><button class="btn primary" onclick="decideRanks('${k}')" ${state.finalTeams?'disabled':''}>บันทึกคำตัดสินอันดับ</button></section>`}).join('')}
function decideRanks(k){if(!canAdmin()||!completeRR()||state.finalTeams)return;let r=rankings(),g=r.filter(x=>x.decisionKey===k);if(g.length!==k.length||g.length<2)return toast('ไม่ใช่กลุ่มที่ต้องตัดสิน');let order=(document.getElementById('ord'+k)?.value||'').toUpperCase().split(/[ ,]+/).filter(Boolean),reason=document.getElementById('why'+k)?.value.trim();if(order.length!==k.length||[...order].sort().join('')!==k||!reason)return toast('ระบุลำดับทุกทีมโดยไม่ซ้ำและเหตุผล');state.rankDecisions??={};state.rankDecisions[k]={order,reason};log('กรรมการตัดสินอันดับ '+k,order.join(' > ')+' · '+reason);render();toast('บันทึกอันดับแล้ว')}

async function refreshRemote(manual=false){if(busy||fetching)return;if(!manual&&['login','admin','accounts','finalcontrol','draw'].includes(page)){return}if(manual&&['admin','accounts','finalcontrol','draw'].includes(page)&&!confirm('อัปเดตข้อมูลจากฐานกลาง? ค่าที่กำลังกรอกและยังไม่บันทึกอาจหายไป'))return;fetching=true;statusRemote();let t=token,oldPage=page;try{let d=await requestRemote(t?{action:'snapshot',token:t}:null);if(t!==token)return;if(page!==oldPage&&['login','admin','accounts','finalcontrol','draw'].includes(page))return;applyRemote(d);render();if(manual)toast('อัปเดตข้อมูลล่าสุดแล้ว')}catch(e){setConnection(false,'เชื่อมต่อไม่ได้: '+e.message);if(manual)toast(showDatabaseDetails()?e.message:'อัปเดตข้อมูลไม่สำเร็จ กรุณาลองใหม่')}finally{fetching=false;statusRemote()}}

function drawParse(){let text=document.getElementById('draw-input').value;let lines=text.split(/\r?\n/).filter(x=>x.trim());if(/^(pair_id|รหัสคู่)\t/i.test(lines[0]||''))lines.shift();return lines.map((line,i)=>{let r=line.split('\t');if(r.length<5||r.length>6)throw Error('แถว '+(i+1)+' ต้องมี 5–6 คอลัมน์ คั่นด้วย Tab');return {id:r[0],level:r[1],org:r[2],a:r[3],b:r[4],lock:r[5]||''}})}

function pairAdd(){let org=document.getElementById('pair-org').value,l=document.getElementById('pair-level').value,a=document.getElementById('pair-a').value.trim(),b=document.getElementById('pair-b').value.trim(),lock=document.getElementById('pair-lock').value;if(!org||!a||!b){alert('เลือกหน่วยงานและกรอกชื่อผู้เล่นทั้งสองคน');return}if(pairDraft.length>=36||pairDraft.filter(p=>p.level===l).length>=12){alert('ระดับมือนี้ครบ 12 คู่ หรือรายการครบ 36 คู่แล้ว');return}let names=new Set(pairDraft.flatMap(p=>[p.a,p.b]).map(n=>n.trim().toLowerCase().replace(/\s+/g,' ')));let norm=n=>n.toLowerCase().replace(/\s+/g,' ');if(norm(a)===norm(b)||names.has(norm(a))||names.has(norm(b))){alert('พบชื่อนักกีฬาซ้ำ');return}pairDraft.push({id:pairNextId(),level:l,org,a,b,lock});pairEdit=-1;render();}
function pairRemove(i){if(confirm('นำคู่นี้ออกจากรายการ? ยังไม่เปลี่ยนข้อมูลใน Google Sheets จนกว่าจะบันทึก')){pairDraft.splice(i,1);pairEdit=-1;render()}}

async function pairRefresh(){if(busy||fetching||!token)return;if(!confirm('ดึงรายชื่อจาก Google Sheets ใหม่? รายการที่ยังไม่บันทึกจะถูกแทนที่'))return;fetching=true;try{let d=await requestRemote({action:'snapshot',token});applyRemote(d);pairDraft=null;pairSettings=null;pairEdit=-1;render();toast('ดึงรายชื่อจาก Google Sheets แล้ว')}catch(e){toast(e.message);alert(e.message)}finally{fetching=false}}
function pairEditor(locked){let counts=pairCounts();return `<section class="panel"><div class="statusline"><div><h2>1. รายชื่อคู่แข่งขัน</h2><p class="muted small">ดึงรายชื่อจาก PAIRS และเลือกหน่วยงานจาก ORGANIZATIONS โดยตรง</p></div><button class="btn" onclick="pairRefresh()">ดึงจาก Google Sheets</button></div><div class="pair-counts">${drawLevels.map(l=>`<div class="control-metric"><span class="num">${counts[l]}/12</span><span>${l}</span></div>`).join('')}</div>${locked?'':`<div class="pair-entry"><h3>เพิ่มคู่แข่งขัน</h3>${pairFields('pair')}<button class="btn primary" onclick="pairAdd()" ${pairDraft.length>=36?'disabled':''}>+ เพิ่มคู่</button></div>`}<div class="pair-list">${pairDraft.length?pairDraft.map((p,i)=>pairEdit===i&&!locked?`<div class="pair-entry">${pairFields('edit',p)}<div class="actions"><button class="btn primary" onclick="pairUpdate(${i})">ตกลง</button><button class="btn" onclick="pairEditAt(-1)">ยกเลิก</button></div></div>`:`<div class="pair-item"><div><b>${esc(p.a||'ยังไม่มีชื่อ')} / ${esc(p.b||'ยังไม่มีชื่อ')}</b><div class="small muted">${esc(p.level)} · ${esc(pairOrg(p.org))}${p.lock?' · ล็อก TEAM '+esc(p.lock):''}</div></div>${locked?'':`<div class="actions"><button class="btn" onclick="pairEditAt(${i})">แก้ไข</button><button class="btn danger" onclick="pairRemove(${i})">ลบ</button></div>`}</div>`).join(''):'<p class="muted">ยังไม่มีรายชื่อคู่ใน PAIRS เพิ่มคู่ได้ทันที หรือกรอกในชีตแล้วกดดึงข้อมูล</p>'}</div><p class="small muted">${pairDraft.length}/36 คู่ · บันทึกทยอยได้ ไม่ต้องรอครบ</p><h3 style="margin-top:14px">2. เงื่อนไขการสุ่ม</h3><p>4 ทีม · ระดับมือละ 3 คู่ · รักษาคู่เดิมและทีมล็อก</p><label class="draw-check"><input type="checkbox" ${pairSettings.strict?'checked':''} ${locked?'disabled':''} onchange="pairChangeSetting('strict',this)"> หน่วยงานเดียวกันอยู่ทีมเดียวกันไม่เกิน 1 คู่</label><label class="draw-check"><input type="checkbox" ${pairSettings.balance?'checked':''} ${locked?'disabled':''} onchange="pairChangeSetting('balance',this)"> กระจายหน่วยงานให้สมดุลเมื่อปิดเงื่อนไขบังคับ</label><button class="btn" ${locked?'disabled':''} onclick="pairCommit(false)">บันทึกรายชื่อ / เงื่อนไข</button></section>`}
function drawPage(){let h=heading('สุ่มจัดทีมและจัดคู่แข่งขัน','TEAM DRAW · DOAE BADMINTON OPEN #2');if(drawTab==='sim')return h+`<div class="actions" style="margin:16px 0"><button class="btn" onclick="drawTabGo('draw')">สุ่มจัดทีม</button><button class="btn primary" onclick="drawTabGo('sim')">จำลองการสุ่ม</button><button class="btn" onclick="drawTabGo('line')">Line-up</button></div>`+simPage();if(!drawData||!drawData.pairs||!drawData.source)return h+'<section class="panel"><p>กรุณาอัปเดต Apps Script V7.1 และ Deploy เวอร์ชันใหม่ของ Deployment เดิม</p><button class="btn" onclick="drawTabGo(\'sim\')">จำลองการสุ่ม</button></section>';let locked=drawStarted()||drawData.published,assigned=Object.keys(drawData.assignment).length;pairInit();let dirty=!drawData.published&&pairDirty(),counts=pairCounts(),ready=pairDraft.length===36&&drawLevels.every(l=>counts[l]===12)&&pairDraft.every(p=>p.a.trim()&&p.b.trim()&&p.org&&p.id);return h+`<div class="control-hero"><div><div class="eyebrow">OFFICIAL TEAM DRAW</div><h1>36 คู่ · 4 ทีม · 3 ระดับมือ</h1><p>รักษาคู่เดิม · ระดับมือละ 3 คู่ต่อทีม</p></div><span class="pill ${drawData.published?'ok':'wait'}">${drawData.published?'ประกาศแล้ว':'ฉบับร่าง'}</span></div><div class="actions" style="margin:16px 0"><button class="btn ${drawTab==='draw'?'primary':''}" onclick="drawTabGo('draw')">สุ่มจัดทีม</button><button class="btn" onclick="drawTabGo('sim')">จำลองการสุ่ม</button><button class="btn ${drawTab==='line'?'primary':''}" onclick="drawTabGo('line')">Line-up</button><button class="btn" onclick="refreshRemote(true)">อัปเดตข้อมูล</button></div>`+(drawTab==='line'?drawLinePage():`<div class="control-columns">${pairEditor(locked)}<section class="panel"><h2>3. สุ่มและตรวจสอบ</h2><p class="notice ${locked?'':'info'}">${drawStarted()?'มีผลการแข่งขันแล้ว — ระบบล็อกการจัดทีม':drawData.published?'ประกาศรายชื่อแล้ว':'ผลสุ่มไม่เผยแพร่จนกว่าจะกดยืนยัน'}</p><div class="control-metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="control-metric"><span class="num">${pairDraft.length}</span><span>คู่ในรายการ</span></div><div class="control-metric"><span class="num">${assigned}</span><span>คู่ที่จัดทีมแล้ว</span></div></div><div class="actions"><button class="btn gold" ${locked||!ready?'disabled':''} onclick="pairCommit(true)">สุ่มจัดทีม / สุ่มใหม่</button><button class="btn" ${dirty||assigned!==36?'disabled':''} onclick="drawCSV()">ดาวน์โหลด CSV</button><button class="btn" ${dirty||assigned!==36?'disabled':''} onclick="openDrawCeremony(drawData.pairs,drawData.assignment,false)">เล่นเอฟเฟกต์ซ้ำ</button></div>${dirty?'<p class="notice info">รายชื่อหรือเงื่อนไขเปลี่ยนแล้ว กรุณาสุ่มใหม่ก่อนประกาศ</p>':''}<h3 style="margin-top:14px">สลับคู่ระดับมือเดียวกัน</h3><div class="field"><label>คู่แรก</label><select id="swap-x">${drawPairOptions()}</select></div><div class="field"><label>คู่ที่สอง</label><select id="swap-y">${drawPairOptions()}</select></div><button class="btn" ${locked||dirty||assigned!==36?'disabled':''} onclick="drawSwap()">สลับคู่</button><div class="actions" style="margin-top:18px"><button class="btn primary" ${locked||dirty||assigned!==36?'disabled':''} onclick="drawPublish()">ยืนยันและประกาศทีม</button>${isSuper()&&drawData.published&&!drawStarted()?'<button class="btn danger" onclick="drawUnlock()">ปลดล็อกผลสุ่ม</button>':''}</div><p class="small muted">เมื่อเริ่มมีคะแนน ระบบจะไม่อนุญาตให้เปลี่ยนการจัดทีม</p></section></div>${dirty?'<p class="notice info">ผลสุ่มเดิมจะไม่แสดงจนกว่าจะสุ่มด้วยข้อมูลล่าสุด</p>':drawBoard()}`)}


function simClean(p,partial=false){simCheck(Array.isArray(p)&&(partial?p.length<=36:p.length===36),partial?'จำนวนคู่เกิน 36':'ต้องมี 36 คู่');let ids=new Set(),names=new Set();let pairs=p.map((r,i)=>{let id=String(r.id||'').trim().toUpperCase(),level=String(r.level||'').trim().toUpperCase(),org=String(r.org||'').trim().toUpperCase(),a=String(r.a||'').trim(),b=String(r.b||'').trim(),lock=String(r.lock||'').trim().toUpperCase();simCheck(/^[A-Z0-9_-]{1,24}$/.test(id)&&!ids.has(id),'รหัสคู่ไม่ถูกต้องหรือซ้ำ: '+id);ids.add(id);simCheck(drawLevels.includes(level)&&/^ORG([1-9]|1[0-2])$/.test(org),'ระดับมือหรือหน่วยงานไม่ถูกต้อง แถว '+(i+1));simCheck(a&&b&&a.length<=80&&b.length<=80&&!/[\t\r\n]/.test(a+b)&&! /^[=+\-@]/.test(a)&&! /^[=+\-@]/.test(b),'ชื่อไม่ถูกต้อง แถว '+(i+1));for(let n of [a,b]){let k=n.toLowerCase().replace(/\s+/g,' ');simCheck(!names.has(k),'พบชื่อนักกีฬาซ้ำ: '+n);names.add(k)}simCheck(!lock||teamIds.includes(lock),'ทีมล็อกไม่ถูกต้อง');return {id,level,org,a,b,lock}});for(let l of drawLevels)simCheck(partial?pairs.filter(p=>p.level===l).length<=12:pairs.filter(p=>p.level===l).length===12,l+' ต้องมีไม่เกิน 12 คู่ และต้องครบก่อนสุ่ม');return pairs}
function simValidate(pairs,as,settings){simCheck(pairs.length===36&&as&&Object.keys(as).length===36,'ต้องจัดครบ 36 คู่');for(let t of teamIds){let g=pairs.filter(p=>as[p.id]===t);for(let l of drawLevels)simCheck(g.filter(p=>p.level===l).length===3,'TEAM '+t+' '+l+' ต้องมี 3 คู่');if(settings.strict)simCheck(new Set(g.map(p=>p.org)).size===g.length,'TEAM '+t+' มีหน่วยงานซ้ำ')}for(let p of pairs)simCheck(teamIds.includes(as[p.id])&&(!p.lock||as[p.id]===p.lock),'ผิดเงื่อนไขคู่ล็อก: '+p.id);return true}
function simShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function simSolve(pairs,settings){
 let best=null,bestCost=Infinity;const caps=()=>Object.fromEntries(teamIds.map(t=>[t,Object.fromEntries(drawLevels.map(l=>[l,0]))]));
 for(let t of teamIds)for(let l of drawLevels)simCheck(pairs.filter(p=>p.lock===t&&p.level===l).length<=3,'คู่ล็อกเกิน 3 คู่: '+t+' '+l);
 if(settings.strict){
  let groups=Array.from(new Set(pairs.map(p=>p.org))).map(org=>{let ps=pairs.filter(p=>p.org===org),opts=[];simCheck(ps.length<=4,'หน่วยงาน '+org+' มีเกิน 4 คู่ ไม่สามารถแยกทุกคู่ต่างทีม');function gen(i,used,list){if(i===ps.length){opts.push(list);return}let p=ps[i];for(let t of (p.lock?[p.lock]:teamIds))if(!used.includes(t))gen(i+1,[...used,t],[...list,t])}gen(0,[],[]);simCheck(opts.length,'คู่ล็อกขัดกับเงื่อนไขหน่วยงาน '+org);return {ps,opts}});
  let c=caps(),as={},seen=new Set(),steps=0;const cap=60000;function feasible(g,o){let used={};return g.ps.every((p,i)=>{let t=o[i],k=t+'-'+p.level;used[k]=(used[k]||0)+1;return c[t][p.level]+used[k]<=3})}
  function dfs(left){if(!left.length)return true;if(++steps>cap)return false;let key=left.map(i=>i).join(',')+'|'+teamIds.flatMap(t=>drawLevels.map(l=>c[t][l])).join('');if(seen.has(key))return false;let pick=-1,opts=null;for(let i of left){let os=groups[i].opts.filter(o=>feasible(groups[i],o));if(!os.length){seen.add(key);return false}if(!opts||os.length<opts.length){pick=i;opts=os}}let g=groups[pick];for(let o of simShuffle(opts)){g.ps.forEach((p,i)=>{c[o[i]][p.level]++;as[p.id]=o[i]});if(dfs(left.filter(i=>i!==pick)))return true;g.ps.forEach((p,i)=>{c[o[i]][p.level]--;delete as[p.id]});if(steps>cap)break}seen.add(key);return false}
  if(dfs(groups.map((_,i)=>i)))best={...as};
 }else{for(let n=0;n<(settings.balance?80:1);n++){let c=caps(),orgs=Object.fromEntries(teamIds.map(t=>[t,{}])),as={};function put(p,t){as[p.id]=t;c[t][p.level]++;orgs[t][p.org]=(orgs[t][p.org]||0)+1}for(let p of pairs.filter(p=>p.lock))put(p,p.lock);for(let p of simShuffle(pairs.filter(p=>!p.lock))){let ts=simShuffle(teamIds.filter(t=>c[t][p.level]<3));if(settings.balance)ts.sort((a,b)=>(orgs[a][p.org]||0)-(orgs[b][p.org]||0));put(p,ts[0])}let cost=Object.values(orgs).reduce((n,o)=>n+Object.values(o).reduce((a,c)=>a+c*(c-1)/2,0),0);if(cost<bestCost){best={...as};bestCost=cost}if(cost===0)break}}
 simCheck(best,'ไม่พบผลสุ่มภายในขอบเขตการค้นหา — ตรวจจำนวนคู่ล็อก/หน่วยงาน หรือผ่อนเงื่อนไข');simValidate(pairs,best,settings);return best
}

let simMode='sample',simRules={strict:false,balance:true},simResult=null,simError='',simSpeed='normal';
const simCheck=(ok,msg)=>{if(!ok)throw Error(msg)};
function simSample(){return Array.from({length:12},(_,i)=>drawLevels.map(l=>({id:'SIM-'+l+'-'+(i+1),level:l,org:'ORG'+(i+1),a:'ตัวอย่าง '+l+' '+String(i+1).padStart(2,'0')+' A',b:'ตัวอย่าง '+l+' '+String(i+1).padStart(2,'0')+' B',lock:''}))).flat()}
function simPairs(){if(simMode==='sample')return simSample();return JSON.parse(JSON.stringify(pairDraft||drawData?.source?.pairs||[]))}
function simOrg(o){return drawData?.source?.orgs?.find(x=>x.id===o)?.name||o}

// Shared roster engine: a fixed pair is an indivisible unit, independent of organization.
const R74_LEVELS=['BABY','BG','NS'],R74_TEAMS=['A','B','C','D'];
function r74Check(x,msg){if(!x)throw Error(msg)}
function r74Shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function r74Clean(rows){r74Check(Array.isArray(rows)&&rows.length<=72,'รายชื่อเกิน 72 คน');let ids=new Set(),names=new Set(),groups={};let out=rows.map((p,i)=>{let id=String(p.id||'').trim(),level=String(p.level||'').trim().toUpperCase(),name=String(p.name||'').trim(),nick=String(p.nick||'').trim(),org=String(p.org||'').trim().toUpperCase(),fixed=String(p.fixed||'').trim(),order=Number(p.order)||i+1,sourceOrg=String(p.sourceOrg||'').trim();r74Check(/^[A-Za-z0-9_-]{1,24}$/.test(id)&&!ids.has(id),'รหัสนักกีฬาซ้ำหรือไม่ถูกต้อง '+id);ids.add(id);r74Check(R74_LEVELS.includes(level)&&/^ORG([1-9]|1[0-2])$/.test(org),'ระดับมือ/หน่วยงานไม่ถูกต้อง: '+name);r74Check(name&&name.length<=100&&nick.length<=60&&!/[\r\n\t]/.test(name+nick)&&! /^[=+@-]/.test(name)&&! /^[=+@-]/.test(nick),'ชื่อไม่ถูกต้อง '+id);let key=name.toLowerCase().replace(/\s+/g,' ');r74Check(!names.has(key),'ชื่อซ้ำ: '+name);names.add(key);r74Check(!fixed||/^[A-Za-z0-9_-]{1,24}$/.test(fixed),'รหัสคู่ไม่ถูกต้อง');let q={id,level,name,nick,org,fixed,order,sourceOrg};if(fixed)(groups[fixed]??=[]).push(q);return q});for(let g of Object.values(groups))r74Check(g.length===2&&g[0].level===g[1].level,'คู่ที่กำหนดไว้ต้องมี 2 คนในระดับมือเดียวกัน: '+g[0].fixed);for(let l of R74_LEVELS)r74Check(out.filter(p=>p.level===l).length<=24,l+' เกิน 24 คน');return out.sort((a,b)=>a.order-b.order)}
function r74Pair(a,b){return {id:'P-'+a.id+'-'+b.id,level:a.level,org:a.org,org2:b.org,a:a.name,b:b.name,nick1:a.nick,nick2:b.nick,player1:a.id,player2:b.id,fixed:!!a.fixed,lock:''}}
function r74PairOrgs(p){return [...new Set([p.org,p.org2||p.org])]}
function r74Pairs(rows,preferSame=true){let out=[],groups={};for(let p of rows.filter(x=>x.fixed))(groups[p.fixed]??=[]).push(p);for(let g of Object.values(groups))out.push(r74Pair(g[0],g[1]));for(let l of R74_LEVELS){let free=r74Shuffle(rows.filter(p=>p.level===l&&!p.fixed));r74Check(free.length%2===0,l+' มีนักกีฬาอิสระจำนวนคี่ กรุณาเพิ่มรายชื่อหรือกำหนดคู่ให้ครบ');while(free.length){let a=free.pop();let i=preferSame?free.findIndex(b=>b.org===a.org):-1; // Prefer no extra organization incidence; free pair remains random among eligible players.
 if(i<0)i=Math.floor(Math.random()*free.length);out.push(r74Pair(a,free.splice(i,1)[0]))}}return out}
function r74Cost(pairs,as){let cost=0;for(let t of R74_TEAMS){let counts={};for(let p of pairs.filter(x=>as[x.id]===t))for(let o of r74PairOrgs(p))counts[o]=(counts[o]||0)+1;cost+=Object.values(counts).reduce((a,n)=>a+n*(n-1)/2,0)}return cost}
function r74Validate(rows,pairs,as,settings,full=false){let by=Object.fromEntries(rows.map(p=>[p.id,p])),seen=new Set(),fixedTeams={};r74Check(pairs.length*2===rows.length&&Object.keys(as).length===pairs.length,'จัดไม่ครบทุกคน');for(let p of pairs){let a=by[p.player1],b=by[p.player2],t=as[p.id];r74Check(a&&b&&a.id!==b.id&&!seen.has(a.id)&&!seen.has(b.id)&&R74_TEAMS.includes(t)&&a.level===b.level&&p.level===a.level&&p.a===a.name&&p.b===b.name&&p.org===a.org&&p.org2===b.org,'ข้อมูลคู่หรือทีมไม่ถูกต้อง');for(let q of [a,b]){seen.add(q.id);if(q.fixed){r74Check(a.fixed===b.fixed,'แยกคู่ที่กำหนดไว้');fixedTeams[q.fixed]=t}}}for(let l of R74_LEVELS){let c=R74_TEAMS.map(t=>pairs.filter(p=>p.level===l&&as[p.id]===t).length);r74Check(Math.max(...c)-Math.min(...c)<=1&&(!full||c.every(n=>n===3)),'จำนวนคู่ระดับมือไม่สมดุล '+l)}let counts=R74_TEAMS.map(t=>pairs.filter(p=>as[p.id]===t).length);r74Check(Math.max(...counts)-Math.min(...counts)<=1&&(!full||counts.every(n=>n===9)),'จำนวนสมาชิกไม่สมดุล');if(settings.strict)r74Check(r74Cost(pairs,as)===0,'หน่วยงานเดียวกันซ้ำหลายคู่ในทีม');return true}
function r74Solve(input,settings){let rows=r74Clean(input);r74Check(rows.length>0,'ยังไม่มีนักกีฬา');for(let l of R74_LEVELS)r74Check(rows.filter(p=>p.level===l).length%2===0,l+' จำนวนผู้เล่นเป็นเลขคี่');let best=null,bestCost=Infinity;let strict=!!settings.strict; // unavoidable strict lower bound from fixed pairs and remaining singles.
 if(strict){for(let org of [...new Set(rows.map(p=>p.org))]){let fixed=new Set(rows.filter(p=>p.org===org&&p.fixed).map(p=>p.fixed)).size;let free=R74_LEVELS.reduce((n,l)=>n+Math.ceil(rows.filter(p=>p.org===org&&!p.fixed&&p.level===l).length/2),0);r74Check(fixed+free<=4,'เงื่อนไขไม่เกิน 1 คู่ต่อหน่วยงานจัดไม่ได้: '+org+' มีอย่างน้อย '+(fixed+free)+' คู่สำหรับ 4 ทีม — ปิดเงื่อนไขบังคับและเลือกกระจายให้สมดุล') }}
 for(let round=0;round<120;round++){let pairs=r74Pairs(rows,(settings.balance||strict)&&round%3!==0),as={},caps=Object.fromEntries(R74_TEAMS.map(t=>[t,{}])),total=Object.fromEntries(R74_TEAMS.map(t=>[t,0])),orgs=Object.fromEntries(R74_TEAMS.map(t=>[t,{}]));for(let l of R74_LEVELS){let n=pairs.filter(p=>p.level===l).length,base=Math.floor(n/4),extra=n%4,ts=r74Shuffle(R74_TEAMS).sort((a,b)=>total[a]-total[b]);for(let t of R74_TEAMS)caps[t][l]=base;for(let t of ts.slice(0,extra))caps[t][l]++;for(let t of R74_TEAMS)total[t]+=caps[t][l]}
  let remaining=r74Shuffle(pairs).sort((a,b)=>r74PairOrgs(b).length-r74PairOrgs(a).length);for(let p of remaining){let ts=r74Shuffle(R74_TEAMS.filter(t=>caps[t][p.level]>0));let score=t=>r74PairOrgs(p).reduce((n,o)=>n+(orgs[t][o]||0),0);if(settings.balance||strict)ts.sort((a,b)=>score(a)-score(b));let t=ts[0];as[p.id]=t;caps[t][p.level]--;for(let o of r74PairOrgs(p))orgs[t][o]=(orgs[t][o]||0)+1}
  let cost=r74Cost(pairs,as);if(settings.balance||strict){for(let pass=0;pass<3&&cost>0;pass++){let improved=false;for(let p of r74Shuffle(pairs))for(let q of r74Shuffle(pairs)){if(p.level!==q.level||as[p.id]===as[q.id])continue;[as[p.id],as[q.id]]=[as[q.id],as[p.id]];let c=r74Cost(pairs,as);if(c<cost){cost=c;improved=true}else [as[p.id],as[q.id]]=[as[q.id],as[p.id]]}if(!improved)break}}
  if(cost<bestCost){best={pairs,assignment:{...as},cost};bestCost=cost}if(cost===0||((settings.balance||strict)&&cost===m75Lower(rows).reduce((n,x)=>n+x.cost,0))||(!settings.balance&&!strict))break;
 }r74Check(best&&(!strict||best.cost===0),'ไม่พบผลที่ตรงเงื่อนไขบังคับในขอบเขตการค้นหา ลองผ่อนเงื่อนไขหรือสุ่มใหม่');r74Validate(rows,best.pairs,best.assignment,settings,rows.length===72);return best}

// V7.5 shared matchup engine; IDs of vacant slots are preview-only.
function m75Lower(rows){let out=[];for(let org of new Set(rows.map(p=>p.org))){let fixed=new Set(rows.filter(p=>p.org===org&&p.fixed).map(p=>p.fixed)).size,free=R74_LEVELS.reduce((n,l)=>n+Math.ceil(rows.filter(p=>p.org===org&&!p.fixed&&p.level===l).length/2),0),n=fixed+free,q=Math.floor(n/4),r=n%4,c=4*q*(q-1)/2+r*q;if(c)out.push({org,minPairs:n,cost:c})}return out}
function m75Conflicts(pairs,as){let out=[];for(let t of R74_TEAMS){let groups={};for(let p of pairs.filter(p=>as[p.id]===t))for(let o of r74PairOrgs(p)){if(!groups[o])groups[o]=[];groups[o].push(p)}for(let o of Object.keys(groups))if(groups[o].length>1)out.push({team:t,org:o,pairs:groups[o]})}return out}
function m75Roster(pairs,as,t,pad){let out=[];for(let l of R74_LEVELS){let ps=pairs.filter(p=>as[p.id]===t&&p.level===l);for(let p of ps){out.push({id:p.id+':1',name:p.a,nick:p.nick1||'',org:p.vacant1?'':p.org,level:l,pair:p.id,fixed:!!p.fixed,vacant:!!p.vacant1});out.push({id:p.id+':2',name:p.b,nick:p.nick2||'',org:p.vacant2?'':(p.org2||p.org),level:l,pair:p.id,fixed:!!p.fixed,vacant:!!p.vacant2})}r74Check(ps.length<=3,'โควตาทีมเกิน');if(pad)for(let i=ps.length*2;i<6;i++)out.push({id:'VACANT-'+t+'-'+l+'-'+i,name:'รอนักกีฬา '+l,org:'',level:l,pair:'',vacant:true})}return out}
function m75Build(types,roster,keep){let pools=Object.fromEntries(R74_LEVELS.map(l=>[l,r74Shuffle(roster.filter(p=>p.level===l))])),out=[];for(let k of types){let ls=k.split(' + '),a=pools[ls[0]].pop();r74Check(a,'ผู้เล่นไม่ครบ');let pool=pools[ls[1]],j=keep&&ls[0]===ls[1]&&a.pair?pool.findIndex(x=>x.pair===a.pair):-1;if(j<0)j=pool.length-1;r74Check(j>=0,'ผู้เล่นไม่ครบ');out.push([a,pool.splice(j,1)[0]])}return out}
function m75Collision(a,b){let x=new Set(a.filter(p=>p.org).map(p=>p.org)),y=new Set(b.filter(p=>p.org).map(p=>p.org));return [...x].filter(o=>y.has(o)).length}
function m75Stats(a,b,types){let clash=0,kept=0,split=0,vacant=0;for(let i=0;i<types.length;i++){clash+=m75Collision(a[i],b[i]);for(let p of [a[i],b[i]]){if(p.some(x=>x.vacant))vacant++;if(types[i].split(' + ')[0]===types[i].split(' + ')[1]&&!p.some(x=>x.vacant)){if(p[0].pair&&p[0].pair===p[1].pair)kept++;else split++}}}return {clash,kept,split,vacant}}
function m75Solve(pairs,as,ids,settings,finalTeams,finalPair,pad){let out=[];for(let b of ids){let teams=b===7?finalTeams:RR[b-1].slice(0,2);r74Check(teams&&teams.length===2&&teams.every(t=>R74_TEAMS.includes(t)),'ยังไม่ทราบทีมคู่ชิง');let types=b===7?['BABY + BABY','BG + BG','NS + NS','BABY + BG',finalPair]:['BABY + BABY','BABY + BABY','BG + BG','BG + BG','NS + NS','NS + NS','BABY + BG','BABY + NS','BG + NS'];let ra=m75Roster(pairs,as,teams[0],pad),rb=m75Roster(pairs,as,teams[1],pad),best=null,score=Infinity;for(let i=0;i<240;i++){let a=m75Build(types,ra,settings.keep&&i%4!==3),z=m75Build(types,rb,settings.keep&&i%4!==3);let st=m75Stats(a,z,types),cost=(settings.avoid?st.clash*100:0)+(settings.keep?st.split:0);if(cost<score){best={b,teams,types,a,z,stats:st};score=cost}if(cost===0||(!settings.avoid&&!settings.keep))break}out.push(best)}return out}
function m75Lists(result){let out={};for(let r of result){out[r.b+'-'+r.teams[0]]=r.a.map(p=>p.map(x=>x.id));out[r.b+'-'+r.teams[1]]=r.z.map(p=>p.map(x=>x.id))}return out}

function v76HasLine(b){return Object.keys(drawData?.lineups||{}).some(k=>k.startsWith(b+'-'))}
function v76ResetOfficial(ids){if(!canAdmin()||busy||fetching||!drawData?.published)return;if(ids.some(v76ResetLocked)){alert('มี Battle ที่มีคะแนนหรือรอรับรองแล้ว ให้เลือกเฉพาะ Battle ที่ยังไม่เริ่ม');return}if(!ids.some(v76HasLine)){toast('ยังไม่มี Line-up ให้รีเซ็ต');return}let reason=prompt('ระบุเหตุผลถอนประกาศ Line-up ทางการ');if(!reason?.trim())return;if(confirm('ถอนประกาศ Line-up ทั้งสองทีมของ Battle '+ids.join(', ')+'? จะไม่ลบคะแนนหรือผลจัดทีม'))drawRequest('lineupReset',{battles:ids,reason:reason.trim()})}
function v76ResetDraw(){if(!canAdmin()||busy||fetching||!drawData||drawStarted())return;if(drawData.published&&!isSuper()){alert('เฉพาะ Super Admin ถอนประกาศทีม');return}let reason=prompt('ระบุเหตุผลรีเซ็ตผลจัดทีม');if(!reason?.trim())return;if(confirm('ล้างผลจัดทีม A–D และ Line-up ทั้งหมด? คงรายชื่อสมัครเดิมไว้ ไม่ลบคะแนนหรือบัญชี'))drawRequest('drawReset',{reason:reason.trim()})}
const v76OldM75Page=m75Page;
m75Page=function(){let html=v76OldM75Page(),ids=m75Selected(),p=m75Preview,saved=ids.some(v76HasLine),locked=ids.some(v76ResetLocked),trial=v76Trial&&v76Trial.mode===m75Mode?v76Trial.result.filter(r=>ids.includes(r.b)):[];let controls=`<section class="panel" style="margin-top:16px"><div class="statusline"><h2>ทดสอบและรีเซ็ต Line-up</h2><span class="pill wait">PRACTICE / RESET</span></div><p class="small muted">ทดลองประกาศได้แม้รายชื่อไม่ครบ · ผลทดลองอยู่ในหน้านี้เท่านั้น ไม่เผยแพร่สาธารณะหรือเขียนลงชีต และจะหายเมื่อรีโหลดหรือออกจากระบบ</p><div class="actions">${r74Ready()&&r74Roster().length?'<button class="btn" onclick="v76PracticeDraw()">ทดลองสุ่มทีมจากรายชื่อปัจจุบัน</button>':''}${p?'<button class="btn primary" onclick="v76TrialSave()">ประกาศ Line-up ทดสอบ</button>':''}${p||v76Trial?'<button class="btn" onclick="v76TrialReset()">รีเซ็ตผล Line-up ทดสอบ</button>':''}${simResult?'<button class="btn" onclick="v76TrialResetAll()">รีเซ็ตทีมและ Line-up ทดสอบ</button>':''}${m75Mode==='actual'&&drawData?.published&&saved?`<button class="btn danger" ${locked?'disabled':''} onclick="v76ResetOfficial(m75Selected())">ถอนประกาศ / รีเซ็ต Line-up ทางการ</button>`:''}</div>${m75Mode==='actual'&&saved&&locked?'<p class="notice">มี Battle ที่ล็อกคะแนนแล้ว เลือก Battle ที่ยังไม่เริ่มเพื่อรีเซ็ต</p>':''}${trial.length?`<p class="notice info"><b>ประกาศทดสอบแล้ว · ${esc(v76Trial.at)}</b> · ${trial.reduce((n,r)=>n+r.types.length,0)} แมตช์ · ไม่ใช่ผลทางการ</p><button class="btn" onclick="m75Open(v76Trial.result.filter(r=>m75Selected().includes(r.b)),true)">เล่นเอฟเฟกต์ผลทดสอบซ้ำ</button>`:''}</section>`;return html.replace('<div class="control-columns" style="margin-top:16px">',controls+'<div class="control-columns" style="margin-top:16px">')+(trial.length?'<div class="notice info" style="margin-top:16px">ผลประกาศทดสอบ (เฉพาะหน้านี้)</div>'+m75Cards(trial):'')};
const v76OldDrawPage=drawPage;drawPage=function(){let h=v76OldDrawPage();if(drawTab==='draw'&&r74Ready()&&r74Roster().length&&r74Roster().length<72)h+=`<section class="panel" style="margin-top:16px"><h2>ทดลองก่อนรายชื่อครบ</h2><p class="small muted">รองรับจำนวนคี่ด้วยช่องรอคู่ทดลอง โดยไม่แก้รายชื่อจริง</p><button class="btn gold" onclick="v76PracticeDraw()">ทดลองสุ่มทีมจากรายชื่อปัจจุบัน</button></section>`;if(drawTab==='draw'&&drawData&&Object.keys(drawData.assignment||{}).length&&!drawStarted()&&(!drawData.published||isSuper()))h+=`<section class="panel" style="margin-top:16px"><h2>รีเซ็ตการจัดทีม</h2><p class="small muted">ล้างเฉพาะผลสุ่มและ Line-up เพื่อเริ่มใหม่ โดยคงรายชื่อสมัครเดิม</p><button class="btn danger" onclick="v76ResetDraw()">รีเซ็ตผลสุ่มจัดทีม</button></section>`;if(drawTab==='line'&&drawData?.published&&v76HasLine(drawB))h+=`<section class="panel" style="margin-top:16px"><h2>ถอนประกาศ Line-up</h2><p class="small muted">ล้าง Line-up ทั้งสองทีมของ Battle ที่เลือก ไม่ลบคะแนน</p><button class="btn danger" ${v76ResetLocked(drawB)?'disabled':''} onclick="v76ResetOfficial([drawB])">รีเซ็ต Line-up Battle ${drawB}</button></section>`;return h};
const v76OldLogout=logoutDemo;logoutDemo=async()=>{if(busy)return;v76Trial=null;m75Preview=null;simResult=null;closeDrawCeremony();m75Close();return v76OldLogout()};
const v76OldApply=applyRemote;applyRemote=d=>{let oldUser=remoteAccount?.username,oldRev=drawData?.revision,oldStamp=drawData?.source?.rosterStamp;v76OldApply(d);if(!canAdmin()||oldUser!==remoteAccount?.username||oldRev!==drawData?.revision||oldStamp!==drawData?.source?.rosterStamp)v76Trial=null};

// No automatic refresh while an officer is entering data. Revision checks protect stale actions.
render();refreshRemote();setInterval(()=>{if(!document.hidden)refreshRemote()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRemote()});

</script></body></html>
