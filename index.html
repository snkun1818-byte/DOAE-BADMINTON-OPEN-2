function courtOverview95(){let sorted=data.matches.slice().sort((a,b)=>a.battle-b.battle||a.wave-b.wave||a.id-b.id),live=sorted.filter(m=>m.started&&!m.score&&!m.awaiting&&!m.pending),current=data.battles.find(b=>b.a&&bm(data,b.id).some(m=>m.started&&!m.score))||data.battles.find(b=>b.a&&!b.confirmed),s=current?battleStats(data,current.id):null;return `<section class="card stack courtOverview95"><div class="sectionHeading"><div><div class="eyebrow">COURT CENTRE</div><h2>สถานะการแข่งขัน</h2></div><span class="liveText95 ${live.length?'active':''}"><i></i>${live.length?live.length+' สนามกำลังแข่งขัน':data.battles[6].confirmed?'การแข่งขันสิ้นสุดแล้ว':'ยังไม่มีสนามเริ่มแข่งขัน'}</span></div>${current?`<div class="battleStrip95"><div><span>${current.id===7?'GRAND FINAL':'BATTLE '+String(current.id).padStart(2,'0')} · ${esc(current.time)}</span><strong>${teamMark95(current.a)} <b>${s.a} : ${s.b}</b> ${teamMark95(current.b)}</strong></div><div class="battleStripRight95"><small>${s.done}/9 แมตช์ · ${current.id===7?'21':'15'} แต้ม × 2 เซต</small>${btn('ดูผล ›',`showResults(${current.id})`,'small')}</div></div>`:''}<div class="courtGrid95">${[1,2,3].map(c=>{let a=live.find(m=>m.court===c),n=sorted.find(m=>m.court===c&&byB(m.battle).a&&!byB(m.battle).confirmed&&!m.started&&!m.score&&!m.awaiting&&!m.pending);return `<article class="courtTile95"><div class="courtTop95"><strong>COURT <b>0${c}</b></strong><span class="${a?'courtActive95':''}">${a?'กำลังแข่งขัน':'ว่าง / รอเริ่ม'}</span></div><div class="courtBody95">${a?compactMatch95(a):'<div class="courtIdle95">'+sportIcon94('court')+'<span>ยังไม่มีแมตช์ที่เริ่ม</span></div>'}<div class="courtNext95">คู่ถัดไปตามตาราง</div>${n?compactMatch95(n):'<small>ไม่มีคิวถัดไป</small>'}</div></article>`}).join('')}</div></section>`}

function awards95(){let complete=data.battles.slice(0,6).every(b=>b.confirmed),pal={BB:['#f4cf35','#fff7d2','#9a6a00'],BG:['#59c36a','#ecfff0','#106a35'],NS:['#f28b29','#fff1e3','#9a4f00']};return `<section class="card stack awardsWrap95"><div class="sectionHeading awardsHead95"><div><div class="eyebrow">ROUND ROBIN AWARDS</div><h2>Best Pair</h2><p class="muted">สรุปผู้นำประเภท BB, BG และ NS จากรอบแรก 54 แมตช์ แสดงไว้ด้านบนเพื่อให้ผู้ชมและผู้บริหารเห็นได้ทันที</p></div>${btn('ดูอันดับทั้งหมด ›',"go('best')",'small')}</div><div class="awardGrid95">${LEVELS.map(l=>{let a=bestPairs(data,l),leaders=a.filter(r=>r.rank===1),accent=pal[l]||pal.BB,title=levelText94(l),status=leaders.length===1?esc(tObj(leaders[0].team).name):leaders.length?'อันดับร่วม':'รอคู่ครบ 3 แมตช์',names=leaders.length===1?leaders[0].ids.map(id=>esc(player(data,id)?.nick||player(data,id)?.name||'')).join(' / '):leaders.length?leaders.length+' คู่ขึ้นนำร่วมกัน':complete?'ยังไม่มีคู่ที่ผ่านเกณฑ์ขั้นต่ำ':'อันดับชั่วคราวระหว่างแข่งขัน',note=leaders.length===1?`${leaders[0].w}-${leaders[0].l} เซต · ${leaders[0].pf}-${leaders[0].pa} แต้ม`:complete?'คลิกเพื่อดูรายละเอียดทั้งหมด':'รอผลรอบแรกเพิ่มเติม';return `<button class="award95 awardTone95" style="--award:${accent[0]};--awardBg:${accent[1]};--awardInk:${accent[2]}" onclick="bestLevel94='${l}';go('best')"><div class="awardTop95"><span class="awardCrest95">${sportIcon94('trophy')}</span><span class="awardLabel95">${title}</span><span class="awardArrow95">${sportIcon94('arrow')}</span></div><div class="awardBody95"><h3>${title} Best Pair</h3><div class="awardStatus95">${status}</div><div class="awardNames95">${names}</div></div><div class="awardFoot95"><span>${complete?'รับรองผลรอบแรกแล้ว':'อันดับชั่วคราว'}</span><strong>${note}</strong></div></button>`}).join('')}</div></section>`}

let resultBattle=1;function showResults(b){resultBattle=b;go('results')}function matchCard(m,ls=m.lineup){let b=byB(m.battle),s=stats(m.score,scoreLimit(m)),show=ls||[null,null,null,null];let side=(tid,i)=>`<div class="side" style="border-top:3px solid ${esc(tObj(tid).color)}">${team(tid)}${[0,1].map(j=>{let id=show[i+j],p=player(data,id);return `<p>${esc(id?labelP(id):ls?'รอนักกีฬา':'ยังไม่ประกาศ')}<small>${esc(p?org(p.org):m.levels[j])}</small></p>`}).join('')}</div>`;return `<div class="match"><div class="row"><strong>M${String(m.id).padStart(2,'0')} · ${esc(m.levels.map(levelText94).join(' + '))}</strong><div class="spacer"></div><small>สนาม ${m.court} · W${m.wave}</small></div><div class="versus">${side(b.a,0)}<strong>VS</strong>${side(b.b,2)}</div><div class="scoreline">${s?`${s.a} : ${s.b} <small>(${m.score.map(q=>q.join(':')).join(' / ')})</small>`:badge(stateText94(m),m.started?'ok':m.pending||m.awaiting?'warn':'')}</div></div>`}

function editPlayer(id){let p=player(data,id)||{name:'',nick:'',team:'A',level:'BABY',org:'',pair:'',active:true};modal(modalHead(id?'แก้ไขนักกีฬา':'เพิ่มนักกีฬา')+`<div class="formgrid"><div><label>ชื่อจริง</label><input id="pn" value="${esc(p.name)}"></div><div><label>ชื่อเล่น</label><input id="pk" value="${esc(p.nick)}"></div><div><label>หน่วยงาน</label><select id="po">${opt('','เลือกหน่วยงาน',p.org)}${data.orgs.map(o=>opt(o.id,o.name,p.org)).join('')}</select></div><div><label>ทีม</label><select id="pt">${IDS.map(t=>opt(t,tObj(t).name,p.team)).join('')}</select></div><div><label>ระดับมือ</label><select id="pl">${options(LEVELS,p.level)}</select></div><div><label>รหัสคู่เดิม (ถ้ามี)</label><input id="pp" value="${esc(p.pair)}"></div></div><label><input type="checkbox" id="pa" ${p.active?'checked':''}> เข้าร่วมการแข่งขัน</label><div class="actions">${btn('บันทึก',`savePlayer('${id}')`,'primary')}${id?btn('ลบรายชื่อ',`removePlayer('${id}')`,'danger'):''}</div>`)}function savePlayer(id){act('savePlayer',{player:{id,name:formVal('pn'),nick:formVal('pk'),org:formVal('po'),team:formVal('pt'),level:formVal('pl'),pair:formVal('pp'),active:$('pa').checked}})}function removePlayer(id){let r=reason('ลบรายชื่อ');if(r)act('removePlayer',{player:{id},reason:r})}function teamDialog(){modal(modalHead('แก้ชื่อและสีทีม')+data.teams.map(t=>`<div class="formgrid"><div><label>ทีม ${t.id}</label><input id="tn${t.id}" value="${esc(t.name)}"></div><div><label>สี</label><input type="color" id="tc${t.id}" value="${esc(t.color)}"></div></div>`).join('')+btn('บันทึก','saveTeams()','primary'))}function saveTeams(){act('saveTeams',{teams:IDS.map(id=>({id,name:formVal('tn'+id),color:formVal('tc'+id)}))})}
function schedule(){return `<div class="stack"><div class="row"><h1>ตารางแมตช์</h1><div class="spacer"></div>${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div><div class="note">แก้ทีมใน 6 Battle พร้อมกันได้ แต่ต้องครบทุกคู่ไม่ซ้ำ · รอบชิงกำหนดจากอันดับ · เปลี่ยนเวลาได้ทุก Battle · การเปลี่ยนประเภทจะถอน Line-up ของแมตช์ที่เกี่ยวข้อง</div>${data.battles.map(b=>`<div class="card stack"><div class="row"><h2>Battle ${b.id}${b.id===7?' · FINAL':''}</h2>${b.confirmed?badge('รับรองแล้ว','ok'):''}</div><div class="grid3"><div><label>ทีม A (ฝั่งซ้าย)</label><select id="ba${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.a)}${IDS.map(t=>opt(t,tObj(t).name,b.a)).join('')}</select></div><div><label>ทีม B (ฝั่งขวา)</label><select id="bb${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.b)}${IDS.map(t=>opt(t,tObj(t).name,b.b)).join('')}</select></div><div><label>เวลา</label><input id="bt${b.id}" value="${esc(b.time)}"></div></div><div class="tablewrap"><table><thead><tr><th>Match</th><th>มือ 1</th><th>มือ 2</th><th>สนาม</th><th>Wave</th></tr></thead><tbody>${bm(data,b.id).map(m=>{let dis=locked(b)||hasScore(m)?'disabled':'';return `<tr><td>${m.id}</td><td><select id="l1${m.id}" ${dis}>${options(LEVELS,m.levels[0])}</select></td><td><select id="l2${m.id}" ${dis}>${options(LEVELS,m.levels[1])}</select></td><td><select id="c${m.id}" ${dis}>${options([1,2,3],m.court)}</select></td><td><select id="w${m.id}" ${dis}>${options([1,2,3,4,5,6,7,8,9],m.wave)}</select></td></tr>`}).join('')}</tbody></table></div></div>`).join('')}${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div>`}function saveSchedule(){act('saveSchedule',{battles:data.battles.map(b=>({id:b.id,a:formVal('ba'+b.id)||null,b:formVal('bb'+b.id)||null,time:formVal('bt'+b.id)})),matches:data.matches.map(m=>({id:m.id,levels:[formVal('l1'+m.id),formVal('l2'+m.id)],court:Number(formVal('c'+m.id)),wave:Number(formVal('w' let drawAvoid=true,drawKeep=true;function draw(){let sel=drawBattle,bs=sel==='all'?[1,2,3,4,5,6]:[Number(sel)],ms=bs.flatMap(b=>bm(data,b)),entries=draft&&draft.key===sel?draft.entries:null,can=bs.every(id=>{let b=byB(id);return b.a&&b.b&&!locked(b)&&!bm(data,id).some(hasScore)});return `<div class="stack"><div class="hero"><small>MATCH-UP DRAW CEREMONY</small><h1>สุ่มคู่แข่งขัน <span class="goldtext">VS</span></h1><p>ใช้สมาชิกทีมที่กำหนดไว้ · ไม่สุ่มย้ายทีม</p></div><div class="card stack"><div class="formgrid"><div><label>เลือกรอบ / Battle</label><select onchange="drawBattle=this.value;draft=null;render()">${opt('all','รอบแรกทั้งหมด 54 แมตช์',sel)}${data.battles.map(b=>opt(String(b.id),`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,sel)).join('')}</select></div><div><label>โหมด</label><select onchange="practice=this.value==='test';draft=null;render()">${opt('real','ทางการ',practice?'test':'real')}${opt('test','จำลอง (ไม่บันทึก)',practice?'test':'real')}</select></div></div><label><input type="checkbox" ${drawAvoid?'checked':''} onchange="drawAvoid=this.checked"> ลดการพบหน่วยงานเดียวกัน</label><label><input type="checkbox" ${drawKeep?'checked':''} disabled> รักษาคู่หลักเดิมเพื่อ Best Pair</label><div class="note">สุ่มแบบค้นหาผลที่เหมาะสม ไม่รับประกันว่าความซ้ำจะเป็น 0 · รักษาคู่หลัก 2 คู่ต่อมือ · ลงซ้ำได้ต่าง Wave · ห้ามชนสนาม · ช่องว่างต้องแก้ก่อนเริ่ม</div><div class="actions">${btn('⟳ สุ่มคู่แข่งขัน','runDraw()','gold',!practice&&!can||bs.some(id=>!byB(id).a))}${btn('เล่นเอฟเฟกต์ซ้ำ','replayDraw()','',!entries&&!ms.some(m=>m.published))}${btn('ประกาศ Line-up','publishDraft()','primary',!entries||practice||!can)}${btn('ถอนประกาศ / รีเซ็ต','resetLineups()','danger',practice||!can)}${btn('ดาวน์โหลด CSV','exportLineups()')}</div>${entries?`<div class="${practice?'warning':'note'}">${practice?'ผลจำลอง ไม่บันทึกฐานข้อมูล':'ผลร่าง ยังไม่ประกาศ'} · ${entries.length} แมตช์ · หน่วยงานชน ${quality(data,entries.map(e=>e.lineup)).clash} · ช่องว่าง ${quality(data,entries.map(e=>e.lineup)).missing}</div>`:''}</div>${bs.map(bid=>`<div class="card stack"><div class="row"><h2>Battle ${bid} · ${esc(tObj(byB(bid).a).name)} VS ${esc(tObj(byB(bid).b).name)}</h2><div class="spacer"></div>${badge(bm(data,bid).filter(m=>m.published).length+'/9 ประกาศแล้ว','ok')}${btn('แก้ Line-up',`lineupDialog(${bid})`,'small',!byB(bid).a||locked(byB(bid)))}</div><div class="matchgrid">${bm(data,bid).map(m=>matchCard(m,entries?.find(e=>e.id===m.id)?.lineup||m.lineup)).join('')}</div></div>`).join('')}</div>`}
function runDraw(){try{let bs=drawBattle==='all'?[1,2,3,4,5,6]:[Number(drawBattle)];if(!practice)ensure(bs.every(id=>!locked(byB(id))&&!bm(data,id).some(hasScore)),'Battle ล็อกแล้ว');let entries=bs.flatMap(id=>generate(data,id,{avoid:drawAvoid,keep:drawKeep}));draft={key:drawBattle,entries,revision:data.revision};render();startCeremony(entries,practice?'PRACTICE':'OFFICIAL DRAW')}catch(e){toast(e.message)}}function replayDraw(){let bs=drawBattle==='all'?[1,2,3,4,5,6]:[Number(drawBattle)],e=draft?.entries||bs.flatMap(id=>bm(data,id).filter(m=>m.published).map(m=>({id:m.id,lineup:m.lineup})));if(e.length)startCeremony(e,practice?'PRACTICE':'REPLAY')}function publishDraft(){if(!draft||practice)return;if(draft.revision!==data.revision){toast('ข้อมูลเปลี่ยน กรุณาสุ่มใหม่');return}if(confirm('ประกาศ '+draft.entries.length+' แมตช์ให้ผู้ชม?'))act('publishLineups',{lineups:draft.entries},()=>draft=null)}function resetLineups(){let r=reason('ถอนประกาศ Line-up ที่เลือก');if(r)act('resetLineups',{battle:drawBattle==='all'?'all':Number(drawBattle),reason:r},()=>draft=null)}
function lineupDialog(id){let b=byB(id),ms=bm(data,id),entries=draft?.entries||[];modal(modalHead('แก้ Line-up · Battle '+id)+`<div class="note">เลือกนักกีฬาแต่ละตำแหน่ง หรือรอนักกีฬา · ห้ามซ้ำใน Wave · แมตช์ที่เริ่มหรือมีคะแนนแก้ไม่ได้</div>${ms.map(m=>{let ls=entries.find(x=>x.id===m.id)?.lineup||m.lineup||[null,null,null,null];return `<div style="border-bottom:1px solid #e1e7ef;padding:10px 0"><strong>Match ${m.id} · ${m.levels.join(' + ')}</strong><div class="formgrid">${[0,1,2,3].map(i=>`<div><label>${esc(tObj(i<2?b.a:b.b).name)} · ${m.levels[i%2]}</label><select id="lp${m.id}_${i}" ${hasScore(m)?'disabled':''}>${opt('','รอนักกีฬา',ls[i])}${data.players.filter(p=>p.active&&p.team===(i<2?b.a:b.b)&&p.level===m.levels[i%2]).map(p=>opt(p.id,labelP(p.id),ls[i])).join('')}</select></div>`).join('')}</div></div>`}).join('')}<div class="actions">${btn('บันทึกและประกาศ',`saveLineup(${id})`,'primary')}${btn('ยกเลิก','closeModal()')}</div>`)}function saveLineup(id){let entries=bm(data,id).filter(m=>!hasScore(m)).map(m=>({id:m.id,lineup:[0,1,2,3].map(i=>formVal('lp'+m.id+'_'+i)||null)}));try{let d=copy(data);for(let q of entries)d.matches.find(m=>m.id===q.id).lineup=q.lineup;validateLineups(d,id)}catch(e){toast(e.message);return}act('publishLineups',{lineups:entries},()=>draft=null)}
function exportLineups(){let entries=draft?.entries||data.matches.filter(m=>m.published).map(m=>({id:m.id,lineup:m.lineup}));let rows=[['match','battle','court','wave','type','team_a','player_a1','player_a2','team_b','player_b1','player_b2']];entries.forEach(e=>{let m=byM(e.id),b=byB(m.battle);rows.push([m.id,m.battle,m.court,m.wave,m.levels.join('+'),b.a,labelP(e.lineup[0]),labelP(e.lineup[1]),b.b,labelP(e.lineup[2]),labelP(e.lineup[3])])});let q=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='DOAE-lineups.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function startCeremony(entries,mode){clearTimeout(cerTimer);cerItems=entries.slice();cerIndex=0;cerSpeed=1;cerMode=mode;$('ceremony').hidden=false;cerFrame()}function cerFrame(){clearTimeout(cerTimer);let e=cerItems[cerIndex];if(!e){$('ceremonyInner').innerHTML=`<h1>DRAW COMPLETE</h1><div class="metric">${cerItems.length} MATCHES</div><p>ผลการสุ่มเสร็จแล้ว · ยังไม่เปลี่ยนผลจนกดประกาศ</p>${btn('กลับไปตรวจสอบ','endCeremony()','gold')}`;return}let m=byM(e.id),b=byB(m.battle),side=(t,i)=>`<div class="vs-side ${i?'right':''}" style="--tc:${esc(tObj(t).color)}"><h2>${esc(tObj(t).name)}</h2>${[0,1].map(j=>{let p=player(data,e.lineup[i+j]);return `<p>${esc(labelP(e.lineup[i+j]))}<small style="display:block">${esc(p?org(p.org):m.levels[j])}</small></p>`}).join('')}</div>`;$('ceremonyInner').innerHTML=`<div><div class="caption">DOAE BADMINTON OPEN #2 · ${esc(cerMode)}</div><h1>MATCH-UP DRAW</h1><div class="caption">BATTLE ${b.id} · MATCH ${m.id} · ${esc(m.levels.map(levelText94).join(' + '))} · COURT ${m.court} · WAVE ${m.wave}</div></div><div class="vs-stage">${side(b.a,0)}<div class="vs-logo">VS</div>${side(b.b,2)}</div><div class="row"><span>${cerIndex+1} / ${cerItems.length} MATCHES</span><div class="spacer"></div><span>${Math.round((cerIndex+1)/cerItems.length*100)}%</span></div><div class="progress"><span style="width:${(cerIndex+1)/cerItems.length*100}%"></span></div><div class="actions" style="justify-content:center">${btn(cerSpeed===1?'2× เร่งความเร็ว':'1× ความเร็วปกติ','speedCer()')}${btn('ข้ามเอฟเฟกต์','skipCer()')}${btn('ปิด','endCeremony()')}</div>`;cerTimer=setTimeout(()=>{cerIndex++;cerFrame()},1350/cerSpeed)}function speedCer(){cerSpeed=cerSpeed===1?2:1;cerFrame()}function skipCer(){cerIndex=cerItems.length;cerFrame()}function endCeremony(){clearTimeout(cerTimer);$('ceremony').hidden=true}

function myResults94(){if(!activeFilterCount94()&&!showAllFixtures95)return `<div class="allFixtures95"><span>เลือกทีมด้านบน หรือเปิดตารางการแข่งขันทั้งหมด</span>${btn('ดูตารางทั้งหมด ›',"showAllFixtures95=true;refreshMatches94()",'primary')}</div>`;let all=filtered94().slice().sort((a,b)=>a.battle-b.battle||a.wave-b.wave||a.court-b.court||a.id-b.id),size=filter94.team==='all'&&filter94.level==='all'&&!filter94.search.trim()?3:6,pages=Math.max(1,Math.ceil(all.length/size));matchPage94=Math.min(matchPage94,pages-1);let ms=all.slice(matchPage94*size,matchPage94*size+size);return `<div class="matchResultsMeta"><strong>${all.length} แมตช์</strong><span>หน้า ${matchPage94+1}/${pages} · เรียงตาม Battle / Wave / Court</span>${showAllFixtures95&&!activeFilterCount94()?btn('พับตาราง','showAllFixtures95=false;refreshMatches94()','small'):''}</div>${ms.length?`<div class="matchgrid">${ms.map(m=>`<div class="fixtureCard"><div class="fixtureTime">${m.battle===7?'FINAL':'BATTLE '+String(m.battle).padStart(2,'0')} <span>${esc(byB(m.battle).time)}${byB(m.battle).time.includes(':')||byB(m.battle).time.includes('.')?' น.':''}</span></div>${matchCard(m)}</div>`).join('')}</div><div class="actions matchPagination">${btn('‹ ก่อนหน้า','turnPage94(-1)','small',matchPage94===0)}${btn('ถัดไป ›','turnPage94(1)','small',matchPage94>=pages-1)}</div>`:`<div class="fixtureEmpty">${sportIcon94('court')}<strong>${data.matches.some(m=>m.published)?'ไม่พบแมตช์ตามตัวกรอง':'รอประกาศ Line-up'}</strong><span>${data.matches.some(m=>m.published)?'ลองเปลี่ยนทีม กลุ่มมือ หรือล้างตัวกรอง':'ตารางคู่แข่งขันจะแสดงที่นี่เมื่อกรรมการประกาศรายชื่อ'}</span></div>`}`}

function refreshMatches94(){if($('myMatches94'))$('myMatches94').innerHTML=myResults94();if($('filterSummaryExec'))$('filterSummaryExec').innerHTML=filterSummary94();if($('filterToggleExec'))$('filterToggleExec').innerHTML=sportIcon94('filter')+' '+(filtersOpen?'ซ่อนตัวกรอง':'ตัวกรองเพิ่มเติม')+(extraFilters94()?' ('+extraFilters94()+')':'')}
function myMatch94(){return `<section class="card stack finderHero"><div class="finderHeading"><div><div class="eyebrow">MATCH CENTRE</div><h2>คู่แข่งขันของคุณ</h2><p class="muted">เลือกทีมเพื่อดูคู่แข่งขันและสนาม</p></div><button type="button" id="filterToggleExec" class="filterToggle" aria-expanded="${filtersOpen}" onclick="toggleFilters94()">${sportIcon94('filter')} ${filtersOpen?'ซ่อนตัวกรอง':'ตัวกรองเพิ่มเติม'}${extraFilters94()?' ('+extraFilters94()+')':''}</button></div><div class="quickTeams">${IDS.map(quickTeamBtn94).join('')}</div><div class="finderTools"><div class="levelTabs" aria-label="กลุ่มมือ">${[['all','ทุกมือ'],...LEVELS.map(l=>[l,levelText94(l)])].map(([v,t])=>`<button type="button" aria-pressed="${filter94.level===v}" class="${filter94.level===v?'on':''}" onclick="quickLevel94('${v}')">${t}</button>`).join('')}</div><div class="finderSearch">${sportIcon94('search')}<input id="mySearchExec" aria-label="ค้นหานักกีฬา" value="${esc(filter94.search)}" placeholder="ค้นหาชื่อ หรือ Tag ID" oninput="filter94.search=this.value;matchPage94=0;refreshMatches94()"></div><button class="resetExec" onclick="resetFilter94()">ล้างตัวกรอง</button></div><div class="advancedPanel ${filtersOpen?'open':''}"><div class="formgrid">${filterSelect94('court','สนาม',[['all','ทุกสนาม'],...['1','2','3'].map(x=>[x,'Court '+x])])}${filterSelect94('round','รอบ',[['all','ทุกรอบ'],['rr','รอบแรก'],['final','Final']])}${filterSelect94('battle','Battle',[['all','ทั้งหมด'],...data.battles.map(b=>[b.id,b.id===7?'Final':'Battle '+b.id+' · '+tObj(b.a).name+' / '+tObj(b.b).name])])}${filterSelect94('state','สถานะ',[['all','ทั้งหมด'],['ready','รอแข่งขัน'],['playing','กำลังแข่งขัน'],['pending','รอรับรอง'],['done','จบแล้ว'],['unpublished','ยังไม่ประกาศ']])}</div><small>กลุ่มมือรวมแมตช์ผสมที่มีมือนั้น · ชื่อและ Tag จะแสดงเมื่อประกาศ Line-up</small></div><div class="filterSummary" id="filterSummaryExec">${filterSummary94()}</div><div id="myMatches94" aria-live="polite">${myResults94()}</div></section>`}
function resetFilter94(){showAllFixtures95=false;matchPage94=0;filter94={team:'all',level:'all',court:'all',round:'all',battle:'all',state:'all',search:''};filtersOpen=false;try{localStorage.setItem('doae_filters_open','0')}catch(e){}render()}
function courts94(){let ms=data.matches.slice().sort((a,b)=>a.battle-b.battle||a.wave-b.wave||a.id-b.id);return `<section class="stack"><div class="sectionHeading"><div><div class="eyebrow">COURT MONITOR</div><h2 class="sectionTitle">สถานะ 3 สนาม</h2></div></div><div class="grid3">${[1,2,3].map(c=>{let active=ms.find(m=>m.court===c&&m.started&&!m.score&&!m.awaiting&&!m.pending),next=ms.find(m=>m.court===c&&m.published&&!m.score&&!m.awaiting&&!m.pending&&!m.started);return `<div class="courtPanel"><div class="courtPanelHead"><span>COURT <b>0${c}</b></span><span class="courtStatus ${active?'running':''}">${active?'กำลังแข่งขัน':'รอแข่งขัน'}</span></div><div class="courtPanelBody">${active?matchCard(active):'<div class="courtIdle">ยังไม่มีแมตช์ที่เริ่มแข่งขัน</div>'}<div class="courtNext">NEXT MATCH</div>${next?matchCard(next):'<small>รอประกาศคู่ถัดไป</small>'}</div></div>`}).join('')}</div></section>`}
function verifyDialog94(id){let m=byM(id),b=byB(m.battle);modal(modalHead('ตรวจ Tag ID · Match '+id+' / Court '+m.court)+`<div class="note">ตรวจป้ายจริงทั้ง 4 คน กรอกสลับลำดับภายในทีมได้ แต่ห้ามสลับทีม · ${scoreLimit(m)} แต้ม × 2 เซต</div>${[0,1].map(side=>`<h3>${team(side?b.b:b.a)}</h3><div class="formgrid">${[0,1].map(j=>{let i=side*2+j;return `<div><label>${esc(labelP(m.lineup[i]))}</label><input id="tag94${i}" autocomplete="off" placeholder="Tag ID จากป้าย" oninput="checkTags94(${id})"></div>`}).join('')}</div>`).join('')}<p id="tagStatus94" class="muted">ตรวจสอบ 0/4</p><button id="start94btn" class="primary" disabled onclick="startMatch94(${id},${m.rev})">ยืนยันนักกีฬาและเริ่มการแข่งขัน</button>`)}
function enteredTags94(){return [0,1,2,3].map(i=>formVal('tag94'+i).trim().toUpperCase())}
function checkTags94(id){let m=byM(id),tags=enteredTags94(),n=0;for(let side of [0,1]){let expect=m.lineup.slice(side*2,side*2+2).map(id=>tagOf(player(data,id)));let seen=new Set();for(let j=0;j<2;j++){let i=side*2+j,v=tags[i],ok=!!v&&expect.includes(v)&&!seen.has(v);if(ok){n++;seen.add(v)}$('tag94'+i).style.borderColor=v?(ok?'#168c4c':'#dc2626'):''}}$('tagStatus94').textContent='ตรวจสอบ '+n+'/4 '+(n===4?' · ตรงกับ Line-up':' · กรุณาตรวจ Tag ID');$('start94btn').disabled=n!==4}

function cancelStart94(id){let r=reason('ยกเลิกการเริ่ม Match '+id);if(r)act('cancelStart',{id,matchRev:byM(id).rev,reason:r})}
function bestPage94(){let a=bestPairs(data,bestLevel94),complete=data.battles.slice(0,6).every(b=>b.confirmed),leaders=a.filter(r=>r.rank===1),ties=[...new Set(a.map(r=>r.tie).filter(Boolean))];return `<div class="stack"><div class="hero"><small>ROUND ROBIN AWARDS</small><h1>BEST PAIR</h1><p>BB · BG · NS / คู่เดิมอย่างน้อย 3 แมตช์</p></div><div class="actions">${LEVELS.map(l=>btn(levelText94(l),`bestLevel94='${l}';render()`,bestLevel94===l?'primary':'' )).join('')}${btn('ดาวน์โหลด CSV','exportBest94()')}${btn('พิมพ์อันดับ','printBest94()')}</div><div class="note">${complete?'รอบแรกได้รับการรับรองครบแล้ว':'อันดับชั่วคราว · รอจบรอบแรก'} · นับเฉพาะคู่มือเดียวกันจากผลคะแนนที่บันทึก/รับรองแล้ว ไม่รวม Final</div>${leaders.length?`<div class="card stack"><h2>${complete&&leaders.length===1&&!leaders[0].tie?'🏆 BEST PAIR '+levelText94(bestLevel94):'ผู้นำ '+levelText94(bestLevel94)+(leaders.length>1?' (อันดับร่วม)':'')}</h2>${leaders.map(r=>`<div>${team(r.team)} · ${r.ids.map(id=>esc(labelP(id))).join(' / ')} · ${r.w}–${r.l} เซต</div>`).join('')}</div>`:'<div class="card">ยังไม่มีคู่ที่ลงแข่งขันครบ 3 แมตช์</div>'}<div class="card tablewrap">${bestTable94(a)}</div>${isAdmin()&&complete?ties.map(k=>`<div class="card stack"><h3>อันดับเสมอ · รอกรรมการตัดสิน</h3>${a.filter(r=>r.tie===k).map(r=>`<p>${r.ids.map(id=>esc(labelP(id))).join(' / ')}</p>`).join('')}${btn('กำหนดลำดับ',`bestTieDialog94(${ties.indexOf(k)})`,'gold')}</div>`).join(''):''}</div>`}
function bestTable94(a){return `<table><thead><tr><th>อันดับ</th><th>ทีม / คู่</th><th>แมตช์</th><th>เซต W–L</th><th>% ชนะเซต</th><th>เซต +/- เฉลี่ย</th><th>แต้ม +/- เฉลี่ย</th><th>สถานะ</th></tr></thead><tbody>${a.map(r=>`<tr><td>${r.rank||'–'}${r.tie?' ร่วม':''}</td><td>${esc(tObj(r.team).name)}<small>${r.ids.map(id=>esc(labelP(id))).join('<br>')}</small></td><td>${r.n}</td><td>${r.w}–${r.l}</td><td>${(100*r.w/(2*r.n)).toFixed(1)}%</td><td>${((r.w-r.l)/r.n).toFixed(2)}</td><td>${((r.rf-r.ra)/r.n).toFixed(2)}</td><td>${r.n>=3?(r.tie?'เสมอ':'ผ่านเกณฑ์'):'ยังไม่ครบ 3'}</td></tr>`).join('')}</tbody></table>`}
function bestTieDialog94(i){let a=bestPairs(data,bestLevel94),ties=[...new Set(a.map(r=>r.tie).filter(Boolean))],k=ties[i],g=a.filter(r=>r.tie===k);if(!g.length)return;modal(modalHead('ตัดสินอันดับคู่เสมอ')+g.map((r,j)=>`<label>ลำดับที่ ${j+1}</label><select id="bestOrder94${j}">${g.map(x=>opt(x.key,x.ids.map(id=>labelP(id)).join(' / '),r.key)).join('')}</select>`).join('')+`<label>เหตุผล</label><input id="bestReason94">${btn('รับรองลำดับ',`saveBestTie94(${i})`,'primary')}`)}
function saveBestTie94(i){let a=bestPairs(data,bestLevel94),k=[...new Set(a.map(r=>r.tie).filter(Boolean))][i],g=a.filter(r=>r.tie===k),order=g.map((r,j)=>formVal('bestOrder94'+j));if(new Set(order).size!==g.length){toast('ห้ามเลือกคู่ซ้ำ');return}act('bestTie',{level:bestLevel94,key:k,order,reason:formVal('bestReason94')})}
function exportBest94(){downloadCsv([['category','rank','team','tag1','tag2','matches','sets_won','sets_lost','rally_for','rally_against','eligible','tie'],...LEVELS.flatMap(l=>bestPairs(data,l).map(r=>[levelText94(l),r.rank,r.team,...r.ids.map(id=>tagOf(player(data,id))),r.n,r.w,r.l,r.rf,r.ra,r.n>=3,!!r.tie]))],'DOAE-best-pair.csv')}
function printWindow94(title,body){let w=window.open('','_blank');if(!w){toast('อนุญาตหน้าต่าง Pop-up เพื่อพิมพ์');return}w.document.open();w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#101f3c}h1{font-size:23px}h2{font-size:18px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #8996a8;text-align:left}small{display:block} .taggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}.tag{border:1px solid #8896a9;border-top:12px solid var(--tc);padding:9mm 5mm;min-height:77mm;break-inside:avoid;text-align:center}.tag strong{font-size:27px;display:block;margin:6mm 0}.sheet{break-after:page;min-height:240mm}.sheet:last-child{break-after:auto}.scorecell{height:28mm}.no-print{margin-bottom:10px}@media print{.no-print{display:none}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><button class="no-print" onclick="window.print()">พิมพ์ / บันทึก PDF</button>${body}</body></html>`);w.document.close()}
function printPage94(){let ms=printMatches94(),ps=data.players.filter(p=>p.active&&(printTeam94==='all'||p.team===printTeam94));return `<div class="stack"><h1>Print Center</h1><div class="card stack"><h2>Player Tag · ${ps.length} คน</h2><select onchange="printTeam94=this.value;render()">${opt('all','ทุกทีม',printTeam94)}${IDS.map(t=>opt(t,tObj(t).name,printTeam94)).join('')}</select><div class="actions">${btn('พิมพ์ Player Tag','printTags94()','primary')}${btn('ทะเบียน Tag CSV','exportRoster()')}${btn('พิมพ์ทะเบียน','printRoster94()')}</div></div><div class="card stack"><h2>Official Score Sheet · ${ms.length} แมตช์</h2><div class="formgrid"><div><label>Battle</label><select onchange="printBattle94=this.value;render()">${opt('all','ทั้งหมด',printBattle94)}${data.battles.map(b=>opt(b.id,b.id===7?'Final':'Battle '+b.id,printBattle94)).join('')}</select></div><div><label>Court</label><select onchange="printCourt94=this.value;render()">${opt('all','ทุกสนาม',printCourt94)}${[1,2,3].map(c=>opt(c,'Court '+c,printCourt94)).join('')}</select></div></div>${btn('พิมพ์ Score Sheets ตามตัวกรอง','printSheets94()','primary',!ms.length)}<div class="note">พิมพ์เฉพาะแมตช์ที่ประกาศ Line-up แล้ว · 1 แมตช์ต่อ A4</div></div><div class="card actions">${btn('พิมพ์อันดับทีม','printRanking94()')}${btn('พิมพ์ Best Pair','printBest94()')}${btn('ดาวน์โหลด Best Pair CSV','exportBest94()')}</div></div>`}
