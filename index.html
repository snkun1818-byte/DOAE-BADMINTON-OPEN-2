function drawParse(){let text=document.getElementById('draw-input').value;let lines=text.split(/\r?\n/).filter(x=>x.trim());if(/^(pair_id|รหัสคู่)\t/i.test(lines[0]||''))lines.shift();return lines.map((line,i)=>{let r=line.split('\t');if(r.length<5||r.length>6)throw Error('แถว '+(i+1)+' ต้องมี 5–6 คอลัมน์ คั่นด้วย Tab');return {id:r[0],level:r[1],org:r[2],a:r[3],b:r[4],lock:r[5]||''}})}
async function drawRequest(action,p={}){if(!canAdmin()||!token||busy||fetching||!drawData){toast('ยังไม่พร้อมหรือระบบกำลังทำงาน');return}busy=true;try{let d=await requestRemote({action,token,drawRevision:drawData.revision,...p});if(action==='lineupGenerate'){lineDraft=d.preview;render();toast('สร้าง Line-up ตัวอย่างแล้ว ยังไม่ยืนยัน');return}applyRemote(d);drawDraft=null;pairDraft=null;pairSettings=null;pairEdit=-1;lineDraft=null;render();toast(d.warning||'บันทึกข้อมูลสำเร็จ')}catch(e){toast(e.message);alert(e.message)}finally{busy=false}}
function drawSave(){try{let pairs=drawParse(),settings={strict:document.getElementById('draw-strict').checked,balance:document.getElementById('draw-balance').checked};if(confirm('บันทึกรายชื่อและเงื่อนไขใหม่? ผลสุ่มฉบับร่างเดิมจะถูกล้าง'))drawRequest('drawSave',{pairs,settings})}catch(e){toast(e.message)}}
function drawRun(){if(confirm('สุ่มจัดทีมตามรายชื่อและเงื่อนไขที่บันทึกไว้?'))drawRequest('drawRun')}
function drawPublish(){if(confirm('ยืนยันและประกาศรายชื่อทั้ง 4 ทีมให้ผู้ชม? ข้อมูลชื่อและหน่วยงานใน PLAYERS จะถูกแทนที่ด้วยผลที่ยืนยัน'))drawRequest('drawPublish',{sourceStamp:drawData.source?.stamp})}
function drawUnlock(){let reason=prompt('ระบุเหตุผลปลดล็อกผลการจัดทีม');if(reason?.trim()&&confirm('ถอนประกาศรายชื่อและล้าง Line-up ทั้งหมด?'))drawRequest('drawUnlock',{reason})}
function drawSwap(){drawRequest('drawSwap',{x:document.getElementById('swap-x').value,y:document.getElementById('swap-y').value})}
function drawTabGo(tab){drawTab=tab;lineDraft=null;render()}
function drawCSV(){let rows=[['team','pair_id','level','organization','player_1','player_2'],...drawData.pairs.filter(p=>drawData.assignment[p.id]).map(p=>[drawData.assignment[p.id],p.id,p.level,p.org,p.a,p.b])];let text=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='DOAE-Team-Draw.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function drawPairOptions(){return drawData.pairs.filter(p=>drawData.assignment[p.id]).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.level)} · TEAM ${esc(drawData.assignment[p.id])} · ${esc(p.a)} / ${esc(p.b)}</option>`).join('')}
function drawBoard(){return `<div class="team-grid" style="margin-top:16px">${teamIds.map(t=>{let pairs=drawData.pairs.filter(p=>drawData.assignment[p.id]===t),orgs=new Set(pairs.map(p=>p.org)).size;return `<section class="teamcard"><div class="teamcard-head" style="background:${T[t].color};color:${T[t].ink}"><div><h2>TEAM ${t}</h2><p>${pairs.length*2} / 18 คน · ${orgs} หน่วยงาน</p></div></div><div class="teamcard-body">${drawLevels.map(l=>`<h3 style="margin:9px 0">${l} · ${pairs.filter(p=>p.level===l).length}/3 คู่</h3>${pairs.filter(p=>p.level===l).map(p=>`<div class="draw-person"><div><b>${esc(p.a)} / ${esc(p.b)}</b><div class="small muted">${esc(p.id)} · ${esc(orgLabel(p.org))}${p.lock?' · ล็อกทีม':''}</div></div></div>`).join('')||'<p class="muted small">รอสุ่ม</p>'}`).join('')}</div></section>`}).join('')}</div>`}
function drawLineTypes(b){return b===7?['BABY + BABY','BG + BG','NS + NS','BABY + BG',state.finalPair]:['BABY + BABY','BABY + BABY','BG + BG','BG + BG','NS + NS','NS + NS','BABY + BG','BABY + NS','BG + NS']}
function drawSelectBattle(v){drawB=Number(v);drawT=battleInfo(drawB)[0];lineDraft=null;render()}
function drawSelectTeam(v){drawT=v;lineDraft=null;render()}
function drawLineEdit(i,j,v){let a=lineDraft||drawData.lineups[drawB+'-'+drawT]?.list;lineDraft=drawLineTypes(drawB).map((_,n)=>[...(a?.[n]||['',''])]);lineDraft[i][j]=v}
function drawLineSave(){let types=drawLineTypes(drawB),list=types.map((_,i)=>[document.getElementById('line-'+i+'-0').value,document.getElementById('line-'+i+'-1').value]);if(confirm('ยืนยัน Line-up ของ TEAM '+drawT+'?'))drawRequest('lineupSave',{b:drawB,team:drawT,list})}
function drawLinePage(){if(!drawData.published)return '<section class="panel">ต้องประกาศทีมก่อนจัด Line-up</section>';let b=drawB,ts=battleInfo(b).slice(0,2);if(!ts.includes(drawT))drawT=ts[0];let types=drawLineTypes(b),roster=drawRoster(drawT),saved=drawData.lineups[b+'-'+drawT],list=lineDraft||saved?.list||[],locked=Object.keys(state.scores).concat(Object.keys(state.pending)).some(k=>k.startsWith(b+'-'))||state.confirmed[b]||(b===7&&(!state.finalTeams||!state.finalPairConfirmed||state.finalConfirmed));return `<section class="panel"><h2>จัดคู่ลงสนาม · Line-up Generator</h2><p class="muted">รอบพบกันหมด 9 คู่ / 18 คน · Final 5 คู่ / 10 คน · นักกีฬาไม่ซ้ำใน Battle เดียวกัน</p><div class="control-filter"><div class="field"><label>Battle</label><select onchange="drawSelectBattle(this.value)">${[1,2,3,4,5,6,7].map(x=>`<option value="${x}" ${b===x?'selected':''}>${x===7?'FINAL':'Battle '+x} · ${esc(battleInfo(x).slice(0,2).join(' vs '))}</option>`).join('')}</select></div><div class="field"><label>ทีม</label><select onchange="drawSelectTeam(this.value)">${ts.map(t=>`<option value="${esc(t)}" ${drawT===t?'selected':''}>TEAM ${esc(t)}</option>`).join('')}</select></div></div><p class="notice ${locked?'':'info'}">${locked?'Battle ถูกล็อก หรือยังไม่ได้ยืนยันเงื่อนไข Final':saved&&!lineDraft?'มี Line-up ที่ยืนยันแล้ว':'เลือกผู้เล่นเอง หรือสุ่มตัวอย่างก่อนยืนยัน'}</p><div class="actions"><button class="btn gold" ${locked?'disabled':''} onclick="drawRequest('lineupGenerate',{b:drawB,team:drawT})">สุ่ม Line-up</button></div>${types.map((k,i)=>`<div class="draw-line"><div><b>Match ${i+1} · ${esc(k)}</b><div class="small muted">Wave ${Math.ceil((i+1)/3)} · Court ${i%3+1}</div></div>${k.split(' + ').map((l,j)=>`<div class="field"><label>ผู้เล่น ${j+1} · ${l}</label><select id="line-${i}-${j}" ${locked?'disabled':''} onchange="drawLineEdit(${i},${j},this.value)"><option value="">เลือกผู้เล่น</option>${roster.filter(p=>p.level===l).map(p=>`<option value="${esc(p.id)}" ${list[i]?.[j]===p.id?'selected':''}>${esc(p.name)} · ${esc(orgLabel(p.org))}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}<button class="btn primary" ${locked?'disabled':''} onclick="drawLineSave()">ยืนยัน Line-up</button></section>`}
function pairInit(){if(!pairDraft){pairDraft=JSON.parse(JSON.stringify(drawData.published?drawData.pairs:drawData.source.pairs));let used=new Set(pairDraft.map(p=>p.id));for(let p of pairDraft)if(!p.id){p.id=pairNextId(used);used.add(p.id)}}if(!pairSettings)pairSettings={...drawData.settings}}
function pairNextId(used=new Set(pairDraft.map(p=>p.id))){let i=1;while(used.has('P-'+String(i).padStart(3,'0')))i++;return 'P-'+String(i).padStart(3,'0')}
function pairCounts(){return Object.fromEntries(drawLevels.map(l=>[l,pairDraft.filter(p=>p.level===l).length]))}
function pairDirty(){return JSON.stringify(pairDraft)!==JSON.stringify(drawData.pairs)||JSON.stringify(pairSettings)!==JSON.stringify(drawData.settings)||JSON.stringify(drawData.source.pairs)!==JSON.stringify(drawData.pairs)}
function pairAdd(){let org=document.getElementById('pair-org').value,l=document.getElementById('pair-level').value,a=document.getElementById('pair-a').value.trim(),b=document.getElementById('pair-b').value.trim(),lock=document.getElementById('pair-lock').value;if(!org||!a||!b){alert('เลือกหน่วยงานและกรอกชื่อผู้เล่นทั้งสองคน');return}if(pairDraft.length>=36||pairDraft.filter(p=>p.level===l).length>=12){alert('ระดับมือนี้ครบ 12 คู่ หรือรายการครบ 36 คู่แล้ว');return}let names=new Set(pairDraft.flatMap(p=>[p.a,p.b]).map(n=>n.trim().toLowerCase().replace(/\s+/g,' ')));let norm=n=>n.toLowerCase().replace(/\s+/g,' ');if(norm(a)===norm(b)||names.has(norm(a))||names.has(norm(b))){alert('พบชื่อนักกีฬาซ้ำ');return}pairDraft.push({id:pairNextId(),level:l,org,a,b,lock});pairEdit=-1;render();}
function pairRemove(i){if(confirm('นำคู่นี้ออกจากรายการ? ยังไม่เปลี่ยนข้อมูลใน Google Sheets จนกว่าจะบันทึก')){pairDraft.splice(i,1);pairEdit=-1;render()}}
function pairEditAt(i){pairEdit=i;render()}
function pairUpdate(i){let p=pairDraft[i];let a=document.getElementById('edit-a').value.trim(),b=document.getElementById('edit-b').value.trim(),org=document.getElementById('edit-org').value,level=document.getElementById('edit-level').value,lock=document.getElementById('edit-lock').value;if(!a||!b||!org){alert('กรอกข้อมูลให้ครบ');return}if(pairDraft.filter((x,j)=>j!==i&&x.level===level).length>=12){alert('ระดับมือนี้เต็มแล้ว');return}Object.assign(p,{a,b,org,level,lock});pairEdit=-1;render()}
function pairOptions(kind,value){let o=kind==='org'?[{id:'',name:'เลือกหน่วยงาน'},...drawData.source.orgs]:kind==='level'?drawLevels.map(l=>({id:l,name:l})):[{id:'',name:'ไม่ล็อกทีม'},...teamIds.map(t=>({id:t,name:'TEAM '+t}))];if(value&&!o.some(x=>x.id===value))o.push({id:value,name:value+' (ตรวจสอบข้อมูล)'});return o.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}
function pairFields(prefix,p={}){return `<div class="pair-form"><div class="field"><label>หน่วยงาน / ทีมต้นสังกัด</label><select id="${prefix}-org">${pairOptions('org',p.org||'')}</select></div><div class="field"><label>ระดับมือ</label><select id="${prefix}-level">${pairOptions('level',p.level||'BABY')}</select></div><div class="field"><label>ผู้เล่น 1</label><input id="${prefix}-a" maxlength="80" value="${esc(p.a||'')}" placeholder="ชื่อผู้เล่นคนที่ 1"></div><div class="field"><label>ผู้เล่น 2</label><input id="${prefix}-b" maxlength="80" value="${esc(p.b||'')}" placeholder="ชื่อผู้เล่นคนที่ 2"></div><div class="field"><label>ล็อกทีม (ไม่บังคับ)</label><select id="${prefix}-lock">${pairOptions('lock',p.lock||'')}</select></div></div>`}
function pairOrg(o){return drawData.source.orgs.find(x=>x.id===o)?.name||o}
function pairCommit(run){if(pairEdit>=0){alert('กรุณาบันทึกหรือยกเลิกการแก้ไขคู่ก่อน');return}if(['pair-a','pair-b'].some(id=>document.getElementById(id)?.value.trim())){alert('มีชื่อที่ยังไม่ได้เพิ่ม กรุณากดเพิ่มคู่ก่อน');return}let msg=run?'สุ่มและบันทึกรายชื่อ '+pairDraft.length+' คู่ตามเงื่อนไขที่เลือก? ผลเดิมที่ยังไม่ประกาศจะถูกแทนที่':'บันทึกรายชื่อ '+pairDraft.length+' คู่ลง PAIRS? ผลสุ่มฉบับร่างเดิมจะถูกล้าง';if(confirm(msg))drawRequest(run?'drawQuick':'drawSave',{pairs:pairDraft,settings:pairSettings,sourceStamp:drawData.source.stamp})}
function pairChangeSetting(key,el){if(pairEdit>=0||['pair-a','pair-b'].some(id=>document.getElementById(id)?.value.trim())){el.checked=pairSettings[key];alert('กรุณาเพิ่มคู่หรือบันทึกการแก้ไขก่อน');return}pairSettings[key]=el.checked;render()}
async function pairRefresh(){if(busy||fetching||!token)return;if(!confirm('ดึงรายชื่อจาก Google Sheets ใหม่? รายการที่ยังไม่บันทึกจะถูกแทนที่'))return;fetching=true;try{let d=await requestRemote({action:'snapshot',token});applyRemote(d);pairDraft=null;pairSettings=null;pairEdit=-1;render();toast('ดึงรายชื่อจาก Google Sheets แล้ว')}catch(e){toast(e.message);alert(e.message)}finally{fetching=false}}
function pairEditor(locked){let counts=pairCounts();return `<section class="panel"><div class="statusline"><div><h2>1. รายชื่อคู่แข่งขัน</h2><p class="muted small">ดึงรายชื่อจาก PAIRS และเลือกหน่วยงานจาก ORGANIZATIONS โดยตรง</p></div><button class="btn" onclick="pairRefresh()">ดึงจาก Google Sheets</button></div><div class="pair-counts">${drawLevels.map(l=>`<div class="control-metric"><span class="num">${counts[l]}/12</span><span>${l}</span></div>`).join('')}</div>${locked?'':`<div class="pair-entry"><h3>เพิ่มคู่แข่งขัน</h3>${pairFields('pair')}<button class="btn primary" onclick="pairAdd()" ${pairDraft.length>=36?'disabled':''}>+ เพิ่มคู่</button></div>`}<div class="pair-list">${pairDraft.length?pairDraft.map((p,i)=>pairEdit===i&&!locked?`<div class="pair-entry">${pairFields('edit',p)}<div class="actions"><button class="btn primary" onclick="pairUpdate(${i})">ตกลง</button><button class="btn" onclick="pairEditAt(-1)">ยกเลิก</button></div></div>`:`<div class="pair-item"><div><b>${esc(p.a||'ยังไม่มีชื่อ')} / ${esc(p.b||'ยังไม่มีชื่อ')}</b><div class="small muted">${esc(p.level)} · ${esc(pairOrg(p.org))}${p.lock?' · ล็อก TEAM '+esc(p.lock):''}</div></div>${locked?'':`<div class="actions"><button class="btn" onclick="pairEditAt(${i})">แก้ไข</button><button class="btn danger" onclick="pairRemove(${i})">ลบ</button></div>`}</div>`).join(''):'<p class="muted">ยังไม่มีรายชื่อคู่ใน PAIRS เพิ่มคู่ได้ทันที หรือกรอกในชีตแล้วกดดึงข้อมูล</p>'}</div><p class="small muted">${pairDraft.length}/36 คู่ · บันทึกทยอยได้ ไม่ต้องรอครบ</p><h3 style="margin-top:14px">2. เงื่อนไขการสุ่ม</h3><p>4 ทีม · ระดับมือละ 3 คู่ · รักษาคู่เดิมและทีมล็อก</p><label class="draw-check"><input type="checkbox" ${pairSettings.strict?'checked':''} ${locked?'disabled':''} onchange="pairChangeSetting('strict',this)"> หน่วยงานเดียวกันอยู่ทีมเดียวกันไม่เกิน 1 คู่</label><label class="draw-check"><input type="checkbox" ${pairSettings.balance?'checked':''} ${locked?'disabled':''} onchange="pairChangeSetting('balance',this)"> กระจายหน่วยงานให้สมดุลเมื่อปิดเงื่อนไขบังคับ</label><button class="btn" ${locked?'disabled':''} onclick="pairCommit(false)">บันทึกรายชื่อ / เงื่อนไข</button></section>`}
function drawPage(){let h=heading('สุ่มจัดทีมและจัดคู่แข่งขัน','TEAM DRAW · DOAE BADMINTON OPEN #2');if(!drawData||!drawData.pairs||!drawData.source)return h+'<section class="panel"><p>กรุณาอัปเดต Apps Script V7.1 และ Deploy เวอร์ชันใหม่ของ Deployment เดิม</p></section>';let locked=drawStarted()||drawData.published,assigned=Object.keys(drawData.assignment).length;pairInit();let dirty=!drawData.published&&pairDirty(),counts=pairCounts(),ready=pairDraft.length===36&&drawLevels.every(l=>counts[l]===12)&&pairDraft.every(p=>p.a.trim()&&p.b.trim()&&p.org&&p.id);return h+`<div class="control-hero"><div><div class="eyebrow">OFFICIAL TEAM DRAW</div><h1>36 คู่ · 4 ทีม · 3 ระดับมือ</h1><p>รักษาคู่เดิม · ระดับมือละ 3 คู่ต่อทีม</p></div><span class="pill ${drawData.published?'ok':'wait'}">${drawData.published?'ประกาศแล้ว':'ฉบับร่าง'}</span></div><div class="actions" style="margin:16px 0"><button class="btn ${drawTab==='draw'?'primary':''}" onclick="drawTabGo('draw')">สุ่มจัดทีม</button><button class="btn ${drawTab==='line'?'primary':''}" onclick="drawTabGo('line')">Line-up</button><button class="btn" onclick="refreshRemote(true)">อัปเดตข้อมูล</button></div>`+(drawTab==='line'?drawLinePage():`<div class="control-columns">${pairEditor(locked)}<section class="panel"><h2>3. สุ่มและตรวจสอบ</h2><p class="notice ${locked?'':'info'}">${drawStarted()?'มีผลการแข่งขันแล้ว — ระบบล็อกการจัดทีม':drawData.published?'ประกาศรายชื่อแล้ว':'ผลสุ่มไม่เผยแพร่จนกว่าจะกดยืนยัน'}</p><div class="control-metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="control-metric"><span class="num">${pairDraft.length}</span><span>คู่ในรายการ</span></div><div class="control-metric"><span class="num">${assigned}</span><span>คู่ที่จัดทีมแล้ว</span></div></div><div class="actions"><button class="btn gold" ${locked||!ready?'disabled':''} onclick="pairCommit(true)">สุ่มจัดทีม / สุ่มใหม่</button><button class="btn" ${dirty||assigned!==36?'disabled':''} onclick="drawCSV()">ดาวน์โหลด CSV</button></div>${dirty?'<p class="notice info">รายชื่อหรือเงื่อนไขเปลี่ยนแล้ว กรุณาสุ่มใหม่ก่อนประกาศ</p>':''}<h3 style="margin-top:14px">สลับคู่ระดับมือเดียวกัน</h3><div class="field"><label>คู่แรก</label><select id="swap-x">${drawPairOptions()}</select></div><div class="field"><label>คู่ที่สอง</label><select id="swap-y">${drawPairOptions()}</select></div><button class="btn" ${locked||dirty||assigned!==36?'disabled':''} onclick="drawSwap()">สลับคู่</button><div class="actions" style="margin-top:18px"><button class="btn primary" ${locked||dirty||assigned!==36?'disabled':''} onclick="drawPublish()">ยืนยันและประกาศทีม</button>${isSuper()&&drawData.published&&!drawStarted()?'<button class="btn danger" onclick="drawUnlock()">ปลดล็อกผลสุ่ม</button>':''}</div><p class="small muted">เมื่อเริ่มมีคะแนน ระบบจะไม่อนุญาตให้เปลี่ยนการจัดทีม</p></section></div>${dirty?'<p class="notice info">ผลสุ่มเดิมจะไม่แสดงจนกว่าจะสุ่มด้วยข้อมูลล่าสุด</p>':drawBoard()}`)}


// No automatic refresh while an officer is entering data. Revision checks protect stale actions.
render();refreshRemote();setInterval(()=>{if(!document.hidden)refreshRemote()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRemote()});

</script></body></html>
