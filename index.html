function accept(x){if(x.data?.version!==9)throw Error('ต้องใช้ Apps Script V9 กับฐานใหม่');data=x.data;user=x.user||null;liveInfo=x.live||null;accounts=x.users||[];audit=x.audit||[];connected=true;lastSync=new Date().toLocaleTimeString('th-TH');if(x.warning)toast(x.warning)}function status(){let el=$('connection');let pending=liveInfo?.enabled&&liveInfo.publishedRevision<liveInfo.revision;el.textContent=isAdmin()?(connected?'เชื่อมต่อแล้ว · '+lastSync+liveHealthText():'เชื่อมต่อไม่ได้'):connected?'':data?'ข้อมูลล่าสุด '+(lastSync||'—'):'●';el.title=isAdmin()?(liveInfo?.error||'สถานะฐานข้อมูลและ Live'):(publicAt?'รับข้อมูลล่าสุด '+new Date(publicAt).toLocaleString('th-TH'):'กำลังเชื่อมต่อ');el.className='status '+(!connected||pending?'bad':'');$('refreshIcon').className='spin '+(busy||liveLoading||publicFallback.inflight?'spinning':'');$('loginBtn').textContent=user?user.name+' ▾':'เจ้าหน้าที่';$('eventDate').textContent=data?data.date+' · '+data.venue:'V9.3 · Live Tournament'}
async function refresh(manual=false){if(!token)return publicRefresh(manual);if(busy||!endpoint)return;if(manual&&!$('modal').hidden){toast('ปิดหน้าต่างแก้ไขก่อนรีเฟรช');return}busy=true;status();try{let x=await request(token?{action:'snapshot',token}:null);accept(x);kickLive();if(!$('modal').hidden||!$('ceremony').hidden||(!manual&&['roster','schedule','draw','settings','accounts'].includes(page))){}else render();if(manual)toast('อัปเดตข้อมูลแล้ว')}catch(e){connected=false;if(e.message==='SESSION_EXPIRED'){token='';user=null;accounts=[];audit=[];data=null;page='home';draft=null;restorePublic();toast('หมดเวลาเข้าสู่ระบบ');render();startLive();if(!liveEnabled())publicFallback(true)}else if(manual||!data)toast(e.message)}finally{busy=false;status()}}

let rosterFilter='all';function roster(){let ps=data.players.filter(p=>rosterFilter==='all'||p.team===rosterFilter);return `<div class="stack"><div class="row"><h1>นักกีฬา / ทีม</h1><div class="spacer"></div>${btn('+ เพิ่มนักกีฬา',`editPlayer('')`,'gold')}${btn('แก้ชื่อและสีทีม','teamDialog()')}${btn('ดาวน์โหลดรายชื่อ CSV','exportRoster()')}</div><div class="note">สมาชิกเริ่มต้นตาม CSV ล่าสุด · แก้ชื่อ/ชื่อเล่น/สังกัดได้โดยตรง การย้ายทีม เปลี่ยนระดับมือ หรือยกเลิกสมาชิกจะถอน Line-up ที่เกี่ยวข้องซึ่งยังไม่มีคะแนน</div><div class="grid4">${data.teams.map(t=>`<div class="card"><h3>${team(t.id)}</h3><div class="metric">${data.players.filter(p=>p.active&&p.team===t.id).length}</div><small>${LEVELS.map(l=>l+' '+data.players.filter(p=>p.active&&p.team===t.id&&p.level===l).length).join(' · ')}</small></div>`).join('')}</div><div class="card stack"><div class="row"><h2>ทะเบียนนักกีฬา</h2><div class="spacer"></div><div style="width:160px"><select onchange="rosterFilter=this.value;render()">${opt('all','ทุกทีม',rosterFilter)}${IDS.map(t=>opt(t,tObj(t).name,rosterFilter)).join('')}</select></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อ / ชื่อเล่น</th><th>สังกัด</th><th>ทีม</th><th>ระดับ</th><th>คู่เดิม</th><th>สถานะ</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.nick)}</small></td><td>${esc(org(p.org))}</td><td>${team(p.team)}</td><td>${p.level}</td><td>${esc(p.pair)}</td><td>${badge(p.active?'เข้าร่วม':'ถอนตัว',p.active?'ok':'warn')}</td><td>${btn('แก้ไข',`editPlayer('${p.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function editPlayer(id){let p=player(data,id)||{name:'',nick:'',team:'A',level:'BABY',org:'',pair:'',active:true};modal(modalHead(id?'แก้ไขนักกีฬา':'เพิ่มนักกีฬา')+`<div class="formgrid"><div><label>ชื่อจริง</label><input id="pn" value="${esc(p.name)}"></div><div><label>ชื่อเล่น</label><input id="pk" value="${esc(p.nick)}"></div><div><label>หน่วยงาน</label><select id="po">${opt('','เลือกหน่วยงาน',p.org)}${data.orgs.map(o=>opt(o.id,o.name,p.org)).join('')}</select></div><div><label>ทีม</label><select id="pt">${IDS.map(t=>opt(t,tObj(t).name,p.team)).join('')}</select></div><div><label>ระดับมือ</label><select id="pl">${options(LEVELS,p.level)}</select></div><div><label>รหัสคู่เดิม (ถ้ามี)</label><input id="pp" value="${esc(p.pair)}"></div></div><label><input type="checkbox" id="pa" ${p.active?'checked':''}> เข้าร่วมการแข่งขัน</label><div class="actions">${btn('บันทึก',`savePlayer('${id}')`,'primary')}${id?btn('ลบรายชื่อ',`removePlayer('${id}')`,'danger'):''}</div>`)}function savePlayer(id){act('savePlayer',{player:{id,name:formVal('pn'),nick:formVal('pk'),org:formVal('po'),team:formVal('pt'),level:formVal('pl'),pair:formVal('pp'),active:$('pa').checked}})}function removePlayer(id){let r=reason('ลบรายชื่อ');if(r)act('removePlayer',{player:{id},reason:r})}function teamDialog(){modal(modalHead('แก้ชื่อและสีทีม')+data.teams.map(t=>`<div class="formgrid"><div><label>ทีม ${t.id}</label><input id="tn${t.id}" value="${esc(t.name)}"></div><div><label>สี</label><input type="color" id="tc${t.id}" value="${esc(t.color)}"></div></div>`).join('')+btn('บันทึก','saveTeams()','primary'))}function saveTeams(){act('saveTeams',{teams:IDS.map(id=>({id,name:formVal('tn'+id),color:formVal('tc'+id)}))})}
function schedule(){return `<div class="stack"><div class="row"><h1>ตารางแมตช์</h1><div class="spacer"></div>${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div><div class="note">แก้ทีมใน 6 Battle พร้อมกันได้ แต่ต้องครบทุกคู่ไม่ซ้ำ · รอบชิงกำหนดจากอันดับ · เปลี่ยนเวลาได้ทุก Battle · การเปลี่ยนประเภทจะถอน Line-up ของแมตช์ที่เกี่ยวข้อง</div>${data.battles.map(b=>`<div class="card stack"><div class="row"><h2>Battle ${b.id}${b.id===7?' · FINAL':''}</h2>${b.confirmed?badge('รับรองแล้ว','ok'):''}</div><div class="grid3"><div><label>ทีม A (ฝั่งซ้าย)</label><select id="ba${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.a)}${IDS.map(t=>opt(t,tObj(t).name,b.a)).join('')}</select></div><div><label>ทีม B (ฝั่งขวา)</label><select id="bb${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.b)}${IDS.map(t=>opt(t,tObj(t).name,b.b)).join('')}</select></div><div><label>เวลา</label><input id="bt${b.id}" value="${esc(b.time)}"></div></div><div class="tablewrap"><table><thead><tr><th>Match</th><th>มือ 1</th><th>มือ 2</th><th>สนาม</th><th>Wave</th></tr></thead><tbody>${bm(data,b.id).map(m=>{let dis=locked(b)||hasScore(m)?'disabled':'';return `<tr><td>${m.id}</td><td><select id="l1${m.id}" ${dis}>${options(LEVELS,m.levels[0])}</select></td><td><select id="l2${m.id}" ${dis}>${options(LEVELS,m.levels[1])}</select></td><td><select id="c${m.id}" ${dis}>${options([1,2,3],m.court)}</select></td><td><select id="w${m.id}" ${dis}>${options([1,2,3,4,5,6,7,8,9],m.wave)}</select></td></tr>`}).join('')}</tbody></table></div></div>`).join('')}${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div>`}function saveSchedule(){act('saveSchedule',{battles:data.battles.map(b=>({id:b.id,a:formVal('ba'+b.id)||null,b:formVal('bb'+b.id)||null,time:formVal('bt'+b.id)})),matches:data.matches.map(m=>({id:m.id,levels:[formVal('l1'+m.id),formVal('l2'+m.id)],court:Number(formVal('c'+m.id)),wave:Number(formVal('w'+m.id))}))})}
let drawAvoid=true,drawKeep=true;function draw(){let sel=drawBattle,bs=sel==='all'?[1,2,3,4,5,6]:[Number(sel)],ms=bs.flatMap(b=>bm(data,b)),entries=draft&&draft.key===sel?draft.entries:null,can=bs.every(id=>{let b=byB(id);return b.a&&b.b&&!locked(b)&&!bm(data,id).some(hasScore)});return `<div class="stack"><div class="hero"><small>MATCH-UP DRAW CEREMONY</small><h1>สุ่มคู่แข่งขัน <span class="goldtext">VS</span></h1><p>ใช้สมาชิกทีมที่กำหนดไว้ · ไม่สุ่มย้ายทีม</p></div><div class="card stack"><div class="formgrid"><div><label>เลือกรอบ / Battle</label><select onchange="drawBattle=this.value;draft=null;render()">${opt('all','รอบแรกทั้งหมด 54 แมตช์',sel)}${data.battles.map(b=>opt(String(b.id),`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,sel)).join('')}</select></div><div><label>โหมด</label><select onchange="practice=this.value==='test';draft=null;render()">${opt('real','ทางการ',practice?'test':'real')}${opt('test','จำลอง (ไม่บันทึก)',practice?'test':'real')}</select></div></div><label><input type="checkbox" ${drawAvoid?'checked':''} onchange="drawAvoid=this.checked"> ลดการพบหน่วยงานเดียวกัน</label><label><input type="checkbox" ${drawKeep?'checked':''} onchange="drawKeep=this.checked"> รักษาคู่เดิมเท่าที่ทำได้</label><div class="note">สุ่มแบบค้นหาผลที่เหมาะสม ไม่รับประกันว่าความซ้ำจะเป็น 0 · นักกีฬาไม่ลงซ้ำใน Battle · ช่องที่ขาดใช้รอนักกีฬา</div><div class="actions">${btn('⟳ สุ่มคู่แข่งขัน','runDraw()','gold',!practice&&!can||bs.some(id=>!byB(id).a))}${btn('เล่นเอฟเฟกต์ซ้ำ','replayDraw()','',!entries&&!ms.some(m=>m.published))}${btn('ประกาศ Line-up','publishDraft()','primary',!entries||practice||!can)}${btn('ถอนประกาศ / รีเซ็ต','resetLineups()','danger',practice||!can)}${btn('ดาวน์โหลด CSV','exportLineups()')}</div>${entries?`<div class="${practice?'warning':'note'}">${practice?'ผลจำลอง ไม่บันทึกฐานข้อมูล':'ผลร่าง ยังไม่ประกาศ'} · ${entries.length} แมตช์ · หน่วยงานชน ${quality(data,entries.map(e=>e.lineup)).clash} · ช่องว่าง ${quality(data,entries.map(e=>e.li function runDraw(){try{let bs=drawBattle==='all'?[1,2,3,4,5,6]:[Number(drawBattle)];if(!practice)ensure(bs.every(id=>!locked(byB(id))&&!bm(data,id).some(hasScore)),'Battle ล็อกแล้ว');let entries=bs.flatMap(id=>generate(data,id,{avoid:drawAvoid,keep:drawKeep}));draft={key:drawBattle,entries,revision:data.revision};render();startCeremony(entries,practice?'PRACTICE':'OFFICIAL DRAW')}catch(e){toast(e.message)}}function replayDraw(){let bs=drawBattle==='all'?[1,2,3,4,5,6]:[Number(drawBattle)],e=draft?.entries||bs.flatMap(id=>bm(data,id).filter(m=>m.published).map(m=>({id:m.id,lineup:m.lineup})));if(e.length)startCeremony(e,practice?'PRACTICE':'REPLAY')}function publishDraft(){if(!draft||practice)return;if(draft.revision!==data.revision){toast('ข้อมูลเปลี่ยน กรุณาสุ่มใหม่');return}if(confirm('ประกาศ '+draft.entries.length+' แมตช์ให้ผู้ชม?'))act('publishLineups',{lineups:draft.entries},()=>draft=null)}function resetLineups(){let r=reason('ถอนประกาศ Line-up ที่เลือก');if(r)act('resetLineups',{battle:drawBattle==='all'?'all':Number(drawBattle),reason:r},()=>draft=null)}
function lineupDialog(id){let b=byB(id),ms=bm(data,id),entries=draft?.entries||[];modal(modalHead('แก้ Line-up · Battle '+id)+`<div class="note">เลือกนักกีฬาแต่ละตำแหน่ง หรือรอนักกีฬา · ห้ามซ้ำใน Battle · แมตช์ที่มีคะแนนแก้ไม่ได้</div>${ms.map(m=>{let ls=entries.find(x=>x.id===m.id)?.lineup||m.lineup||[null,null,null,null];return `<div style="border-bottom:1px solid #e1e7ef;padding:10px 0"><strong>Match ${m.id} · ${m.levels.join(' + ')}</strong><div class="formgrid">${[0,1,2,3].map(i=>`<div><label>${esc(tObj(i<2?b.a:b.b).name)} · ${m.levels[i%2]}</label><select id="lp${m.id}_${i}" ${hasScore(m)?'disabled':''}>${opt('','รอนักกีฬา',ls[i])}${data.players.filter(p=>p.active&&p.team===(i<2?b.a:b.b)&&p.level===m.levels[i%2]).map(p=>opt(p.id,labelP(p.id),ls[i])).join('')}</select></div>`).join('')}</div></div>`}).join('')}<div class="actions">${btn('บันทึกและประกาศ',`saveLineup(${id})`,'primary')}${btn('ยกเลิก','closeModal()')}</div>`)}function saveLineup(id){let entries=bm(data,id).filter(m=>!hasScore(m)).map(m=>({id:m.id,lineup:[0,1,2,3].map(i=>formVal('lp'+m.id+'_'+i)||null)}));try{let d=copy(data);for(let q of entries)d.matches.find(m=>m.id===q.id).lineup=q.lineup;validateLineups(d,id)}catch(e){toast(e.message);return}act('publishLineups',{lineups:entries},()=>draft=null)}
function exportLineups(){let entries=draft?.entries||data.matches.filter(m=>m.published).map(m=>({id:m.id,lineup:m.lineup}));let rows=[['match','battle','court','wave','type','team_a','player_a1','player_a2','team_b','player_b1','player_b2']];entries.forEach(e=>{let m=byM(e.id),b=byB(m.battle);rows.push([m.id,m.battle,m.court,m.wave,m.levels.join('+'),b.a,labelP(e.lineup[0]),labelP(e.lineup[1]),b.b,labelP(e.lineup[2]),labelP(e.lineup[3])])});let q=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='DOAE-lineups.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function startCeremony(entries,mode){clearTimeout(cerTimer);cerItems=entries.slice();cerIndex=0;cerSpeed=1;cerMode=mode;$('ceremony').hidden=false;cerFrame()}function cerFrame(){clearTimeout(cerTimer);let e=cerItems[cerIndex];if(!e){$('ceremonyInner').innerHTML=`<h1>DRAW COMPLETE</h1><div class="metric">${cerItems.length} MATCHES</div><p>ผลการสุ่มเสร็จแล้ว · ยังไม่เปลี่ยนผลจนกดประกาศ</p>${btn('กลับไปตรวจสอบ','endCeremony()','gold')}`;return}let m=byM(e.id),b=byB(m.battle),side=(t,i)=>`<div class="vs-side ${i?'right':''}" style="--tc:${esc(tObj(t).color)}"><h2>${esc(tObj(t).name)}</h2>${[0,1].map(j=>{let p=player(data,e.lineup[i+j]);return `<p>${esc(labelP(e.lineup[i+j]))}<small style="display:block">${esc(p?org(p.org):m.levels[j])}</small></p>`}).join('')}</div>`;$('ceremonyInner').innerHTML=`<div><div class="caption">DOAE BADMINTON OPEN #2 · ${esc(cerMode)}</div><h1>MATCH-UP DRAW</h1><div class="caption">BATTLE ${b.id} · MATCH ${m.id} · ${esc(m.levels.join(' + '))} · COURT ${m.court} · WAVE ${m.wave}</div></div><div class="vs-stage">${side(b.a,0)}<div class="vs-logo">VS</div>${side(b.b,2)}</div><div class="row"><span>${cerIndex+1} / ${cerItems.length} MATCHES</span><div class="spacer"></div><span>${Math.round((cerIndex+1)/cerItems.length*100)}%</span></div><div class="progress"><span style="width:${(cerIndex+1)/cerItems.length*100}%"></span></div><div class="actions" style="justify-content:center">${btn(cerSpeed===1?'2× เร่งความเร็ว':'1× ความเร็วปกติ','speedCer()')}${btn('ข้ามเอฟเฟกต์','skipCer()')}${btn('ปิด','endCeremony()')}</div>`;cerTimer=setTimeout(()=>{cerIndex++;cerFrame()},1350/cerSpeed)}function speedCer(){cerSpeed=cerSpeed===1?2:1;cerFrame()}function skipCer(){cerIndex=cerItems.length;cerFrame()}function endCeremony(){clearTimeout(cerTimer);$('ceremony').hidden=true}
let scoreBattle=1;function score(){let b=byB(scoreBattle),ms=bm(data,b.id).filter(m=>isAdmin()||!user.court||m.court===user.court);return `<div class="stack"><div class="row"><h1>บันทึก / รับรองคะแนน</h1><div class="spacer"></div><div style="min-width:210px"><select onchange="scoreBattle=Number(this.value);render()">${data.battles.map(b=>opt(b.id,`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,scoreBattle)).join('')}</select></div></div>${battleCard(b)}<div class="note">2 เซตต่อแมตช์ · 15 แต้ม ไม่มีดิวซ์ · Staff ส่งรอรับรอง · Admin บันทึกโดยตรงหรือรับรอง</div><div class="matchgrid">${ms.map(m=>`<div class="card stack">${matchCard(m)}${m.pending?`<div class="warning">รอรับรอง ${esc(m.pending.score.map(q=>q.join(':')).join(' / '))} · ${esc(m.pending.actor)}</div>`:''}<div class="actions">${btn(m.score?'แก้คะแนน':'บันทึกคะแนน',`scoreDialog(${m.id})`,'primary',locked(b)||!m.published||(!isAdmin()&&!!m.score))}${isAdmin()&&m.pending?btn('รับรอง',`approveScore(${m.id})`,'gold',locked(b)):''}${isAdmin()&&m.pending?btn('ปฏิเสธ',`rejectScore(${m.id})`,'danger',locked(b)):''}${isAdmin()&&hasScore(m)?btn('ล้างคะแนน',`clearScore(${m.id})`,'danger',locked(b)):''}</div></div>`).join('')}</div>${isAdmin()?`<div class="card actions">${b.confirmed?btn('เปิดแก้ไข Battle',`reopen(${b.id})`,'danger'):btn('รับรอง Battle',`confirmBattle(${b.id})`,'gold',!battleStats(data,b.id).winner)}${!b.confirmed&&battleStats(data,b.id).done===9&&!battleStats(data,b.id).winner?btn('Golden Point',`goldenDialog(${b.id})`):''}</div>`:''}</div>`}
function scoreDialog(id){let m=byM(id),b=byB(m.battle),s=m.score||m.pending?.score||[['',''],['','']];modal(modalHead('บันทึก Match '+id)+`<p>${esc(m.levels.join(' + '))} · ${esc(tObj(b.a).name)} VS ${esc(tObj(b.b).name)}</p>${m.lineup?.some(x=>!x)?'<div class="warning">มีตำแหน่งรอนักกีฬา · กรรมการต้องระบุเหตุผลการบันทึก (ไม่คิดแพ้บายเอง)</div>':''}<div class="formgrid">${[0,1].flatMap(i=>[0,1].map(j=>`<div><label>Set ${i+1} · ${esc(tObj(j?b.b:b.a).name)}</label><input id="s${i}${j}" type="number" min="0" max="15" value="${s[i][j]}"></div>`)).join('')}</div><label>เหตุผล (กรณีแก้คะแนน/ผู้เล่นไม่ครบ)</label><input id="sr">${btn(isAdmin()?'บันทึกและเผยแพร่':'ส่งรอรับรอง',`saveScore(${id},${m.rev})`,'primary')}`)}function saveScore(id,rev){let s=[0,1].map(i=>[0,1].map(j=>formVal('s'+i+j)===''?NaN:Number(formVal('s'+i+j))));if(!validScore(s)){toast('แต่ละเซตต้องมีผู้ชนะ 15 และผู้แพ้ 0–14');return}act(isAdmin()?'score':'submit',{id,matchRev:rev,score:s,reason:formVal('sr')})}function approveScore(id){let m=byM(id);if(confirm('รับรองคะแนน Match '+id+'?'))act('approve',{id,matchRev:m.rev})}function rejectScore(id){let r=reason('ปฏิเสธคะแนน');if(r)act('reject',{id,matchRev:byM(id).rev,reason:r})}function clearScore(id){let r=reason('ล้างคะแนน Match '+id);if(r)act('clearScore',{id,matchRev:byM(id).rev,reason:r})}
function settings(){return `<div class="stack"><h1>ตั้งค่าการแข่งขัน</h1><div class="card stack"><h2>ข้อมูลรายการ</h2>${btn('สำรองข้อมูลรายการ JSON (ไม่รวมบัญชี)','exportBackup()')}<label>ชื่อรายการ</label><input id="ev" value="${esc(data.event)}"><label>วันที่</label><input id="dt" value="${esc(data.date)}"><label>สถานที่</label><input id="ve" value="${esc(data.venue)}">${btn('บันทึก',`act('saveSettings',{event:formVal('ev'),date:formVal('dt'),venue:formVal('ve')})`,'primary')}</div><div class="card stack"><div class="row"><h2>หน่วยงาน</h2><div class="spacer"></div>${btn('+ เพิ่ม','addOrg()')}</div><div id="orgRows">${data.orgs.map(o=>`<div class="row orgrow" style="margin:6px 0"><div style="width:100px"><input class="oid" value="${esc(o.id)}" readonly></div><div class="spacer"><input class="oname" value="${esc(o.name)}"></div><button class="small danger" onclick="this.closest('.orgrow').remove()">ลบ</button></div>`).join('')}</div>${btn('บันทึกหน่วยงาน','saveOrgs()','primary')}</div>${superAdmin()?`<div class="card stack"><h2>รีเซ็ตเพื่อทดสอบใหม่</h2><div class="warning">ล้างคะแนนและ Line-up ทั้งหมด รวมถึงผลรับรองและคู่ชิง แต่เก็บรายชื่อนักกีฬา ทีม ตารางแมตช์ บัญชี และประวัติไว้</div>${btn('ล้างเฉพาะคะแนน (คง Line-up รอบแรก)','resetAll(true)','danger')}${btn('ล้างคะแนนและ Line-up ทั้งหมด','resetAll(false)','danger')}</div>`:''}</div>`}function addOrg(){let d=document.createElement('div');d.className='row orgrow';d.style.margin='6px 0';d.innerHTML='<div style="width:100px"><input class="oid" placeholder="รหัส"></div><div class="spacer"><input class="oname" placeholder="ชื่อหน่วยงาน"></div><button class="small danger" onclick="this.closest(\'.orgrow\').remove()">ลบ</button>';$('orgRows').appendChild(d)}function saveOrgs(){act('saveOrgs',{orgs:[...document.querySelectorAll('.orgrow')].map(e=>({id:e.querySelector('.oid').value,name:e.querySelector('.oname').value}))})}function resetAll(only){let r=reason(only?'ล้างคะแนน คง Line-up รอบแรก':'ล้างคะแนนและ Line-up ทั้งหมด');if(!r)return;let c=prompt('พิมพ์ RESET SCORES เพื่อยืนยัน');if(c==='RESET SCORES')act(only?'resetScores':'resetTournament',{reason:r,confirm:c},()=>draft=null)}
function accountPage(){return `<div class="stack"><div class="row"><h1>บัญชีเจ้าหน้าที่</h1><div class="spacer"></div>${btn('+ เพิ่มบัญชี',`accountDialog('')`,'gold')}</div><div class="card tablewrap"><table><thead><tr><th>Username</th><th>ชื่อ</th><th>Role</th><th>สนาม</th><th>สถานะ</th><th></th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${esc(a.username)}</td><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${a.court||'ทุกสนาม'}</td><td>${badge(a.active?'เปิด':'ระงับ',a.active?'ok':'warn')}</td><td>${btn('แก้ไข',`accountDialog('${a.username}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div>`}function accountDialog(un){let a=accounts.find(x=>x.username===un)||{username:'',name:'',role:'STAFF',court:1,active:true};modal(modalHead('จัดการบัญชี')+`<label>Username</label><input id="au" value="${esc(a.username)}" ${un?'readonly':''}><label>ชื่อ</label><input id="an" value="${esc(a.name)}"><label>Role</label><select id="ar">${options(['SUPER ADMIN','ADMIN','STAFF'],a.role)}</select><label>สนาม (0 = ทุกสนาม)</label><select id="ac">${options([0,1,2,3],a.court)}</select><label>Access Code (20–128 ตัวอักษร · เว้นว่างเพื่อคงรหัสเดิม)</label><input type="password" id="ap"><label><input type="checkbox" id="aa" ${a.active?'checked':''}> เปิดใช้งาน</label>${btn('บันทึก',`act('saveUser',{account:{username:formVal('au'),name:formVal('an'),role:formVal('ar'),court:Number(formVal('ac')),code:formVal('ap'),active:$('aa').checked}})`,'primary')}`)}
function downloadCsv(rows,name){let q=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"';downloadBlob('\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),name,'text/csv;charset=utf-8')}function downloadBlob(s,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportRoster(){downloadCsv([['id','name','nickname','organization','team','level','pair','active'],...data.players.map(p=>[p.id,p.name,p.nick,org(p.org),p.team,p.level,p.pair,p.active])],'DOAE-roster.csv')}function exportScores(){downloadCsv([['match','battle','team_a','team_b','type','court','wave','set1_a','set1_b','set2_a','set2_b','set_a','set_b','confirmed'],...data.matches.map(m=>{let b=byB(m.battle),s=stats(m.score);return [m.id,m.battle,b.a,b.b,m.levels.join('+'),m.court,m.wave,...(m.score?m.score.flat():['','','','']),s?.a,s?.b,b.confirmed]})],'DOAE-results.csv')}function exportBackup(){downloadBlob(JSON.stringify(data,null,2),'DOAE-private-backup.json','application/json')}
function auditPage(){return `<div class="stack"><h1>ประวัติการดำเนินการ</h1><div class="card tablewrap"><table><thead><tr><th>เวลา</th><th>ผู้ดำเนินการ</th><th>คำสั่ง</th><th>รายละเอียด</th><th>Revision</th></tr></thead><tbody>${audit.map(r=>`<tr>${r.map(v=>`<td style="white-space:normal;max-width:440px">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><small>60 รายการล่าสุด · ประวัติทั้งหมดอยู่ใน AUDIT_LOG</small></div>`}
function arenaPage(){let b=data.battles.find(b=>b.a&&!b.confirmed)||data.battles[6],s=battleStats(data,b.id);return `<div class="stack"><div class="hero"><small>LIVE ARENA · BATTLE ${b.id}</small><h1>${esc(tObj(b.a).name)} VS ${esc(tObj(b.b).name)}</h1><div class="scorebig">${s.a} : ${s.b}</div>${btn('ออกจากจอสนาม','toggleArena()')}</div><div class="matchgrid">${bm(data,b.id).map(m=>matchCard(m)).join('')}</div><div class="card">${rankingTable()}</div></div>`}
function render(){nav();status();if(!data){$('main').innerHTML=`<div class="card stack"><h1>DOAE Badminton Open #2 · V9</h1><p>กำลังโหลดข้อมูลการแข่งขันล่าสุด…</p><div class="note">${endpoint?'ตรวจสอบ Web App URL และการ Deploy':'กำหนด API_URL ในไฟล์ index.html ก่อนอัปโหลด GitHub หรือทดสอบ URL ในเบราว์เซอร์นี้'}</div><label>Web App URL (/exec)</label><input id="ep" value="${esc(endpoint)}" placeholder="https://script.google.com/macros/s/.../exec">${btn('ทดสอบการเชื่อมต่อ','setEndpoint()','primary')}</div>`;return}let f={home,ranking:()=>`<div class="card stack"><h1>อันดับทีม</h1>${rankingTable()}</div>`,results,teams,arena:arenaPage,control,roster,schedule,draw,score,settings,accounts:accountPage,audit:auditPage};if(['control','roster','schedule','draw','settings','audit','accounts'].includes(page)&&!isAdmin()||page==='accounts'&&!superAdmin()||page==='score'&&!user)page='home';$('main').innerHTML=(f[page]||home)()}
function setEndpoint(){let v=formVal('ep').trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)){toast('URL ต้องเป็น Web App /exec');return}stopLive();endpoint=v;publicState=null;publicAt=0;data=null;restorePublic();render();if(liveEnabled())startLive();else publicFallback(true)}
restorePublic();render();if(endpoint){if(liveEnabled())startLive();else publicFallback()}setInterval(()=>{if(token){if(!busy&&!document.hidden&&$('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()}},15000);setInterval(liveTick,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!token){stopLive();connected=false;status()}}else if(!token){if(liveEnabled())startLive();else publicFallback()}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()});window.addEventListener('online',()=>{if(!token){if(liveEnabled())startLive();else publicFallback(true)}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page))refresh()});window.addEventListener('offline',()=>{if(!token){connected=false;liveHealthy=false;status()}});
</script></body></html>
