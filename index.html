function generate(d,bid,opt){let b=d.battles.find(x=>x.id===bid);ensure(b&&b.a&&b.b,'ยังไม่ทราบทีม');let ms=bm(d,bid),best=null,cost=Infinity;for(let attempt=0;attempt<100;attempt++){let ls=ms.map(()=>[null,null,null,null]);for(let side of [0,1]){let tid=side?b.b:b.a,used=new Map(),counts={};let add=(i,j,id)=>{if(!id)return false;let k=ms[i].wave+'|'+id;if(used.has(k))return false;used.set(k,true);counts[id]=(counts[id]||0)+1;ls[i][2*side+j]=id;return true};for(let l of LEVELS){let pool=d.players.filter(p=>p.active&&p.team===tid&&p.level===l).map(p=>p.id);let pure=ms.map((m,i)=>m.levels[0]===l&&m.levels[1]===l?i:-1).filter(i=>i>=0),pairs=shuffled(mainPairs(d,tid,l).slice(0,pure.length));pure.forEach((i,k)=>{let p=pairs[k];if(p&&p.every(id=>!used.has(ms[i].wave+'|'+id))){add(i,0,p[0]);add(i,1,p[1])}});let slots=[];ms.forEach((m,i)=>m.levels.forEach((v,j)=>{if(v===l&&!ls[i][side*2+j])slots.push([i,j])}));for(let [i,j] of shuffled(slots)){let avail=shuffled(pool).filter(id=>!used.has(ms[i].wave+'|'+id)).sort((a,b)=>(counts[a]||0)-(counts[b]||0));if(avail.length)add(i,j,avail[0])}}}let q=quality(d,ls),v=q.missing*10000+(opt.avoid?100*q.clash:0)-q.kept;if(v<cost){cost=v;best=ls}}return ms.map((m,i)=>({id:m.id,lineup:best[i]}))}

function editPlayer(id){let p=player(data,id)||{name:'',nick:'',team:'A',level:'BABY',org:'',pair:'',active:true};modal(modalHead(id?'แก้ไขนักกีฬา':'เพิ่มนักกีฬา')+`<div class="formgrid"><div><label>ชื่อจริง</label><input id="pn" value="${esc(p.name)}"></div><div><label>ชื่อเล่น</label><input id="pk" value="${esc(p.nick)}"></div><div><label>หน่วยงาน</label><select id="po">${opt('','เลือกหน่วยงาน',p.org)}${data.orgs.map(o=>opt(o.id,o.name,p.org)).join('')}</select></div><div><label>ทีม</label><select id="pt">${IDS.map(t=>opt(t,tObj(t).name,p.team)).join('')}</select></div><div><label>ระดับมือ</label><select id="pl">${options(LEVELS,p.level)}</select></div><div><label>รหัสคู่เดิม (ถ้ามี)</label><input id="pp" value="${esc(p.pair)}"></div></div><label><input type="checkbox" id="pa" ${p.active?'checked':''}> เข้าร่วมการแข่งขัน</label><div class="actions">${btn('บันทึก',`savePlayer('${id}')`,'primary')}${id?btn('ลบรายชื่อ',`removePlayer('${id}')`,'danger'):''}</div>`)}function savePlayer(id){act('savePlayer',{player:{id,name:formVal('pn'),nick:formVal('pk'),org:formVal('po'),team:formVal('pt'),level:formVal('pl'),pair:formVal('pp'),active:$('pa').checked}})}function removePlayer(id){let r=reason('ลบรายชื่อ');if(r)act('removePlayer',{player:{id},reason:r})}function teamDialog(){modal(modalHead('แก้ชื่อและสีทีม')+data.teams.map(t=>`<div class="formgrid"><div><label>ทีม ${t.id}</label><input id="tn${t.id}" value="${esc(t.name)}"></div><div><label>สี</label><input type="color" id="tc${t.id}" value="${esc(t.color)}"></div></div>`).join('')+btn('บันทึก','saveTeams()','primary'))}function saveTeams(){act('saveTeams',{teams:IDS.map(id=>({id,name:formVal('tn'+id),color:formVal('tc'+id)}))})}
function schedule(){return `<div class="stack"><div class="row"><h1>ตารางแมตช์</h1><div class="spacer"></div>${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div><div class="note">แก้ทีมใน 6 Battle พร้อมกันได้ แต่ต้องครบทุกคู่ไม่ซ้ำ · รอบชิงกำหนดจากอันดับ · เปลี่ยนเวลาได้ทุก Battle · การเปลี่ยนประเภทจะถอน Line-up ของแมตช์ที่เกี่ยวข้อง</div>${data.battles.map(b=>`<div class="card stack"><div class="row"><h2>Battle ${b.id}${b.id===7?' · FINAL':''}</h2>${b.confirmed?badge('รับรองแล้ว','ok'):''}</div><div class="grid3"><div><label>ทีม A (ฝั่งซ้าย)</label><select id="ba${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.a)}${IDS.map(t=>opt(t,tObj(t).name,b.a)).join('')}</select></div><div><label>ทีม B (ฝั่งขวา)</label><select id="bb${b.id}" ${b.id===7||locked(b)||bm(data,b.id).some(hasScore)?'disabled':''}>${opt('','รออันดับ',b.b)}${IDS.map(t=>opt(t,tObj(t).name,b.b)).join('')}</select></div><div><label>เวลา</label><input id="bt${b.id}" value="${esc(b.time)}"></div></div><div class="tablewrap"><table><thead><tr><th>Match</th><th>มือ 1</th><th>มือ 2</th><th>สนาม</th><th>Wave</th></tr></thead><tbody>${bm(data,b.id).map(m=>{let dis=locked(b)||hasScore(m)?'disabled':'';return `<tr><td>${m.id}</td><td><select id="l1${m.id}" ${dis}>${options(LEVELS,m.levels[0])}</select></td><td><select id="l2${m.id}" ${dis}>${options(LEVELS,m.levels[1])}</select></td><td><select id="c${m.id}" ${dis}>${options([1,2,3],m.court)}</select></td><td><select id="w${m.id}" ${dis}>${options([1,2,3,4,5,6,7,8,9],m.wave)}</select></td></tr>`}).join('')}</tbody></table></div></div>`).join('')}${btn('บันทึกตารางทั้งหมด','saveSchedule()','primary')}</div>`}function saveSchedule(){act('saveSchedule',{battles:data.battles.map(b=>({id:b.id,a:formVal('ba'+b.id)||null,b:formVal('bb'+b.id)||null,time:formVal('bt'+b.id)})),matches:data.matches.map(m=>({id:m.id,levels:[formVal('l1'+m.id),formVal('l2'+m.id)],court:Number(formVal('c'+m.id)),wave:Number(formVal('w' let drawAvoid=true,drawKeep=true;function draw(){let sel=drawBattle,bs=sel==='all'?[1,2,3,4,5,6]:[Number(sel)],ms=bs.flatMap(b=>bm(data,b)),entries=draft&&draft.key===sel?draft.entries:null,can=bs.every(id=>{let b=byB(id);return b.a&&b.b&&!locked(b)&&!bm(data,id).some(hasScore)});return `<div class="stack"><div class="hero"><small>MATCH-UP DRAW CEREMONY</small><h1>สุ่มคู่แข่งขัน <span class="goldtext">VS</span></h1><p>ใช้สมาชิกทีมที่กำหนดไว้ · ไม่สุ่มย้ายทีม</p></div><div class="card stack"><div class="formgrid"><div><label>เลือกรอบ / Battle</label><select onchange="drawBattle=this.value;draft=null;render()">${opt('all','รอบแรกทั้งหมด 54 แมตช์',sel)}${data.battles.map(b=>opt(String(b.id),`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,sel)).join('')}</select></div><div><label>โหมด</label><select onchange="practice=this.value==='test';draft=null;render()">${opt('real','ทางการ',practice?'test':'real')}${opt('test','จำลอง (ไม่บันทึก)',practice?'test':'real')}</select></div></div><label><input type="checkbox" ${drawAvoid?'checked':''} onchange="drawAvoid=this.checked"> ลดการพบหน่วยงานเดียวกัน</label><label><input type="checkbox" ${drawKeep?'checked':''} disabled> รักษาคู่หลักเดิมเพื่อ Best Pair</label><div class="note">สุ่มแบบค้นหาผลที่เหมาะสม ไม่รับประกันว่าความซ้ำจะเป็น 0 · รักษาคู่หลัก 2 คู่ต่อมือ · ลงซ้ำได้ต่าง Wave · ห้ามชนสนาม · ช่องว่างต้องแก้ก่อนเริ่ม</div><div class="actions">${btn('⟳ สุ่มคู่แข่งขัน','runDraw()','gold',!practice&&!can||bs.some(id=>!byB(id).a))}${btn('เล่นเอฟเฟกต์ซ้ำ','replayDraw()','',!entries&&!ms.some(m=>m.published))}${btn('ประกาศ Line-up','publishDraft()','primary',!entries||practice||!can)}${btn('ถอนประกาศ / รีเซ็ต','resetLineups()','danger',practice||!can)}${btn('ดาวน์โหลด CSV','exportLineups()')}</div>${entries?`<div class="${practice?'warning':'note'}">${practice?'ผลจำลอง ไม่บันทึกฐานข้อมูล':'ผลร่าง ยังไม่ประกาศ'} · ${entries.length} แมตช์ · หน่วยงานชน ${quality(data,entries.map(e=>e.lineup)).clash} · ช่องว่าง ${quality(data,e async function refImportFile(el){try{let x=JSON.parse(await el.files[0].text());if(confirm('แทนที่คะแนนด้วยข้อมูลสำรอง?'))act('refImport',{backup:x,confirm:'IMPORT'})}catch(e){toast('ไฟล์ไม่ถูกต้อง')}finally{el.value=''}}
function refReset(){if(prompt('พิมพ์ RESET SCORES เพื่อยืนยัน')==='RESET SCORES'){let r=reason('ล้างคะแนนและคูปอง');if(r)act('refReset',{confirm:'RESET SCORES',reason:r})}}
function refRoster(){let list=data.players.filter(p=>p.active&&(rosterFilter==='all'||p.team===rosterFilter));return `<div class="stack"><h1>ทะเบียนนักกีฬา</h1><div class="note">64 คน · Player ID และคู่คงตามทะเบียนทางการ · แก้ชื่อหรือหน่วยงานได้ก่อนลงแข่ง</div><div class="card stack"><select onchange="rosterFilter=this.value;render()">${opt('all','ทุกทีม',rosterFilter)}${IDS.map(t=>opt(t,tObj(t).name,rosterFilter)).join('')}</select><div class="tablewrap"><table><thead><tr><th>Player ID</th><th>ชื่อ / ชื่อเล่น</th><th>หน่วยงาน</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(tagOf(p))}</td><td>${esc(p.name)}<small> ${esc(p.nick)}</small></td><td>${esc(org(p.org))}</td><td>${btn('แก้ไข',`refEditPlayer('${esc(p.id)}')`,'small',data.matches.some(m=>m.lineup?.includes(p.id)&&hasScore(m)))}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function refEditPlayer(id){let p=player(data,id);modal(modalHead('แก้ไข '+tagOf(p))+`<label>ชื่อจริง</label><input id="refName" value="${esc(p.name)}"><label>ชื่อเล่น</label><input id="refNick" value="${esc(p.nick)}"><label>หน่วยงาน</label><select id="refOrg">${data.orgs.map(o=>opt(o.id,o.name,p.org)).join('')}</select><div class="actions">${btn('บันทึก',`refSavePlayer('${esc(id)}')`,'primary')}</div>`)}
function refSavePlayer(id){let p=player(data,id);act('savePlayer',{player:{...p,name:formVal('refName'),nick:formVal('refNick'),org:formVal('refOrg')}})}
function refSettings(){return `<div class="stack"><h1>ตั้งค่ารายการ</h1><div class="card stack"><label>ชื่อรายการ</label><input id="refEvent" value="${esc(data.event)}"><label>วันที่</label><input id="refDate" value="${esc(data.date)}"><label>สถานที่</label><input id="refVenue" value="${esc(data.venue)}">${btn('บันทึก',"act('saveSettings',{event:formVal('refEvent'),date:formVal('refDate'),venue:formVal('refVenue')})",'primary')}</div></div>`}
function refPlayerCards(){let q=refRosterQuery.trim().toLowerCase(),ps=data.players.filter(p=>p.active&&(refRosterTeam==='all'||refRosterTeam===p.team)&&(refRosterLevel==='all'||refRosterLevel===p.level)&&[tagOf(p),p.name,p.nick,org(p.org)].join(' ').toLowerCase().includes(q));return `<p class="muted">${ps.length} คน</p><div class="stack">${data.teams.filter(t=>ps.some(p=>p.team===t.id)).map(t=>`<section class="card stack" style="border-top:5px solid ${esc(t.color)}"><h2>${team(t.id)}</h2>${LEVELS.filter(l=>ps.some(p=>p.team===t.id&&p.level===l)).map(l=>`<div class="rosterLevel95 stack"><h3>${levelText94(l)}</h3><div class="refPairGrid97">${Array.from({length:l==='BABY'?2:3},(_,i)=>{let slot=levelText94(l)+(i+1),group=ps.filter(p=>p.team===t.id&&p.level===l&&Math.ceil(Number(tagOf(p).slice(-2))/2)===i+1).sort((a,b)=>tagOf(a).localeCompare(tagOf(b)));return group.length?`<div class="refPair97"><div class="refPairTitle97">คู่ที่ ${slot}</div>${group.map(p=>`<div class="rosterRow95"><b>${esc(tagOf(p))}</b><div><strong>${esc(p.name)}</strong><small>${esc(p.nick)} · ${esc(org(p.org))}</small></div></div>`).join('')}</div>`:''}).join('')}</div></div>`).join('')}</section>`).join('')||'<div class="empty">ไม่พบรายชื่อ</div>'}</div>`}
function refPlayers(){return `<div class="stack"><h1>PLAYERS · รายชื่อนักกีฬา</h1><div class="card stack"><div class="actions">${['all',...IDS].map(t=>btn(t==='all'?'ทุกทีม':'TEAM '+t,`viewerTeam97('${t}')`,refRosterTeam===t?'primary':'')).join('')}</div><div class="actions">${['all',...LEVELS].map(l=>btn(l==='all'?'ทุกมือ':levelText94(l),`viewerLevel97('${l}')`,refRosterLevel===l?'primary':'')).join('')}</div><input id="refPlayerSearch" type="search" placeholder="ค้นหา Player ID / ชื่อ / หน่วยงาน" value="${esc(refRosterQuery)}" oninput="refRosterQuery=this.value;document.getElementById('refPlayerCards').innerHTML=refPlayerCards()"></div><div id="refPlayerCards">${refPlayerCards()}</div></div>`}
score=refScorePage;control=refControl;roster=refRoster;settings=refSettings;teams=refPlayers;
function refereeAccess97(){return `<div class="stack"><div class="card stack"><h1>Referee Access</h1><div class="note">${pinConfigured97?'ตั้งรหัสกรรมการแล้ว':'ยังไม่ได้ตั้งรหัสกรรมการ'} · กรรมการกรอกชื่อเองและใช้ PIN ร่วมกัน · เปลี่ยน PIN จะยกเลิกเซสชันกรรมการทั้งหมด</div><label>ตั้ง PIN ใหม่ (2–12 หลัก)</label><input id="newRefPin97" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password"><label>ยืนยัน PIN</label><input id="confirmRefPin97" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password">${btn('บันทึกรหัสกรรมการ','saveRefPin97()','primary')}<small>แนะนำอย่างน้อย 6 หลัก · กรอกผิด 5 ครั้งจะระงับการล็อกอินกรรมการชั่วคราว 10 นาที</small></div></div>`}
async function saveRefPin97(){let pin=formVal('newRefPin97');if(!/^\d{2,12}$/.test(pin)||pin!==formVal('confirmRefPin97')){toast('PIN ต้องเป็นตัวเลข 2–12 หลัก และยืนยันตรงกัน');return}if(confirm('ตั้ง PIN ใหม่และออกจากระบบกรรมการทุกคน?'))await act('setRefereePin',{pin})}
function viewerFilters97(teamValue,levelValue,teamFn,levelFn){return `<div class="card stack"><div class="quickTeams">${IDS.map(t=>quickTeamBtn94(t)).join('')}</div><div class="actions">${btn('ทุกทีม',teamFn+"('all')",teamValue==='all'?'primary':'')}${['all',...LEVELS].map(l=>btn(l==='all'?'ทุกมือ':levelText94(l),levelFn+"('"+l+"')",levelValue===l?'primary':'')).join('')}</div></div>`}
function viewerTeam97(t){filter94.team=t;refRosterTeam=t;refBestTeam=t;render();let el=document.querySelectorAll('.teamQuickBtn')[IDS.indexOf(t)];if(el&&el.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)el.animate([{transform:'translateY(4px)'},{transform:'translateY(0)'}],{duration:190,easing:'ease-out'})}
function viewerLevel97(l){filter94.level=l;refRosterLevel=l;bestLevel94=l;render()}
selectTeam94=viewerTeam97;
function bestViewer97(){let ls=bestLevel94==='all'?LEVELS:[bestLevel94];return `<div class="stack"><h1>BEST PAIR</h1><p class="muted">คำนวณจาก Round Robin เท่านั้น · PD / ชนะเซต / แต้มได้</p>${viewerFilters97(filter94.team,bestLevel94,'viewerTeam97','viewerLevel97')}${ls.map(l=>`<section class="card stack"><h2>${levelText94(l)}</h2><div class="tablewrap">${bestTable94(bestPairs(data,l).filter(r=>filter94.team==='all'||r.team===filter94.team))}</div></section>`).join('')}</div>`}
bestPage94=bestViewer97;bestLevel94='all';

window.addEventListener('beforeunload',e=>{if(Object.keys(refDrafts).length){e.preventDefault();e.returnValue=''}});

restorePublic();render();if(endpoint){if(liveEnabled())startLive();else publicFallback()}setInterval(()=>{if(token){if(!busy&&!document.hidden&&$('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page)&&!(page==='score'&&(Object.keys(refDrafts).length||document.activeElement?.id==='refNote')))refresh()}},15000);setInterval(liveTick,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!token){stopLive();connected=false;status()}}else if(!token){if(liveEnabled())startLive();else publicFallback()}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page)&&!(page==='score'&&(Object.keys(refDrafts).length||document.activeElement?.id==='refNote')))refresh()});window.addEventListener('online',()=>{if(!token){if(liveEnabled())startLive();else publicFallback(true)}else if($('modal').hidden&&$('ceremony').hidden&&!['roster','schedule','draw','settings','accounts'].includes(page)&&!(page==='score'&&(Object.keys(refDrafts).length||document.activeElement?.id==='refNote')))refresh()});window.addEventListener('offline',()=>{if(!token){connected=false;liveHealthy=false;status()}});
</script></body></html>
