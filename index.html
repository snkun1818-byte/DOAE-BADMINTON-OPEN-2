function battleStats(d,id){let b=d.battles.find(b=>b.id===id),s={a:0,b:0,ra:0,rb:0,done:0,winner:null};for(let m of bm(d,id)){let q=stats(m.score,scoreLimit(m));if(q){s.done++;for(let k of ['a','b','ra','rb'])s[k]+=q[k]}}if(s.done===bm(d,id).length&&s.done){s.winner=s.ra!==s.rb?(s.ra>s.rb?b.a:b.b):b.golden||null}return s}

function validateLineups(d,bid){let b=d.battles.find(b=>b.id===bid);ensure(b&&b.a&&b.b,'ยังไม่ทราบทีม');let seen=new Set();for(let m of bm(d,bid)){if(!m.lineup)continue;ensure(Array.isArray(m.lineup)&&m.lineup.length===4,'Line-up ไม่ถูกต้อง');for(let i=0;i<4;i++){let id=m.lineup[i];if(id===null)continue;let p=player(d,id);ensure(p&&p.active&&p.team===(i<2?b.a:b.b)&&p.level===m.levels[i%2],'ผู้เล่นไม่ตรงทีม/ระดับมือ: Match '+m.id);let k=m.wave+'|'+id;ensure(!seen.has(k),'นักกีฬาลงซ้ำใน Wave '+m.wave+' ของ Battle '+bid);seen.add(k)}}return true}

function generate(d,bid,opt){let b=d.battles.find(x=>x.id===bid);ensure(b&&b.a&&b.b,'ยังไม่ทราบทีม');let ms=bm(d,bid),best=null,cost=Infinity;for(let attempt=0;attempt<100;attempt++){let ls=ms.map(()=>[null,null,null,null]);for(let side of [0,1]){let tid=side?b.b:b.a,used=new Map(),counts={};let add=(i,j,id)=>{if(!id)return false;let k=ms[i].wave+'|'+id;if(used.has(k))return false;used.set(k,true);counts[id]=(counts[id]||0)+1;ls[i][2*side+j]=id;return true};for(let l of LEVELS){let pool=d.players.filter(p=>p.active&&p.team===tid&&p.level===l).map(p=>p.id);let pure=ms.map((m,i)=>m.levels[0]===l&&m.levels[1]===l?i:-1).filter(i=>i>=0),pairs=shuffled(mainPairs(d,tid,l).slice(0,pure.length));pure.forEach((i,k)=>{let p=pairs[k];if(p&&p.every(id=>!used.has(ms[i].wave+'|'+id))){add(i,0,p[0]);add(i,1,p[1])}});let slots=[];ms.forEach((m,i)=>m.levels.forEach((v,j)=>{if(v===l&&!ls[i][side*2+j])slots.push([i,j])}));for(let [i,j] of shuffled(slots)){let avail=shuffled(pool).filter(id=>!used.has(ms[i].wave+'|'+id)).sort((a,b)=>(counts[a]||0)-(counts[b]||0));if(avail.length)add(i,j,avail[0])}}}let q=quality(d,ls),v=q.missing*10000+(opt.avoid?100*q.clash:0)-q.kept;if(v<cost){cost=v;best=ls}}return ms.map((m,i)=>({id:m.id,lineup:best[i]}))}

let drawAvoid=true,drawKeep=true;function draw(){let sel=drawBattle,bs=sel==='all'?[1,2,3,4,5,6]:[Number(sel)],ms=bs.flatMap(b=>bm(data,b)),entries=draft&&draft.key===sel?draft.entries:null,can=bs.every(id=>{let b=byB(id);return b.a&&b.b&&!locked(b)&&!bm(data,id).some(hasScore)});return `<div class="stack"><div class="hero"><small>MATCH-UP DRAW CEREMONY</small><h1>สุ่มคู่แข่งขัน <span class="goldtext">VS</span></h1><p>ใช้สมาชิกทีมที่กำหนดไว้ · ไม่สุ่มย้ายทีม</p></div><div class="card stack"><div class="formgrid"><div><label>เลือกรอบ / Battle</label><select onchange="drawBattle=this.value;draft=null;render()">${opt('all','รอบแรกทั้งหมด 54 แมตช์',sel)}${data.battles.map(b=>opt(String(b.id),`Battle ${b.id} · ${tObj(b.a).name} VS ${tObj(b.b).name}`,sel)).join('')}</select></div><div><label>โหมด</label><select onchange="practice=this.value==='test';draft=null;render()">${opt('real','ทางการ',practice?'test':'real')}${opt('test','จำลอง (ไม่บันทึก)',practice?'test':'real')}</select></div></div><label><input type="checkbox" ${drawAvoid?'checked':''} onchange="drawAvoid=this.checked"> ลดการพบหน่วยงานเดียวกัน</label><label><input type="checkbox" ${drawKeep?'checked':''} disabled> รักษาคู่หลักเดิมเพื่อ Best Pair</label><div class="note">สุ่มแบบค้นหาผลที่เหมาะสม ไม่รับประกันว่าความซ้ำจะเป็น 0 · รักษาคู่หลัก 2 คู่ต่อมือ · ลงซ้ำได้ต่าง Wave · ห้ามชนสนาม · ช่องว่างต้องแก้ก่อนเริ่ม</div><div class="actions">${btn('⟳ สุ่มคู่แข่งขัน','runDraw()','gold',!practice&&!can||bs.some(id=>!byB(id).a))}${btn('เล่นเอฟเฟกต์ซ้ำ','replayDraw()','',!entries&&!ms.some(m=>m.published))}${btn('ประกาศ Line-up','publishDraft()','primary',!entries||practice||!can)}${btn('ถอนประกาศ / รีเซ็ต','resetLineups()','danger',practice||!can)}${btn('ดาวน์โหลด CSV','exportLineups()')}</div>${entries?`<div class="${practice?'warning':'note'}">${practice?'ผลจำลอง ไม่บันทึกฐานข้อมูล':'ผลร่าง ยังไม่ประกาศ'} · ${entries.length} แมตช์ · หน่วยงานชน ${quality(data,entries.map(e=>e.lineup)).clash} · ช่องว่าง ${quality(data,e
