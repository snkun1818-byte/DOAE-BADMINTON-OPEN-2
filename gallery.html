</style></head><body><header><div class="head"><div><small>DOAE BADMINTON OPEN #2</small><h1>Event Gallery</h1><p>ภาพบรรยากาศการแข่งขัน · 28 พฤศจิกายน 2569</p></div><div class="galleryActions9815"><a class="upload9815" href="https://script.google.com/macros/s/AKfycbwy0cqPlPjD2VHppDmp97-RaEl9Ri-eOLa2jV9y_yoWUQxAGYHzctPz0xUPORrKhCz1FA/exec" target="_blank" rel="noopener noreferrer">อัปโหลดภาพ</a><a class="back" href="./index.html">กลับหน้าการแข่งขัน</a></div></div></header><main><section id="stage" class="stage"><div class="screen"><div class="empty" id="empty"><strong>EVENT GALLERY</strong><span id="message">กำลังตรวจสอบภาพกิจกรรม</span></div><img id="hero" alt="ภาพบรรยากาศการแข่งขัน" hidden></div><div class="controls"><button id="prev" disabled>‹ ก่อนหน้า</button><button id="play" disabled>▶ เล่นสไลด์</button><button id="next" disabled>ถัดไป ›</button><span class="counter" id="counter">0 / 0</span><button id="full">เต็มหน้าจอ</button></div></section><div class="meta"><span id="status" role="status">กำลังเตรียมระบบ</span><button id="refresh">ตรวจสอบภาพใหม่</button></div><h2 style="font-size:19px;margin-bottom:12px">ภาพกิจกรรม</h2><div class="thumbs" id="thumbs"></div><button class="more" id="more" hidden>แสดงภาพเพิ่มเติม</button><p style="color:#667990;font-size:13px;margin:18px 0">แสดงเฉพาะภาพที่ทีมงานอนุมัติ · รูปภาพสำหรับเว็บไซต์ผ่าน CDN ไม่เชื่อมต่อระบบคะแนน</p></main><script>
// ตั้งเฉพาะ Cloud name (ข้อมูลสาธารณะ); ห้ามใส่ API key/secret หรือ password ในไฟล์นี้
const CLOUD_NAME = 'uivmldyc';
const embedded9815=window.parent!==window&&new URLSearchParams(location.search).get('embed')==='1';
if(embedded9815){document.documentElement.classList.add('embedded9815');const reportHeight9815=()=>{if(document.fullscreenElement)return;const m=document.querySelector('main');if(m)parent.postMessage({type:'doae-gallery-height',height:Math.ceil(m.getBoundingClientRect().bottom+window.scrollY+12)},location.origin)};const ob9815=new ResizeObserver(reportHeight9815);ob9815.observe(document.querySelector('main'));ob9815.observe(document.querySelector('header'));window.addEventListener('resize',reportHeight9815);document.addEventListener('fullscreenchange',reportHeight9815);reportHeight9815();}
const TAG = 'doae_open2_2026_public';
const REFRESH_MS=180000, SLIDE_MS=8000, LIMIT=150;
const $=x=>document.getElementById(x);let photos=[],pos=0,playing=false,timer=null,poll=null,loading=false,shown=12,lastFetch=0,renderGeneration=0;
function url(p){return 'https://res.cloudinary.com/'+CLOUD_NAME+'/image/upload/'+(p.version?'v'+p.version+'/':'')+p.public_id+'.jpg'}
function controls(){const yes=photos.length>0;for(const id of ['prev','next','play'])$(id).disabled=!yes;$('play').textContent=playing?'❚❚ หยุดสไลด์':'▶ เล่นสไลด์';$('counter').textContent=yes?(pos+1)+' / '+photos.length:'0 / 0';$('more').hidden=shown>=photos.length}
function display(){controls();const p=photos[pos];if(!p){++renderGeneration;$('hero').onload=null;$('hero').onerror=null;$('hero').hidden=true;$('hero').removeAttribute('src');$('empty').hidden=false;return}const gen=++renderGeneration;const src=url(p);$('hero').onload=()=>{if(gen!==renderGeneration)return;$('hero').hidden=false;$('empty').hidden=true};$('hero').onerror=()=>{if(gen!==renderGeneration)return;$('hero').hidden=true;$('empty').hidden=false;$('message').textContent='โหลดภาพนี้ไม่ได้ กรุณาเลือกภาพถัดไป'};if($('hero').getAttribute('src')!==src){$('hero').hidden=true;$('empty').hidden=false;$('message').textContent='กำลังโหลดภาพ';$('hero').src=src}else if($('hero').complete&&$('hero').naturalWidth){$('hero').hidden=false;$('empty').hidden=true}document.querySelectorAll('.thumb').forEach(b=>b.classList.toggle('current',b.dataset.id===p.public_id))}
function thumbs(){const el=$('thumbs');el.replaceChildren();for(const [i,p] of photos.slice(0,shown).entries()){const b=document.createElement('button');b.className='thumb'+(i===pos?' current':'');b.dataset.id=p.public_id;b.setAttribute('aria-label','ดูภาพ '+(i+1));const im=new Image();im.loading='lazy';im.decoding='async';im.alt='ภาพกิจกรรม '+(i+1);im.src=url(p);b.append(im);b.onclick=()=>{pos=i;display();restart()};el.append(b)}controls()}
function restart(){clearInterval(timer);timer=null;if(playing&&!document.hidden&&photos.length>1)timer=setInterval(()=>step(1),SLIDE_MS)}function step(n){if(photos.length){pos=(pos+n+photos.length)%photos.length;display()}}
$('prev').onclick=()=>{step(-1);restart()};$('next').onclick=()=>{step(1);restart()};$('play').onclick=()=>{playing=!playing;controls();restart()};$('more').onclick=()=>{shown+=12;thumbs()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen()}catch(e){$('status').textContent='เบราว์เซอร์นี้ไม่รองรับโหมดเต็มหน้าจอ'}};document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'ออกจากเต็มจอ':'เต็มหน้าจอ');
async function refresh(manual=false){if(loading||document.hidden||(!manual&&Date.now()-lastFetch<REFRESH_MS-1000))return;if(manual&&Date.now()-lastFetch<15000){$('status').textContent='เพิ่งตรวจสอบภาพล่าสุด กรุณารอสักครู่';return}if(CLOUD_NAME==='YOUR_CLOUD_NAME'||!/^[a-zA-Z0-9_-]+$/.test(CLOUD_NAME)){$('message').textContent='ผู้ดูแลยังไม่ได้ตั้งค่า Cloud name';$('status').textContent='ยังไม่เชื่อมต่อ CDN';return}loading=true;lastFetch=Date.now();$('refresh').disabled=true;try{const r=await fetch('https://res.cloudinary.com/'+CLOUD_NAME+'/image/list/'+TAG+'.json',{signal:AbortSignal.timeout(15000)});if(!r.ok&&r.status!==404)throw Error('CDN HTTP '+r.status);let list=[];if(r.ok){const j=await r.json();if(!Array.isArray(j.resources))throw Error('รายการภาพไม่ถูกต้อง');list=j.resources.filter(p=>/^doaeopen2_[a-f0-9]{32}$/.test(p.public_id)&&p.format==='jpg'&&(!p.version||/^\d+$/.test(String(p.version)))).slice(0,LIMIT)}const unique=new Map(list.map(x=>[x.public_id,x]));const latest=[...unique.values()].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||a.public_id.localeCompare(b.public_id));const oldId=photos[pos]?.public_id;const changed=latest.map(x=>x.public_id+':'+x.version).join()!==photos.map(x=>x.public_id+':'+x.version).join();photos=latest;pos=Math.max(0,photos.findIndex(p=>p.public_id===oldId));if(!photos.length){playing=false;$('message').textContent='ยังไม่มีภาพที่เผยแพร่ หรือรายการภาพยังไม่พร้อม'}if(changed)thumbs();display();restart();$('status').textContent=photos.length+' ภาพ · ตรวจสอบล่าสุด '+new Date().toLocaleTimeString('th-TH')+' · อัปเดตทุก 3 นาที'}catch(e){$('status').textContent='เชื่อมต่อ Gallery ไม่สำเร็จ · จะลองใหม่อัตโนมัติ';if(!photos.length)$('message').textContent='ยังโหลดภาพไม่ได้ กรุณาลองใหม่ภายหลัง'}finally{loading=false;$('refresh').disabled=false}}
$('refresh').onclick=()=>refresh(true);function schedule(){clearInterval(poll);poll=null;if(!document.hidden){refresh();poll=setInterval(refresh,REFRESH_MS)}}document.addEventListener('visibilitychange',()=>{schedule();restart()});window.addEventListener('pagehide',()=>{clearInterval(poll);clearInterval(timer)});window.addEventListener('pageshow',()=>{schedule();restart()});schedule();
</script></body></html>
